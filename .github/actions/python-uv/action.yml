name: Python and uv
description: >-
  The repository's one CPython and uv pin. Every workflow installs them here, never by
  repeating a version. The Dockerfile pins the same versions as container image tags; a test
  keeps them equal to the pins below.

inputs:
  python:
    description: >-
      'true' installs the pinned CPython with actions/setup-python and uv into it. 'false'
      keeps the runner's system python3 first on PATH and installs uv with pipx: base-image.yml
      needs that, because rpi-image-gen's install_deps.sh provisions its modules into the
      system python3, which setup-python would shadow for the whole job.
    required: false
    default: 'true'

outputs:
  uv-version:
    description: The pinned uv version, for an install this action cannot reach (a container)
    value: ${{ steps.pins.outputs.uv }}

runs:
  using: composite
  steps:
    - name: Read the pins
      id: pins
      shell: bash
      run: |
        {
          echo "python=3.12.11"
          echo "uv=0.7.8"
        } >> "$GITHUB_OUTPUT"
    - if: inputs.python == 'true'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ steps.pins.outputs.python }}
    - name: Install uv into the pinned CPython
      if: inputs.python == 'true'
      shell: bash
      env:
        UV_VERSION: ${{ steps.pins.outputs.uv }}
      run: python -m pip install "uv==$UV_VERSION"
    - name: Install uv beside the system python3
      if: inputs.python != 'true'
      shell: bash
      env:
        UV_VERSION: ${{ steps.pins.outputs.uv }}
      run: pipx install "uv==$UV_VERSION"
