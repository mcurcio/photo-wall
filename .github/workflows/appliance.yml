name: ARM appliance build and launch

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      prepare_base:
        description: Prepare a missing builder or OS base for the current definition
        required: false
        default: false
        type: boolean
      scope:
        description: Appliance qualification scope
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
  # Reused by release.yml only, to rebuild the 0009 release assets (the
  # minimal base OS image + the Player .deb) for an already-qualified
  # definition/revision. This never runs the push/pull_request/workflow_dispatch
  # jobs below (each excludes this event explicitly) -- only the dedicated
  # release-artifacts job does. Per the 0009 owner ruling (home LAN, no threat
  # model, UX over security) nothing published here is signed, so this call
  # takes no signing secret.
  workflow_call:
    inputs:
      revision:
        description: Exact 40-character commit to build for release
        required: true
        type: string
    outputs:
      artifact_name:
        description: Name of the uploaded release build output artifact
        value: ${{ jobs.release-artifacts.outputs.artifact_name }}

permissions:
  contents: read

concurrency:
  group: appliance-${{ github.ref }}
  # Finish the current image benchmark while keeping the newest revision pending.
  cancel-in-progress: false

jobs:
  select-definition:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      qualify: ${{ steps.definition.outputs.qualify }}
      builder_key: ${{ steps.definition.outputs.builder_key }}
      base_key: ${{ steps.definition.outputs.base_key }}
      prepare_builder: ${{ steps.definition.outputs.prepare_builder }}
      prepare_base: ${{ steps.definition.outputs.prepare_base }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare declared image inputs with the previous revision
        id: definition
        env:
          # Compare against the branch this change lands on, never against an
          # earlier commit of this same PR. On a pull_request event
          # github.event.before is the PR branch's PREVIOUS head, so preferring
          # it compares a definition against itself and wrongly infers that a
          # base/builder artifact is already published (then fails closed on the
          # missing pull). Pin the PR comparison to base.sha; only push events
          # (base.sha empty) fall through to before, comparing to prior main.
          COMPARE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.sha }}
          # A doc-only follow-up must still qualify substantive changes in the PR.
          QUALIFICATION_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.sha }}
          FORCE_PREPARE: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_base || false }}
        run: |
          force_args=()
          if [[ "$FORCE_PREPARE" == "true" ]]; then force_args=(--force); fi
          python3 -m scripts.ci_images plan --compare "$COMPARE_REVISION" \
            --qualification-compare "$QUALIFICATION_REVISION" "${force_args[@]}"
      - name: Check documentation links and structure
        run: python3 scripts/check_docs.py

  service-base:
    needs: select-definition
    if: needs.select-definition.outputs.qualify == 'true' && github.event_name == 'workflow_dispatch' && inputs.scope == 'full'
    uses: ./.github/workflows/service-base.yml
    permissions:
      contents: read
      packages: write
    with:
      architecture: arm64
      prepare_base: ${{ inputs.prepare_base }}

  build-and-boot:
    if: >-
      always() && github.event_name != 'workflow_call' &&
      (needs.select-definition.result != 'success' || needs.select-definition.outputs.qualify == 'true')
    needs: [select-definition, service-base]
    permissions:
      contents: read
      packages: write
    # A builder identity is also an OS definition input. Serialize its candidate
    # publication so concurrent PRs cannot replace the same definition tag.
    concurrency:
      group: appliance-definition-${{ needs.select-definition.outputs.builder_key }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      APPLIANCE_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'smoke' }}
      CAN_PUBLISH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      BUILDER_KEY: ${{ needs.select-definition.outputs.builder_key }}
      BASE_KEY: ${{ needs.select-definition.outputs.base_key }}
      PREPARE_BUILDER: ${{ needs.select-definition.outputs.prepare_builder }}
      PREPARE_BASE: ${{ needs.select-definition.outputs.prepare_base }}
    steps:
      - name: Require a valid image definition selection
        env:
          SELECTION: ${{ needs.select-definition.result }}
          MEDIA_SELECTION: ${{ needs.service-base.result }}
        run: |
          test "$SELECTION" = success
          if [[ "$APPLIANCE_SCOPE" == full ]]; then test "$MEDIA_SELECTION" = success; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check the Player service sandbox before image assembly
        timeout-minutes: 3
        run: sudo python3 scripts/check_player_unit.py

      - name: Authenticate to the durable image registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Set up the container build cache
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build or restore the central image
        id: central
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: central
          platforms: linux/arm64
          load: true
          tags: photo-wall-central:ci
          cache-from: type=gha,scope=photo-wall-central-arm64-v1
          cache-to: type=gha,scope=photo-wall-central-arm64-v1,mode=max,ignore-error=true

      - name: Build or restore the media worker image
        if: env.APPLIANCE_SCOPE == 'full'
        id: worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: media-worker
          build-args: MEDIA_BASE_IMAGE=${{ needs.service-base.outputs.image }}
          platforms: linux/arm64
          load: true
          tags: photo-wall-appliance-worker:ci
          cache-from: |
            type=gha,scope=photo-wall-central-arm64-v1
            type=gha,scope=photo-wall-worker-arm64-v1
          cache-to: type=gha,scope=photo-wall-worker-arm64-v1,mode=max,ignore-error=true

      - name: Pull the exact builder or prepare a changed definition
        id: builder
        run: |
          args=()
          if [[ "$PREPARE_BUILDER" == "true" ]]; then args+=(--allow-build); fi
          if [[ "$CAN_PUBLISH" == "true" ]]; then args+=(--publish); fi
          python3 -m scripts.ci_images builder \
            --namespace "${GITHUB_REPOSITORY,,}" --key "$BUILDER_KEY" "${args[@]}"

      - name: Qualify signed APT cache admission in the pinned builder
        run: >-
          docker run --rm --platform linux/arm64 --network none
          --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work
          --env PHOTO_WALL_APT_CACHE_TESTS=1
          "${{ steps.builder.outputs.imageid }}"
          python3.12 -m pytest --noconftest -q -p no:cacheprovider
          tests/test_apt_cache_linux.py

      # A freshly built base is also retained under an unqualified
      # candidate-<base_key> tag (with --publish) so a retry after a later
      # failure (e.g. boot) restores it instead of rebuilding. base_key is
      # the definition's content identity, so reuse is safe by construction.
      # The authoritative definition-<base_key> tag is still published only
      # after a green boot, unchanged, by the step below.
      - name: Pull the matching OS base or prepare a changed definition
        id: os-base
        env:
          BUILDER_IMAGE: ${{ steps.builder.outputs.image }}
          BUILDER_CONFIG: ${{ steps.builder.outputs.imageid }}
        run: |
          args=()
          if [[ "$PREPARE_BASE" == "true" ]]; then args+=(--allow-build); fi
          if [[ "$CAN_PUBLISH" == "true" ]]; then args+=(--publish); fi
          python3 -m scripts.ci_images base \
            --namespace "${GITHUB_REPOSITORY,,}" --key "$BASE_KEY" \
            --output "$RUNNER_TEMP/photo-wall-os-base" \
            --builder-image "$BUILDER_IMAGE" --builder-config "$BUILDER_CONFIG" "${args[@]}"

      - name: Build the Player package from the current application revision
        env:
          BUILDER_IMAGE: ${{ steps.builder.outputs.imageid }}
        run: |
          docker run --rm --platform linux/arm64 \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP" \
            --workdir "$GITHUB_WORKSPACE" \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            "$BUILDER_IMAGE" python3.12 -m scripts.build_player \
              --repository "$GITHUB_WORKSPACE" --revision "$GITHUB_SHA" \
              --output "$RUNNER_TEMP/photo-wall-player-package"

      - name: Pull the pinned PostgreSQL fixture image
        run: docker pull postgres:16.9-bookworm@sha256:253815cf7579ffa05e1673d92e78d37273e61be0e4414e9a1449337d7925be94

      - name: Assemble the signed image and generic boot artifact
        id: assemble
        env:
          CENTRAL_IMAGE: ${{ steps.central.outputs.imageid }}
          BUILDER_IMAGE: ${{ steps.builder.outputs.imageid }}
          OS_BASE_IMAGE: ${{ steps.os-base.outputs.image }}
          OS_BASE_BUILDER_IMAGE: ${{ steps.builder.outputs.image }}
          WORKER_IMAGE: ${{ steps.worker.outputs.imageid }}
        run: |
          ci_root="$RUNNER_TEMP/photo-wall-ci"
          install -d -m 0700 "$ci_root"
          worker_args=()
          if [[ "$APPLIANCE_SCOPE" == "full" ]]; then
            test -n "$WORKER_IMAGE"
            worker_args=(--worker-image "$WORKER_IMAGE")
          fi
          docker run --rm --platform linux/arm64 --network none \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP" \
            --workdir "$GITHUB_WORKSPACE" \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env GITHUB_ACTIONS=true \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            "$BUILDER_IMAGE" \
            python3.12 -m scripts.build_ci_image \
              --repository "$GITHUB_WORKSPACE" \
              --revision "$GITHUB_SHA" \
              --output-dir "$ci_root/output" \
              --deployment-dir "$ci_root/deployment" \
              --os-base "$RUNNER_TEMP/photo-wall-os-base" \
              --player-package "$RUNNER_TEMP/photo-wall-player-package" \
              --os-base-builder-image "$OS_BASE_BUILDER_IMAGE" \
              --os-base-image "$OS_BASE_IMAGE" \
              --central-image "$CENTRAL_IMAGE" \
              --builder-image "$BUILDER_IMAGE" \
              "${worker_args[@]}"
          sudo chown -R "$(id -u):$(id -g)" "$ci_root/output" "$ci_root/deployment"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'

      - name: Install the locked e2e harness environment
        run: |
          python -m pip install uv==0.7.8
          uv sync --frozen

      - name: Boot the exact artifact and launch the production Player
        env:
          CENTRAL_IMAGE: ${{ steps.central.outputs.imageid }}
          BUILDER_IMAGE: ${{ steps.builder.outputs.imageid }}
          WORKER_IMAGE: ${{ steps.worker.outputs.imageid }}
          PHOTO_WALL_DOCKER_DEBUG: '1'
          PHOTO_WALL_DOCKER_DEBUG_LOG: ${{ runner.temp }}/photo-wall-ci/docker-debug.log
        run: |
          ci_root="$RUNNER_TEMP/photo-wall-ci"
          worker_args=()
          if [[ "$APPLIANCE_SCOPE" == "full" ]]; then
            test -n "$WORKER_IMAGE"
            worker_args=(--worker-image "$WORKER_IMAGE")
          fi
          .venv/bin/python -m scripts.test_appliance_e2e \
            --manifest "$ci_root/output/ci-image.json" \
            --state "$ci_root/e2e-state" \
            --report "$ci_root/e2e-report.json" \
            --central-image "$CENTRAL_IMAGE" \
            --builder-image "$BUILDER_IMAGE" \
            --scope "$APPLIANCE_SCOPE" \
            "${worker_args[@]}"

      - name: Retain the newly qualified OS definition in the registry
        if: steps.os-base.outputs.built == 'true' && env.CAN_PUBLISH == 'true'
        id: publish-base
        run: |
          python3 -m scripts.ci_images publish-base \
            --namespace "${GITHUB_REPOSITORY,,}" --key "$BASE_KEY" \
            --output "$RUNNER_TEMP/photo-wall-os-base"

      - name: Record the published OS base reference
        if: steps.publish-base.outputs.image != ''
        env:
          PUBLISHED_BASE: ${{ steps.publish-base.outputs.image }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'photo-wall-ci/output/ci-image.json'
          record = json.loads(path.read_text())
          record['os_base']['image'] = os.environ['PUBLISHED_BASE']
          path.write_text(json.dumps(record, sort_keys=True, separators=(',', ':')) + '\n')
          PY

      - name: Compress the disk for artifact upload
        run: |
          ci_root="$RUNNER_TEMP/photo-wall-ci"
          disk=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["disk"]["path"])' "$ci_root/output/ci-image.json")
          # Compression wraps the verified disk; use the runner's available CPUs.
          xz -T0 -6 "$disk"
          cd "$ci_root/output"
          sha256sum "$(basename "$disk").xz" ci-image.json artifact.json > UPLOAD-SHA256SUMS

      - name: Upload the sanitized image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/photo-wall-ci/output
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-arm64-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/photo-wall-ci/e2e-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Docker debug diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-arm64-docker-debug-${{ github.sha }}
          path: ${{ runner.temp }}/photo-wall-ci/docker-debug.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Make public build diagnostics readable
        if: always()
        run: |
          diagnostics="$RUNNER_TEMP/photo-wall-ci/diagnostics"
          if [ -d "$RUNNER_TEMP/diagnostics" ]; then
            sudo install -d "$diagnostics"
            sudo cp -a "$RUNNER_TEMP/diagnostics/." "$diagnostics/"
          fi
          if [ -d "$diagnostics" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$diagnostics"
          fi

      - name: Upload public build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-arm64-build-log-${{ github.sha }}
          path: ${{ runner.temp }}/photo-wall-ci/diagnostics
          if-no-files-found: ignore
          retention-days: 7

  appliance-required:
    if: always() && github.event_name != 'workflow_call'
    needs: [select-definition, build-and-boot]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - name: Require completed image qualification
        env:
          SELECTION: ${{ needs.select-definition.result }}
          QUALIFICATION: ${{ needs.build-and-boot.result }}
          REQUIRED: ${{ needs.select-definition.outputs.qualify }}
        run: |
          test "$SELECTION" = success
          if [[ "$REQUIRED" != "false" ]]; then test "$QUALIFICATION" = success; fi

  # Only this job runs for a workflow_call from release.yml. It reuses the
  # same select-definition identities and the same pinned-builder/prepared-OS-base
  # inputs as build-and-boot above, but assembles the 0009 release assets --
  # the minimal base OS image (scripts.build_ci_base_image) and the Player
  # .deb (scripts.build_player_deb) -- instead of the old signed-rootfs
  # appliance image, and skips the VM e2e boot gate -- release.yml only calls
  # this for a revision that already passed that gate on a prior push/PR run
  # of this same workflow. No --allow-build/--publish anywhere below: a
  # missing builder or OS base artifact means this revision's definition was
  # never qualified, and the release fails closed instead of cold-building an
  # unqualified candidate for publication. Per the 0009 owner ruling (home
  # LAN, no threat model, UX over security) nothing here is signed: no
  # PHOTO_WALL_RELEASE_SIGNING_KEY, no release.pub.pem, no signed rootfs.
  release-artifacts:
    if: github.event_name == 'workflow_call'
    needs: select-definition
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    outputs:
      artifact_name: photo-wall-release-${{ inputs.revision }}
    env:
      BUILDER_KEY: ${{ needs.select-definition.outputs.builder_key }}
      BASE_KEY: ${{ needs.select-definition.outputs.base_key }}
    steps:
      - name: Require a valid image definition selection
        run: test "${{ needs.select-definition.result }}" = success

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Check the Player service sandbox before image assembly
        timeout-minutes: 3
        run: sudo python3 scripts/check_player_unit.py

      - name: Authenticate to the durable image registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull the exact qualified builder for this revision's definition
        id: builder
        run: |
          python3 -m scripts.ci_images builder \
            --namespace "${GITHUB_REPOSITORY,,}" --key "$BUILDER_KEY"

      - name: Pull the matching qualified OS base for this revision's definition
        id: os-base
        env:
          BUILDER_IMAGE: ${{ steps.builder.outputs.image }}
          BUILDER_CONFIG: ${{ steps.builder.outputs.imageid }}
        run: |
          python3 -m scripts.ci_images base \
            --namespace "${GITHUB_REPOSITORY,,}" --key "$BASE_KEY" \
            --output "$RUNNER_TEMP/photo-wall-os-base" \
            --builder-image "$BUILDER_IMAGE" --builder-config "$BUILDER_CONFIG"

      # The Player .deb's venv is built --system-site-packages against the
      # full appliance.os_packages.RUNTIME_PACKAGES set (GTK/GStreamer/weston)
      # -- the same root scripts/build_ci_image.py's prepared-base path
      # restores internally -- not the minimal base image's own smaller
      # BASE_RUNTIME_PACKAGES root built two steps below. --network none:
      # this only extracts the already-fetched, already-qualified OS base
      # bundle pulled above.
      - name: Restore the qualified OS base root for the Player .deb build
        env:
          BUILDER_IMAGE: ${{ steps.builder.outputs.imageid }}
        run: |
          docker run --rm --platform linux/arm64 --network none \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP" \
            --workdir "$GITHUB_WORKSPACE" \
            --env PYTHONDONTWRITEBYTECODE=1 \
            "$BUILDER_IMAGE" python3.12 -m scripts.os_base restore \
              --repository "$GITHUB_WORKSPACE" \
              --bundle "$RUNNER_TEMP/photo-wall-os-base" \
              --output "$RUNNER_TEMP/photo-wall-deb-root" \
              --evidence "$RUNNER_TEMP/photo-wall-deb-root-evidence"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/photo-wall-deb-root"

      # Builds the wheelhouse (scripts.build_player) internally, then the
      # venv (chroot into the restored root above) and dpkg-deb -- no signing
      # key, no central_origin, no deployment config baked in (0009 gate #6).
      # Keeps network access: the wheelhouse phase downloads the locked
      # runtime wheels.
      - name: Build the Player .deb from the tagged revision
        env:
          BUILDER_IMAGE: ${{ steps.builder.outputs.imageid }}
        run: |
          release_root="$RUNNER_TEMP/photo-wall-release"
          install -d -m 0700 "$release_root/deb"
          docker run --rm --platform linux/arm64 \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP" \
            --workdir "$GITHUB_WORKSPACE" \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            "$BUILDER_IMAGE" python3.12 -m scripts.build_player_deb \
              --repository "$GITHUB_WORKSPACE" --revision "${{ inputs.revision }}" \
              --root "$RUNNER_TEMP/photo-wall-deb-root" \
              --output-dir "$release_root/deb"
          sudo chown -R "$(id -u):$(id -g)" "$release_root/deb"

      # Cold-builds its own minimal root (BASE_RUNTIME_PACKAGES only -- no
      # Player venv, no deployment config, no signing key: 0009 gate #1/#4).
      # Keeps network access: fetches the pinned Ubuntu base and apt-installs
      # its own smaller runtime package set independently of the .deb root
      # above.
      - name: Build the minimal base OS image
        env:
          BUILDER_IMAGE: ${{ steps.builder.outputs.imageid }}
        run: |
          release_root="$RUNNER_TEMP/photo-wall-release"
          docker run --rm --platform linux/arm64 \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP" \
            --workdir "$GITHUB_WORKSPACE" \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            "$BUILDER_IMAGE" python3.12 -m scripts.build_ci_base_image \
              --repository "$GITHUB_WORKSPACE" --revision "${{ inputs.revision }}" \
              --output-dir "$release_root/base"
          sudo chown -R "$(id -u):$(id -g)" "$release_root/base"

      - name: Upload the release build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-release-${{ inputs.revision }}
          path: |
            ${{ runner.temp }}/photo-wall-release/base
            ${{ runner.temp }}/photo-wall-release/deb
          if-no-files-found: error
          retention-days: 7
