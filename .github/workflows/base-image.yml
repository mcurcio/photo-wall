name: rpi-image-gen base OS spike

# 0009 Phase 4 SPIKE (see docs/decisions/0009-minimal-base-and-app-package.md,
# "base-OS" + "Bootstrapper" sections): proves out raspberrypi/rpi-image-gen
# as a candidate builder for the minimal netboot base OS squashfs. Standalone
# -- deliberately NOT wired into appliance.yml/release.yml or the boot chain.
# Does not retire or replace anything the existing appliance pipeline builds.
#
# Scoped to workflow_dispatch (manual iteration on this spike) and
# pull_request touching the rpi-image-gen config or this workflow file, so it
# never runs on every push to main.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - appliance/rpi_image_gen/**
      - .github/workflows/base-image.yml

permissions:
  contents: read

concurrency:
  group: base-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-base-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # ALL our own code ships to the base build as a portable `.deb`, never
      # a raw-file overlay this tool owns (see
      # scripts/build_bootstrapper_deb.py's module docstring). Pure Python,
      # no arm64 chroot needed, so this runs directly on the runner before
      # rpi-image-gen is even cloned.
      # Install uv via pipx (isolated env) rather than actions/setup-python:
      # setup-python prepends its own python3 to PATH for the whole job, which
      # would shadow the system python3 that rpi-image-gen's install_deps.sh
      # provisions `yaml` (and its other deps) into, breaking `bin/ig`. pipx
      # keeps the system python3 intact for the rpi-image-gen build below; the
      # .deb build uses uv's own .venv explicitly.
      - name: Install uv and sync the locked environment
        run: |
          pipx install uv==0.7.8
          uv sync --frozen

      - name: Build the photo-wall-bootstrapper .deb
        id: bootstrapper-deb
        run: |
          set -eu
          install -d -m 0755 "$RUNNER_TEMP/photo-wall-bootstrapper-deb"
          # The builder may print progress before the final .deb path; capture
          # all of it, then take only the last line (the path) for the output —
          # a multiline value would corrupt $GITHUB_OUTPUT.
          build_out=$(.venv/bin/python -m scripts.build_bootstrapper_deb \
            --repository "$GITHUB_WORKSPACE" --revision "$GITHUB_SHA" \
            --output-dir "$RUNNER_TEMP/photo-wall-bootstrapper-deb")
          printf '%s\n' "$build_out"
          deb_path=$(printf '%s\n' "$build_out" | tail -n1)
          echo "deb_path=$deb_path" >> "$GITHUB_OUTPUT"

      # Pinned by exact commit, not just the tag, for reproducibility --
      # v2.8.0 is raspberrypi/rpi-image-gen's latest release (2026-08-13) at
      # the time this spike was authored.
      - name: Clone the pinned rpi-image-gen tool
        env:
          RPI_IMAGE_GEN_REF: 262d4df5a9f9d4133370465399a7958a7c22cdc7
        run: |
          set -x
          git clone --no-checkout https://github.com/raspberrypi/rpi-image-gen.git "$RUNNER_TEMP/rpi-image-gen"
          git -C "$RUNNER_TEMP/rpi-image-gen" checkout "$RPI_IMAGE_GEN_REF"
          git -C "$RUNNER_TEMP/rpi-image-gen" rev-parse HEAD

      # Verbatim recipe from rpi-image-gen's own CI
      # (.github/workflows/build.yml, job build-arm64, "install dependencies"
      # step) -- the chmod works around a runner /home/runner permission the
      # tool's podman-based unshare build needs.
      - name: Install rpi-image-gen's host dependencies
        working-directory: ${{ runner.temp }}/rpi-image-gen
        run: |
          set -x
          sudo apt-get update
          sudo chmod o+x /home/runner
          sudo ./install_deps.sh

      # SOURCE_DATE_EPOCH pins the debian-trixie-arm64-minbase-snapshot
      # layer's snapshot.debian.org mirror (see bin/generators/snapgen) to a
      # fixed instant, so this build's Debian package set is reproducible
      # rather than "whatever snapshot.debian.org has right now". Fixed,
      # not `date +%s` at run time (contrast rpi-image-gen's own CI, which
      # uses `date -d 'today 00:00:00'` -- that pins to the day, not a
      # specific stable revision).
      - name: Build the minimal base OS rootfs and squashfs image
        env:
          SOURCE_DATE_EPOCH: '1788480000' # 2026-09-04T00:00:00Z
          WORKROOT: ${{ runner.temp }}/photo-wall-base-work
          BOOTSTRAPPER_DEB: ${{ steps.bootstrapper-deb.outputs.deb_path }}
        run: |
          set -x
          cd "$RUNNER_TEMP/rpi-image-gen"
          ./rpi-image-gen build \
            -S "$GITHUB_WORKSPACE/appliance/rpi_image_gen" \
            -c photo-wall-base.yaml \
            -- "IGconf_sys_workroot=$WORKROOT" "IGconf_app_bootstrapper_deb=$BOOTSTRAPPER_DEB"

      # Proves the squashfs is CORRECT, not merely that rpi-image-gen exited
      # 0 -- see docs/decisions/0009-minimal-base-and-app-package.md, "Base
      # OS bundle" (line ~669: "ship Python + zeroconf for the bootstrapper"
      # / "strip the Player venv, release.pub.pem, ... from the netboot
      # root") and layer/photo-wall-bootstrapper.yaml's own rule #1, "the
      # base OS carries no application and no origin". Reads the rootfs
      # tree straight out of the built squashfs via `unsquashfs -ll`
      # (permissions/type + path, no extraction needed) rather than trusting
      # the build's own exit code.
      #
      # Squashfs location: rpi-image-gen's image-base layer places genimage's
      # output directly at $IGconf_image_outputdir =
      # "$WORKROOT/image-${IGconf_image_name}" (image-base.yaml,
      # X-Env-Var-outputdir) -- confirmed against the pinned tool's own
      # rpi-image-gen:generate_images(), which passes that same directory to
      # genimage as both --inputpath and --outputpath, and
      # image/rootfs.cfg.in's <IMAGE_NAME>.<IMAGE_SUFFIX> substitution
      # (photo-wall-base.squashfs, config/photo-wall-base.yaml's
      # name/suffix). This is the RAW artefact, found before rpi-image-gen's
      # own later `deploy` stage zstd-compresses a copy into deploy-*/ (see
      # layer/base/deploy-base.yaml's compression default) -- deliberately
      # not decompressing that copy back out.
      - name: Verify the built base image is what 0009 requires (content, not just build success)
        env:
          WORKROOT: ${{ runner.temp }}/photo-wall-base-work
        run: |
          set -eu
          set -x

          command -v unsquashfs >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends squashfs-tools
          }

          squashfs_count=$(find "$WORKROOT" -type f -name 'photo-wall-base.squashfs' | wc -l)
          if [ "$squashfs_count" -ne 1 ]; then
            echo "VIOLATION: expected exactly one photo-wall-base.squashfs under $WORKROOT, found $squashfs_count:" >&2
            find "$WORKROOT" -type f -name 'photo-wall-base.squashfs' >&2 || true
            exit 1
          fi
          squashfs=$(find "$WORKROOT" -type f -name 'photo-wall-base.squashfs')
          echo "Inspecting $squashfs"

          listing="$RUNNER_TEMP/photo-wall-base.listing"
          unsquashfs -ll "$squashfs" > "$listing"
          echo "-- squashfs listing: $(wc -l < "$listing") entries --"

          # "<type-char> <path>" per entry, e.g. "d squashfs-root/etc" or
          # "l squashfs-root/.../foo.service" -- $6 of `unsquashfs -ll`'s
          # `<perms> <owner/group> <size> <date> <time> <path> [-> <target>]`
          # is the bare path with no `-> target` suffix even for symlinks
          # (verified against this exact squashfs-tools output format).
          typed="$RUNNER_TEMP/photo-wall-base.typed-paths"
          awk '{ print substr($1, 1, 1), $6 }' "$listing" > "$typed"

          fail=0
          violation() {
            echo "VIOLATION: $1" >&2
            fail=1
          }

          # $1 = type char (- file, d dir, l symlink), $2 = path under the
          # rootfs, $3 = human description.
          require_path() {
            if grep -Fxq -- "$1 squashfs-root/$2" "$typed"; then
              echo "OK: found $3 ($2)"
            else
              violation "missing required $3 at $2"
            fi
          }

          # $1 = substring to search for anywhere in the full listing
          # (matches a directory entry or anything nested under it), $2 =
          # human description.
          forbid_substring() {
            if grep -qF -- "$1" "$listing"; then
              violation "forbidden $2 present (matched '$1')"
            else
              echo "OK: absent $2 (no match for '$1')"
            fi
          }

          echo "== MUST BE PRESENT =="
          # The bootstrapper and its minimal import closure (never
          # player.service, which pulls in GTK/GStreamer -- see
          # scripts/build_bootstrapper_deb.py's own module docstring). All
          # of this is now delivered by the photo-wall-bootstrapper `.deb`,
          # not a raw-file overlay.
          require_path - usr/lib/python3/dist-packages/appliance/provision.py 'the bootstrapper (appliance/provision.py)'
          require_path - usr/lib/python3/dist-packages/player/mdns_discovery.py 'mDNS discovery (player/mdns_discovery.py)'
          require_path - usr/lib/python3/dist-packages/player/discovery.py 'the discovery Protocol (player/discovery.py)'
          # The unit ships at the vendor path (/lib/systemd/system, not
          # /etc/systemd/system -- this is a packaged unit now, not a raw
          # overlay file), AND is actually enabled (a `.wants` symlink the
          # `.deb` bakes as data, pointing back at the vendor path), not
          # just installed inert.
          require_path - lib/systemd/system/photo-wall-provision.service 'the photo-wall-provision.service unit'
          require_path l etc/systemd/system/multi-user.target.wants/photo-wall-provision.service 'photo-wall-provision.service enablement symlink'
          if grep -Fxq -- 'l squashfs-root/etc/systemd/system/multi-user.target.wants/photo-wall-provision.service' "$typed"; then
            target=$(grep -F -- 'squashfs-root/etc/systemd/system/multi-user.target.wants/photo-wall-provision.service ->' "$listing" | awk '{print $NF}')
            if [ "$target" = "/lib/systemd/system/photo-wall-provision.service" ]; then
              echo "OK: enablement symlink points at the vendor unit path"
            else
              violation "enablement symlink points at unexpected target: $target"
            fi
          fi
          # Python 3 plus the bootstrapper's one third-party dependency
          # closure (python3-zeroconf pulls in python3-ifaddr) -- both are
          # now the `.deb`'s own Depends, resolved by apt at install time,
          # not a second raw mmdebstrap.packages declaration.
          require_path - usr/bin/python3 'the python3 interpreter'
          require_path d usr/lib/python3/dist-packages/zeroconf 'the zeroconf library (python3-zeroconf)'
          require_path d usr/lib/python3/dist-packages/ifaddr 'the ifaddr library (python3-ifaddr)'

          # The package itself is INSTALLED, not just its files unpacked by
          # some other means -- dpkg's own database records it.
          status_dir="$RUNNER_TEMP/photo-wall-base-dpkg-status"
          rm -rf "$status_dir"
          unsquashfs -d "$status_dir" "$squashfs" var/lib/dpkg/status >/dev/null
          if grep -Fxq 'Package: photo-wall-bootstrapper' "$status_dir/var/lib/dpkg/status" \
              && grep -Fxq 'Status: install ok installed' "$status_dir/var/lib/dpkg/status"; then
            echo "OK: dpkg records photo-wall-bootstrapper as installed"
          else
            violation "dpkg status does not record photo-wall-bootstrapper as installed"
          fi

          echo "== MUST BE ABSENT (base stays minimal; app + render stack come from the .deb at boot) =="
          # No Player venv baked into the base.
          forbid_substring 'squashfs-root/opt/photo-wall/venv' 'the Player venv (/opt/photo-wall/venv)'
          # No deployment config or app trust anchor baked into the base --
          # the bootstrapper resolves these at boot, not build time.
          forbid_substring 'squashfs-root/etc/photo-wall/public.json' 'a baked /etc/photo-wall/public.json'
          forbid_substring 'squashfs-root/etc/photo-wall/bootstrap.json' 'a baked /etc/photo-wall/bootstrap.json'
          forbid_substring 'squashfs-root/etc/photo-wall/ca.pem' 'a baked /etc/photo-wall/ca.pem'
          forbid_substring 'release.pub.pem' 'a baked release.pub.pem app trust anchor'
          # No GTK/GStreamer/weston render stack -- that is the .deb's
          # Depends, resolved against the live Debian mirror at boot (see
          # config/photo-wall-base.yaml's "apt sources configured to the
          # Debian distro repo" note). Multiarch-triplet-agnostic: matches
          # the last path component, not a fixed usr/lib/<triplet>/ prefix.
          forbid_substring 'usr/bin/weston' 'the weston compositor binary'
          forbid_substring '/gstreamer-1.0' 'a GStreamer plugin directory'

          if [ "$fail" -ne 0 ]; then
            echo "FAIL: built base image does not match 0009's minimal-base-plus-bootstrapper contract; see VIOLATION lines above" >&2
            exit 1
          fi
          echo "PASS: built base image content matches 0009's minimal-base-plus-bootstrapper contract"

      - name: Show what was produced
        if: always()
        env:
          WORKROOT: ${{ runner.temp }}/photo-wall-base-work
        run: |
          set -x
          find "$WORKROOT" -maxdepth 3 -printf '%y %10s %p\n' 2>/dev/null || true

      - name: Upload the base rootfs squashfs and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-base-image-${{ github.sha }}
          path: |
            ${{ runner.temp }}/photo-wall-base-work/deploy-*/
            ${{ runner.temp }}/photo-wall-base-work/image-*/image.json
            ${{ runner.temp }}/photo-wall-base-work/image-*/genimage*.cfg
          if-no-files-found: error
          retention-days: 7
