name: rpi-image-gen base OS build

# 0009 Phase 4 (see docs/decisions/0009-minimal-base-and-app-package.md,
# "base-OS" + "Bootstrapper" sections): builds the minimal netboot base OS
# squashfs with raspberrypi/rpi-image-gen, plus the Player and bootstrapper
# `.deb`s and the assembled netboot base bundle. The old custom-image /
# signed-disk pipeline (appliance.yml) was retired in p4-retire s5; this is now
# the sole base-OS + package build.
#
# pipeline.yml calls it (its `base-image` job) for the plan's exact revision:
# on a pull request or push when scripts/release_plan.py finds the base bundle
# or a .deb changed -- the one package manifest that decides what builds, what
# is tested and what releases -- and on every release, whose assets it builds.
# Every artifact is named by that revision so the publish job consumes it by
# name. Nothing here is signed (home LAN, no threat model), so this call takes
# no signing secret. workflow_dispatch builds by hand (manual iteration).
#
# The V2 node components are built once per run by node-components.yml (the
# pipeline's `node-components` job; this workflow's own `components` job when
# dispatched) and downloaded here: the squashfs bakes their two .debs.
# A pull request uploads no release artifact (only the seal, on main, reads
# them); its failure diagnostics are still kept.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: Exact 40-character commit to build release assets for
        required: true
        type: string

permissions:
  contents: read

# Every run step fails where it fails: an explicit `bash` is
# `bash --noprofile --norc -eo pipefail {0}`, so a failing command on the left
# of a pipe fails its step instead of being masked by the right-hand side.
defaults:
  run:
    shell: bash

# Human-bumpable cache epoch. The two expensive base-OS stages (the
# rpi-image-gen squashfs and the scratch kernel+initrd) are content-addressed
# and cached below, keyed by a hash of each stage's TRUE input closure. Every
# Debian package either stage installs comes from the declaration's snapshot
# pin (scripts/debian_packages.py, in both keys); only the Raspberry Pi archive
# is unpinned (it has no snapshot service), so the scratch kernel stage's
# linux-image-rpi-2712 + raspi-firmware + rpi-eeprom are the one input no key
# can hash. Bump this integer to force BOTH caches to miss and fully rebuild
# (e.g. to pick up a newer upstream Pi kernel/firmware). It is part of BOTH
# cache keys.
env:
  BASE_CACHE_EPOCH: "1"

concurrency:
  group: base-image-${{ inputs.revision || github.ref }}
  cancel-in-progress: true

jobs:
  # By hand only: a pipeline run's components come from its own node-components job.
  components:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/node-components.yml
    with:
      revision: ${{ github.sha }}

  build-base-image:
    needs: components
    if: ${{ !cancelled() && needs.components.result != 'failure' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      # The exact commit these assets are built for: the caller's `revision`
      # when called by pipeline.yml, else the triggering commit. Threads through
      # the .deb builds and every artifact name so a release consumes the
      # bytes built for its tag, not whatever ref the reusable call resolved.
      REVISION: ${{ inputs.revision || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false

      # The Debian declaration (scripts/debian_packages.py) is the one place a
      # package list or mirror is written; the runner's system python3 runs it
      # (stdlib only). Its snapshot pin, as DEBIAN_SNAPSHOT_EPOCH, is the fixed
      # instant the .deb mtimes and the CA-age reference are pinned to, given
      # to each step as SOURCE_DATE_EPOCH. The initrd's CA list is the base's,
      # so it is as old as this pin: the bundle assembly warns (never fails)
      # once it is over 90 days old (decision 0014, Q3 = A). DEVICE_PACKAGES is
      # the device set (the bootstrapper's and the Player's packages): the
      # rpi-image-gen layer installs it and the base check requires it.
      # DEBIAN_SOURCES is the pin's apt sources, one signed-by line each: the
      # base is built from them and keeps them (layer/photo-wall-debian.yaml),
      # so the base's mirror is the pin by construction, not by an environment
      # variable rpi-image-gen would clear.
      - name: Read the Debian pin, the device set and the sources from the declaration
        run: |
          set -eu
          epoch=$(python3 scripts/debian_packages.py epoch)
          echo "DEBIAN_SNAPSHOT_EPOCH=$epoch" >> "$GITHUB_ENV"
          device_packages="$RUNNER_TEMP/device.list"
          python3 scripts/debian_packages.py packages bootstrapper player > "$device_packages"
          echo "DEVICE_PACKAGES=$device_packages" >> "$GITHUB_ENV"
          debian_sources="$RUNNER_TEMP/photo-wall-debian.list"
          python3 scripts/debian_packages.py sources > "$debian_sources"
          echo "DEBIAN_SOURCES=$debian_sources" >> "$GITHUB_ENV"
          echo "DEBIAN_SNAPSHOT_EPOCH=$epoch; device set:"
          cat "$device_packages"
          echo "base apt sources:"
          cat "$debian_sources"

      # ALL our own code ships to the base build as a portable `.deb`, never
      # a raw-file overlay this tool owns (see
      # scripts/build_bootstrapper_deb.py's module docstring). Pure Python,
      # no arm64 chroot needed, so this runs directly on the runner before
      # rpi-image-gen is even cloned.
      # Install uv via pipx (isolated env) rather than actions/setup-python
      # (`python: 'false'`): setup-python prepends its own python3 to PATH for
      # the whole job, which would shadow the system python3 that rpi-image-gen's
      # install_deps.sh provisions `yaml` (and its other deps) into, breaking
      # `bin/ig`. pipx keeps the system python3 intact for the rpi-image-gen build
      # below; the .deb build uses uv's own .venv explicitly.
      - uses: ./.github/actions/python-uv
        with:
          python: 'false'
      - name: Sync the locked environment
        run: uv sync --frozen

      - name: Build the photo-wall-bootstrapper .deb
        id: bootstrapper-deb
        env:
          # Make the .deb bytes reproducible: dpkg-deb (>= 1.18.11, well below
          # trixie's) clamps its members' mtimes to SOURCE_DATE_EPOCH instead of
          # embedding build-time mtimes. Same fixed instant the squashfs build
          # below pins, so the two agree. run_dpkg_deb inherits this env (its
          # subprocess.run sets no env=), so no build-script change is needed.
          SOURCE_DATE_EPOCH: ${{ env.DEBIAN_SNAPSHOT_EPOCH }}
        run: |
          set -eu
          install -d -m 0755 "$RUNNER_TEMP/photo-wall-bootstrapper-deb"
          # The builder may print progress before the final .deb path; capture
          # all of it, then take only the last line (the path) for the output —
          # a multiline value would corrupt $GITHUB_OUTPUT.
          build_out=$(.venv/bin/python -m scripts.build_bootstrapper_deb \
            --repository "$GITHUB_WORKSPACE" --revision "$REVISION" \
            --output-dir "$RUNNER_TEMP/photo-wall-bootstrapper-deb")
          printf '%s\n' "$build_out"
          deb_path=$(printf '%s\n' "$build_out" | tail -n1)
          echo "deb_path=$deb_path" >> "$GITHUB_OUTPUT"

      # The Player .deb ships no venv and declares its runtime deps as Depends
      # (the declaration's player list), so it builds on any host with
      # dpkg-deb (pure staging, like the bootstrapper .deb) -- no OS-base
      # chroot. The base carries those Depends (the device set): the base
      # check below requires every one of them installed in the built image.
      - name: Build the photo-wall-player .deb
        id: player-deb
        env:
          SOURCE_DATE_EPOCH: ${{ env.DEBIAN_SNAPSHOT_EPOCH }}
        run: |
          set -eu
          install -d -m 0755 "$RUNNER_TEMP/photo-wall-player-deb"
          build_out=$(.venv/bin/python -m scripts.build_player_deb \
            --repository "$GITHUB_WORKSPACE" --revision "$REVISION" \
            --output-dir "$RUNNER_TEMP/photo-wall-player-deb")
          printf '%s\n' "$build_out"
          deb_path=$(printf '%s\n' "$build_out" | tail -n1)
          echo "deb_path=$deb_path" >> "$GITHUB_OUTPUT"

      - name: Build the data-only Player payload
        id: player-payload
        env:
          SOURCE_DATE_EPOCH: ${{ env.DEBIAN_SNAPSHOT_EPOCH }}
        run: |
          set -eu
          install -d -m 0755 "$RUNNER_TEMP/photo-wall-player-payload"
          payload_path=$(.venv/bin/python -m scripts.build_player_payload \
            --repository "$GITHUB_WORKSPACE" --revision "$REVISION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --output-dir "$RUNNER_TEMP/photo-wall-player-payload")
          echo "payload_path=$payload_path" >> "$GITHUB_OUTPUT"

      # The exact set node-components.yml built for this revision, the one the seal ships.
      - name: Download the immutable V2 node components
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: photo-wall-node-components-${{ env.REVISION }}
          path: ${{ runner.temp }}/photo-wall-node-components

      # Cache A's node input: the two node .debs the squashfs bakes, named by what builds them
      # rather than by bytes a build might not repeat. node-base.deb is pure staging under the
      # pin's SOURCE_DATE_EPOCH, so its bytes are its inputs; node-display.deb is compiled, so
      # it is named by the inputs its builder records (inputs_sha256 in build-provenance.json).
      # A stale hit cannot pass silently: the node ABI check below requires the cached
      # squashfs's installed ABI to equal these components'.
      - name: Compute the node component input digest
        id: node-components
        run: |
          set -eu
          components="$RUNNER_TEMP/photo-wall-node-components"
          base=$(sha256sum < "$components/node-base.deb" | cut -d' ' -f1)
          display=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["native"]["inputs_sha256"])' \
            "$components/build-provenance.json")
          digest=$(printf 'node-base.deb %s\nnode-display inputs %s\n' "$base" "$display" \
            | sha256sum | cut -d' ' -f1)
          echo "inputs_digest=$digest" >> "$GITHUB_OUTPUT"

      # The bootstrapper's computed closure digest (scripts/module_closure.py,
      # the code the .deb ships): Cache A's code input, instead of a hand-kept
      # file list that could fall behind the closure.
      - name: Compute the bootstrapper closure digest
        id: bootstrapper-closure
        run: |
          set -eu
          digest=$(python3 scripts/module_closure.py --policy bootstrapper --digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Host tools used by the UNGATED content-verify + bundle-assembly steps
      # (squashfs `unsquashfs`, initrd `lsinitramfs`). Installed here, out of
      # the two expensive build steps, so those verifications still run on a
      # CACHE HIT (when the build steps that used to install these are skipped).
      # Idempotent: the build steps below still install their own build-time
      # tooling on a miss.
      - name: Install host tools for content verification (unsquashfs, lsinitramfs)
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools initramfs-tools

      # Pinned by exact commit, not just the tag, for reproducibility --
      # v2.8.0 is raspberrypi/rpi-image-gen's latest release (2026-08-13) at
      # the time this spike was authored.
      - name: Clone the pinned rpi-image-gen tool
        env:
          RPI_IMAGE_GEN_REF: 262d4df5a9f9d4133370465399a7958a7c22cdc7
        run: |
          set -x
          git clone --no-checkout https://github.com/raspberrypi/rpi-image-gen.git "$RUNNER_TEMP/rpi-image-gen"
          git -C "$RUNNER_TEMP/rpi-image-gen" checkout "$RPI_IMAGE_GEN_REF"
          git -C "$RUNNER_TEMP/rpi-image-gen" rev-parse HEAD

      # Verbatim recipe from rpi-image-gen's own CI
      # (.github/workflows/build.yml, job build-arm64, "install dependencies"
      # step) -- the chmod works around a runner /home/runner permission the
      # tool's podman-based unshare build needs.
      - name: Install rpi-image-gen's host dependencies
        working-directory: ${{ runner.temp }}/rpi-image-gen
        run: |
          set -x
          sudo apt-get update
          sudo chmod o+x /home/runner
          sudo ./install_deps.sh

      # The base's Debian package set comes from DEBIAN_SOURCES (the
      # declaration's pin, rendered above) through our own
      # layer/photo-wall-debian.yaml, so it is reproducible rather than
      # "whatever the snapshot service has right now". SOURCE_DATE_EPOCH does
      # NOT choose that mirror: rpi-image-gen runs its layer pipeline under
      # `env -i PATH=$PATH` (rpi-image-gen:218 at 262d4df), so its own
      # snapshot layer's snapgen never sees it and uses the build's clock. The
      # built image keeps the pinned sources; the content check below asserts
      # they are exactly the pin.
      # Cache A: the rpi-image-gen squashfs build (~20 min) is content-addressed
      # on its TRUE input closure -- the rpi-image-gen tree, the declaration
      # (the pin and the device set the base installs), the bootstrapper .deb
      # (BAKED into the squashfs: its computed closure's digest, its unit and
      # its builders, which also generate its __main__.py and Depends), the
      # node component input digest (above), the pyproject version, and this
      # workflow. Deliberately EXACT match only (no
      # restore-keys): a prefix-fallback could restore a stale base built from
      # different inputs -- exactly the poisoning risk. The Player's code is NOT
      # in this closure because it is NOT baked into the base (it ships as the
      # Player .deb, served by reference), so a Player-code-only change HITS
      # this cache; its Debian packages are, through the declaration.
      - name: Cache the rpi-image-gen base squashfs
        id: cache-squashfs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/photo-wall-base-work/image-photo-wall-base
            ${{ runner.temp }}/photo-wall-base-work/deploy-*
          key: squashfs-${{ env.BASE_CACHE_EPOCH }}-${{ hashFiles('appliance/rpi_image_gen/**', 'scripts/debian_packages.py', 'appliance/systemd/photo-wall-provision.service', 'appliance/systemd/photo-wall-os-agent.service', 'appliance/systemd/player.service', 'appliance/systemd/weston.service', 'appliance/systemd/weston.ini', 'player/output_discovery.py', 'scripts/build_bootstrapper_deb.py', 'scripts/build_player_deb.py', 'scripts/build_player.py', 'scripts/module_closure.py', 'scripts/device_root_checks.py', 'pyproject.toml', '.github/workflows/base-image.yml') }}-${{ steps.bootstrapper-closure.outputs.digest }}-${{ steps.node-components.outputs.inputs_digest }}

      - name: Build the minimal base OS rootfs and squashfs image
        if: steps.cache-squashfs.outputs.cache-hit != 'true'
        env:
          SOURCE_DATE_EPOCH: ${{ env.DEBIAN_SNAPSHOT_EPOCH }}
          WORKROOT: ${{ runner.temp }}/photo-wall-base-work
          BOOTSTRAPPER_DEB: ${{ steps.bootstrapper-deb.outputs.deb_path }}
        run: |
          set -x
          cd "$RUNNER_TEMP/rpi-image-gen"
          ./rpi-image-gen build \
            -S "$GITHUB_WORKSPACE/appliance/rpi_image_gen" \
            -c photo-wall-base.yaml \
            -- "IGconf_sys_workroot=$WORKROOT" "IGconf_app_bootstrapper_deb=$BOOTSTRAPPER_DEB" \
               "IGconf_app_node_base_deb=$RUNNER_TEMP/photo-wall-node-components/node-base.deb" \
               "IGconf_app_node_display_deb=$RUNNER_TEMP/photo-wall-node-components/node-display.deb" \
               "IGconf_app_device_packages=$DEVICE_PACKAGES" \
               "IGconf_app_debian_sources=$DEBIAN_SOURCES"

      # rpi-image-gen's genimage/deploy output can be root-owned and not
      # world-readable, so the unprivileged actions/cache post-job SAVE for
      # Cache A above could fail or silently drop files, leaving the cache
      # unpopulated and no-op'ing the whole optimization. Make exactly Cache A's
      # cached paths world-readable (dirs traversable) after a fresh build so
      # the save can read them -- mirrors the $KOUT chmod the kernel step does
      # for Cache B. Gated on the SAME cache-miss as the build: on a cache hit
      # the build is skipped and there is nothing to re-permission.
      - name: Make the base squashfs cache paths readable for the cache save
        if: steps.cache-squashfs.outputs.cache-hit != 'true'
        env:
          WORKROOT: ${{ runner.temp }}/photo-wall-base-work
        run: |
          set -eux
          sudo chmod -R a+rX \
            "$WORKROOT/image-photo-wall-base" \
            "$WORKROOT"/deploy-*

      # Proves the squashfs is CORRECT, not merely that rpi-image-gen exited
      # 0 -- see docs/decisions/0009-minimal-base-and-app-package.md, "Base
      # OS bundle" (line ~669: "strip the Player venv, release.pub.pem, ...
      # from the netboot root") and rule #1, "the base OS carries no
      # application and no origin". Reads the rootfs tree straight out of the
      # built squashfs via `unsquashfs -ll` (permissions/type + path) rather
      # than trusting the build's own exit code, then extracts only what
      # scripts/device_root_checks.py reads (systemd config, apt sources, the
      # dpkg database): no watchdog override, no time daemon, no resolver
      # writer, every device package and every Player Depends installed
      # (provisioning installs the Player with dpkg alone), and apt sources
      # that are exactly the declaration's pin (none foreign, none missing).
      #
      # Squashfs location: rpi-image-gen's image-base layer places genimage's
      # output directly at $IGconf_image_outputdir =
      # "$WORKROOT/image-${IGconf_image_name}" (image-base.yaml,
      # X-Env-Var-outputdir) -- confirmed against the pinned tool's own
      # rpi-image-gen:generate_images(), which passes that same directory to
      # genimage as both --inputpath and --outputpath, and
      # image/rootfs.cfg.in's <IMAGE_NAME>.<IMAGE_SUFFIX> substitution
      # (photo-wall-base.squashfs, config/photo-wall-base.yaml's
      # name/suffix). This is the RAW artefact, found before rpi-image-gen's
      # own later `deploy` stage zstd-compresses a copy into deploy-*/ (see
      # layer/base/deploy-base.yaml's compression default) -- deliberately
      # not decompressing that copy back out.
      - name: Verify the built base image is what 0009 requires (content, not just build success)
        env:
          WORKROOT: ${{ runner.temp }}/photo-wall-base-work
          PLAYER_DEB: ${{ steps.player-deb.outputs.deb_path }}
        run: |
          set -eu
          set -x

          command -v unsquashfs >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends squashfs-tools
          }

          # Address the squashfs directly at its deterministic output path
          # (image-base's IGconf_image_outputdir = $WORKROOT/image-<name>);
          # do NOT `find` over $WORKROOT, which contains the root-owned chroot
          # (mode-700 apt dirs) and would make find exit non-zero on
          # "Permission denied", killing this step under set -e.
          squashfs="$WORKROOT/image-photo-wall-base/photo-wall-base.squashfs"
          if [ ! -f "$squashfs" ]; then
            echo "VIOLATION: expected base squashfs at $squashfs" >&2
            ls -la "$WORKROOT/image-photo-wall-base" >&2 || true
            exit 1
          fi
          echo "Inspecting $squashfs"

          listing="$RUNNER_TEMP/photo-wall-base.listing"
          unsquashfs -ll "$squashfs" > "$listing"
          echo "-- squashfs listing: $(wc -l < "$listing") entries --"

          # "<type-char> <path>" per entry, e.g. "d squashfs-root/etc" or
          # "l squashfs-root/.../foo.service" -- $6 of `unsquashfs -ll`'s
          # `<perms> <owner/group> <size> <date> <time> <path> [-> <target>]`
          # is the bare path with no `-> target` suffix even for symlinks
          # (verified against this exact squashfs-tools output format).
          typed="$RUNNER_TEMP/photo-wall-base.typed-paths"
          awk '{ print substr($1, 1, 1), $6 }' "$listing" > "$typed"

          fail=0
          violation() {
            echo "VIOLATION: $1" >&2
            fail=1
          }

          # $1 = type char (- file, d dir, l symlink), $2 = path under the
          # rootfs, $3 = human description.
          require_path() {
            if grep -Fxq -- "$1 squashfs-root/$2" "$typed"; then
              echo "OK: found $3 ($2)"
            else
              violation "missing required $3 at $2"
            fi
          }

          # $1 = substring to search for anywhere in the full listing
          # (matches a directory entry or anything nested under it), $2 =
          # human description.
          forbid_substring() {
            if grep -qF -- "$1" "$listing"; then
              violation "forbidden $2 present (matched '$1')"
            else
              echo "OK: absent $2 (no match for '$1')"
            fi
          }

          echo "== MUST BE PRESENT =="
          # The bootstrapper's computed closure (scripts/module_closure.py,
          # never player.service), shipped privately by the
          # photo-wall-bootstrapper `.deb` as a directory application: the
          # generated entry point, the manifest, and every file the manifest
          # lists.
          bootstrapper_dir=usr/lib/photo-wall-bootstrapper
          require_path - "$bootstrapper_dir/__main__.py" 'the bootstrapper entry point'
          require_path - "$bootstrapper_dir/closure.json" 'the bootstrapper closure manifest'
          require_path - "$bootstrapper_dir/os-agent.py" 'the base-owned OS agent launcher'
          require_path - "$bootstrapper_dir/player-launch.py" 'the base-owned Player launcher'
          require_path - "$bootstrapper_dir/base-abi.txt" 'the base ABI declaration'
          require_path - "$bootstrapper_dir/weston.ini" 'the base-owned Weston configuration'
          for unit in photo-wall-os-agent photo-wall-player photo-wall-weston; do
            if grep -Eq -- "^- squashfs-root/(usr/)?lib/systemd/system/$unit.service$" "$typed"; then
              echo "OK: found base-owned $unit.service vendor unit"
            else
              violation "missing base-owned $unit.service vendor unit"
            fi
          done
          # The unit ships at the vendor path (/lib/systemd/system, not
          # /etc/systemd/system -- this is a packaged unit now, not a raw
          # overlay file), AND is actually enabled (a `.wants` symlink the
          # `.deb` bakes as data, pointing back at the vendor path), not
          # just installed inert.
          # On merged-/usr Debian, /lib is a symlink to /usr/lib, so the
          # packaged unit is listed under usr/lib/systemd/system; accept either.
          if grep -Eq -- '^- squashfs-root/(usr/)?lib/systemd/system/photo-wall-provision.service$' "$typed"; then
            echo "OK: found the photo-wall-provision.service unit ((usr/)lib/systemd/system)"
          else
            violation "missing required the photo-wall-provision.service unit at (usr/)lib/systemd/system/photo-wall-provision.service"
          fi
          require_path l etc/systemd/system/multi-user.target.wants/photo-wall-provision.service 'photo-wall-provision.service enablement symlink'
          if grep -Fxq -- 'l squashfs-root/etc/systemd/system/multi-user.target.wants/photo-wall-provision.service' "$typed"; then
            target=$(grep -F -- 'squashfs-root/etc/systemd/system/multi-user.target.wants/photo-wall-provision.service ->' "$listing" | awk '{print $NF}')
            if [ "$target" = "/lib/systemd/system/photo-wall-provision.service" ] || [ "$target" = "/usr/lib/systemd/system/photo-wall-provision.service" ]; then
              echo "OK: enablement symlink points at the vendor unit path"
            else
              violation "enablement symlink points at unexpected target: $target"
            fi
          fi
          require_path l etc/systemd/system/multi-user.target.wants/photo-wall-os-agent.service 'photo-wall-os-agent.service enablement symlink'
          if grep -Fxq -- 'l squashfs-root/etc/systemd/system/multi-user.target.wants/photo-wall-os-agent.service' "$typed"; then
            agent_target=$(grep -F -- 'squashfs-root/etc/systemd/system/multi-user.target.wants/photo-wall-os-agent.service ->' "$listing" | awk '{print $NF}')
            if [ "$agent_target" = "/lib/systemd/system/photo-wall-os-agent.service" ] || [ "$agent_target" = "/usr/lib/systemd/system/photo-wall-os-agent.service" ]; then
              echo "OK: OS-agent enablement symlink points at the vendor unit path"
            else
              violation "OS-agent enablement symlink points at unexpected target: $agent_target"
            fi
          fi
          # /usr/bin/python3 is a symlink to python3.13 on Debian trixie (a
          # regular file on some distros), so accept either type here. The
          # unit runs it as `python3 -I -B /usr/lib/photo-wall-bootstrapper`.
          if grep -Eq -- '^[-l] squashfs-root/usr/bin/python3$' "$typed"; then
            echo "OK: found the python3 interpreter (usr/bin/python3, file or symlink)"
          else
            violation "missing required the python3 interpreter at usr/bin/python3"
          fi

          # Only what scripts/device_root_checks.py reads: the systemd manager
          # config, the apt sources, the dpkg database; plus the closure
          # manifest. An extract path the image lacks is skipped, not an error;
          # xattrs are not needed and an unprivileged extract cannot set them.
          extract="$RUNNER_TEMP/photo-wall-base-extract"
          rm -rf "$extract"
          unsquashfs -no-xattrs -d "$extract" "$squashfs" \
            etc/systemd usr/lib/systemd/system.conf.d lib/systemd/system.conf.d \
            etc/apt etc/passwd var/lib/dpkg/status "$bootstrapper_dir/closure.json" \
            "$bootstrapper_dir/base-abi.txt" >/dev/null
          manifest="$extract/$bootstrapper_dir/closure.json"
          if [ -f "$manifest" ]; then
            closure_files=$(python3 -c 'import sys; from pathlib import Path; from scripts.module_closure import read_manifest; print("\n".join(read_manifest(Path(sys.argv[1])).files))' "$manifest")
            for file in $closure_files; do
              require_path - "$bootstrapper_dir/$file" "closure file $file"
            done
          fi
          if ! grep -q '^wall:' "$extract/etc/passwd"; then
            violation "missing wall user in base OS"
          fi
          expected_abi=$(.venv/bin/python -c 'from pathlib import Path; from contracts.player_payload import base_abi; from scripts.debian_packages import PIN, packages; from scripts.build_bootstrapper_deb import launcher_contract_digest; print(base_abi(PIN.snapshot, packages("player"), launcher_contract_digest(Path.cwd())))')
          if [ "$(cat "$extract/$bootstrapper_dir/base-abi.txt")" != "$expected_abi" ]; then
            violation "base ABI file does not match installed runtime declaration"
          fi

          echo "== DEVICE ROOT CHECKS (scripts/device_root_checks.py) =="
          # Every device package (the rendered device set), every Depends of
          # the Player .deb built above, and the bootstrapper itself are
          # installed (dpkg's own database: `install ok installed`); no
          # watchdog override, time daemon or resolver writer; the image's
          # apt sources are exactly the declaration's pin.
          dpkg-deb -f "$PLAYER_DEB" Depends > "$RUNNER_TEMP/player-depends.list"
          printf '%s\n' photo-wall-bootstrapper > "$RUNNER_TEMP/bootstrapper-package.list"
          if python3 scripts/device_root_checks.py --root "$extract" \
              --require-installed "$DEVICE_PACKAGES" \
              --require-installed "$RUNNER_TEMP/player-depends.list" \
              --require-installed "$RUNNER_TEMP/bootstrapper-package.list" \
              --pinned-sources; then
            echo "OK: device_root_checks passed"
          else
            violation "device_root_checks refused the image (lines above)"
          fi

          echo "== MUST BE ABSENT (no application outside the private dirs, no origin) =="
          # Each .deb ships its closure privately; nothing first-party lands
          # in the shared dist-packages tree (two packages would own a file).
          for package in appliance player uplink contracts; do
            if grep -Eq -- "^. squashfs-root/usr/lib/python3/dist-packages/$package(/|\$)" "$typed"; then
              violation "first-party $package under usr/lib/python3/dist-packages"
            else
              echo "OK: absent first-party $package under usr/lib/python3/dist-packages"
            fi
          done
          # Stage 1 writes stage 2's resolver into the new root at boot; the
          # build host's copy must not ship (image/pre-image.sh removes it).
          if grep -Eq -- '^. squashfs-root/etc/resolv.conf$' "$typed"; then
            violation "the build host's etc/resolv.conf is in the image"
          else
            echo "OK: absent etc/resolv.conf"
          fi
          # No Player venv baked into the base.
          forbid_substring 'squashfs-root/opt/photo-wall/venv' 'the Player venv (/opt/photo-wall/venv)'
          forbid_substring 'squashfs-root/usr/lib/photo-wall-player/' 'application code before payload activation'
          # No deployment config or app trust anchor baked into the base --
          # the bootstrapper resolves these at boot, not build time.
          forbid_substring 'squashfs-root/etc/photo-wall/public.json' 'a baked /etc/photo-wall/public.json'
          forbid_substring 'squashfs-root/etc/photo-wall/bootstrap.json' 'a baked /etc/photo-wall/bootstrap.json'
          forbid_substring 'squashfs-root/etc/photo-wall/ca.pem' 'a baked /etc/photo-wall/ca.pem'
          forbid_substring 'release.pub.pem' 'a baked release.pub.pem app trust anchor'

          if [ "$fail" -ne 0 ]; then
            echo "FAIL: built base image does not match 0009's minimal-base-plus-bootstrapper contract; see VIOLATION lines above" >&2
            exit 1
          fi
          echo "PASS: built base image content matches 0009's minimal-base-plus-bootstrapper contract"

      # --- p4-boot-chain s2b: netboot base bundle (kernel + initrd + DTBs +
      # the base squashfs) -------------------------------------------------
      # rpi-image-gen's squashfs is metadata-only (no kernel, no /lib/modules).
      # The kernel + initrd are therefore built in a SEPARATE scratch
      # Debian-trixie-arm64 root (0008 boot-chain decision) -- NEVER baked into
      # the RAM-root squashfs. The runner is arm64, so this chroot needs no
      # qemu. Diagnostics are captured to files uploaded on failure (OWNER
      # STANDING RULE: root-cause, do not guess).
      # Cache B: the scratch kernel + initrd build (~several min) is
      # content-addressed on its TRUE input closure -- the initramfs hooks/
      # scripts, the assembler, and this workflow. Our Python code, the CA
      # bundle and the clock floor are NOT in the cached initrd: they are the
      # boot data (scripts/build_boot_data.py), rebuilt on every run by the
      # uncached assembly step and placed in front of it, so no key has to list
      # them (decision 0014 §5). The declaration is keyed: it names the root's
      # Debian packages, its snapshot pin and the Raspberry Pi packages. NOT
      # keyed on player/ or the rpi-image-gen config -- neither affects the
      # kernel/initrd. EXACT match only (no restore-keys): a stale-base
      # prefix-fallback is the poisoning risk. Only the Raspberry Pi archive is
      # unpinned (it has no snapshot service): the kernel/firmware/eeprom are
      # pulled from it at build time and are NOT in any file the key can hash
      # -- bump BASE_CACHE_EPOCH to force them to refresh. Only the
      # fixed-layout output dir ($KOUT below) is cached, never the full
      # root-owned scratch rootfs ($SCRATCH).
      - name: Cache the scratch kernel + initrd + DTBs
        id: cache-kernel
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/netboot-kernel-out
          key: kernel-initrd-${{ env.BASE_CACHE_EPOCH }}-${{ hashFiles('appliance/netboot_initramfs/**', 'scripts/build_netboot_bundle.sh', 'scripts/verify_boot_display.py', 'scripts/debian_packages.py', '.github/workflows/base-image.yml') }}

      - name: Build the scratch kernel + initrd root (Debian trixie arm64)
        id: scratch-root
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        env:
          SCRATCH: ${{ runner.temp }}/netboot-scratch
          DIAG: ${{ runner.temp }}/netboot-diag
          KOUT: ${{ runner.temp }}/netboot-kernel-out
        run: |
          set -eu
          set -x
          mkdir -p "$DIAG"
          sudo apt-get update
          # mmdebstrap builds the scratch root. debian-archive-keyring provides
          # the keyring each pinned line names (signed-by=, from the
          # declaration): this Ubuntu host's apt trusts no Debian key by
          # default, and mmdebstrap copies a full `deb ...` line verbatim
          # (it adds signed-by only to a bare mirror URL). The same path
          # exists in the trixie root, so its own apt verifies the same way.
          # initramfs-tools on the HOST provides lsinitramfs for the
          # content-verify; squashfs-tools may already be present from the
          # squashfs verify step above.
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap debian-archive-keyring ca-certificates gnupg curl initramfs-tools

          sudo rm -rf "$SCRATCH"
          # Minimal Debian trixie arm64 root at the declaration's pin, carrying
          # the initrd toolchain + interpreter the netboot init needs
          # (packages("initrd-build"); mmdebstrap_argv is the one way a root
          # outside rpi-image-gen is built, with only the snapshot sources).
          # The rpi-2712 kernel itself comes from the Raspberry Pi archive,
          # added below.
          if ! sudo python3 scripts/debian_packages.py mmdebstrap --arch arm64 \
              --target "$SCRATCH" initrd-build \
              > "$DIAG/mmdebstrap.log" 2>&1; then
            echo "mmdebstrap failed; tail:" >&2
            tail -n 80 "$DIAG/mmdebstrap.log" >&2
            exit 1
          fi
          echo "scratch root Debian sources (the pin only):"
          sudo find "$SCRATCH/etc/apt" \( -name '*.list' -o -name '*.sources' \) \
            -exec cat {} + | tee "$DIAG/scratch-sources.txt"

          # linux-image-rpi-2712 (BCM2712, 16K-page Pi 5 kernel) + raspi-firmware
          # (Pi 5 DTBs + SPI-EEPROM bootloader firmware) live in the Raspberry Pi
          # archive, NOT Debian's own (which ships only generic linux-image-arm64).
          # trusted=yes: the RPi archive's InRelease is signed with a SHA1 binding
          # signature that trixie's sqv verifier rejects ("SHA1 is not considered
          # secure since 2026-02-01"), so signed-by verification fails outright.
          # This is a build-time trusted fetch on our own CI, consistent with
          # 0009's no-threat-model / corruption-only ruling. If RPi later re-signs
          # its key with SHA256, restore `[signed-by=.../raspberrypi.gpg]` (fetch
          # + dearmor the key) in place of `[trusted=yes]`.
          python3 scripts/debian_packages.py sources --archive raspberrypi \
            | sudo tee "$SCRATCH/etc/apt/sources.list.d/raspberrypi.list"
          sudo cp /etc/resolv.conf "$SCRATCH/etc/resolv.conf"

          # Bind the kernel-visible filesystems so the kernel package's postinst
          # (depmod / update-initramfs) works inside the chroot.
          for fs in proc sys dev dev/pts; do
            sudo mount --bind "/$fs" "$SCRATCH/$fs"
          done

          if ! sudo chroot "$SCRATCH" apt-get update > "$DIAG/apt-update.log" 2>&1; then
            echo "apt-get update (RPi archive) failed; tail:" >&2
            tail -n 60 "$DIAG/apt-update.log" >&2
            exit 1
          fi
          # rpi-eeprom (alongside the kernel + firmware) packages the bootloader
          # images build_eeprom_update.py rebuilds into the TFTP self-update
          # pair (0014 rev 5, design §2.8) -- pieeprom.upd/.sig, staged below.
          # The list is the declaration's (one package name per line, split
          # on purpose).
          kernel_packages=$(python3 scripts/debian_packages.py packages \
            --archive raspberrypi initrd-build)
          # shellcheck disable=SC2086
          if ! sudo chroot "$SCRATCH" env DEBIAN_FRONTEND=noninteractive \
              apt-get install -y --no-install-recommends $kernel_packages \
              > "$DIAG/apt-install-kernel.log" 2>&1; then
            echo "kernel/raspi-firmware/rpi-eeprom install failed; tail:" >&2
            tail -n 80 "$DIAG/apt-install-kernel.log" >&2
            exit 1
          fi

          # Install the s2a hook + boot script + BOOT= selector. No first-party
          # Python is staged here: the boot data carries stage 1's computed
          # closure (decision 0014 §5).
          sudo install -D -m 0755 \
            "$GITHUB_WORKSPACE/appliance/netboot_initramfs/hooks/photo-wall-netboot" \
            "$SCRATCH/etc/initramfs-tools/hooks/photo-wall-netboot"
          sudo install -D -m 0755 \
            "$GITHUB_WORKSPACE/appliance/netboot_initramfs/scripts/photowall-netboot" \
            "$SCRATCH/etc/initramfs-tools/scripts/photowall-netboot"
          printf 'BOOT=photowall-netboot\n' \
            | sudo tee "$SCRATCH/etc/initramfs-tools/conf.d/photo-wall"
          # Where the initrd's interpreter finds modules under `python3 -I`:
          # recorded in $KOUT (below) so the uncached assembly puts the boot
          # data's closure there, on a cache hit too.
          python_libdir=$(sudo chroot "$SCRATCH" python3 -c \
            'import sysconfig; print(sysconfig.get_path("stdlib"))')

          # Exactly one kernel is installed; derive its version for mkinitramfs.
          kver=$(sudo ls "$SCRATCH/lib/modules" | head -n1)
          if [ -z "$kver" ]; then
            echo "no kernel modules dir under $SCRATCH/lib/modules" >&2
            sudo ls -la "$SCRATCH/lib/modules" >&2 || true
            exit 1
          fi
          echo "kernel version: $kver" | tee "$DIAG/kernelver.txt"

          # Stage 1 needs the watchdog device, the emergency-restart sysrq and
          # the kernel's own DHCP (option 42, R6's first time source) built
          # INTO this kernel, not loadable -- nothing in the initramfs can
          # `modprobe` them (scripts/kernel_config_check.py STAGE1_BUILTINS).
          # Checked against the packaged config, not the running kernel's
          # /proc, because this runner never boots it. A failure here is a
          # STOP with an errata entry: the packaged kernel no longer matches
          # bcm2712_defconfig (decision 0014 §5), never a silent skip.
          kernel_config="$SCRATCH/boot/config-$kver"
          if [ ! -f "$kernel_config" ]; then
            echo "no $kernel_config (packaged kernel ships no config-<version>)" >&2
            exit 1
          fi
          # sudo: $SCRATCH/boot is still root-owned/non-world-readable here
          # (the `chmod -R a+rX` below runs later, once the chroot's mounts
          # are torn down).
          sudo .venv/bin/python "$GITHUB_WORKSPACE/scripts/kernel_config_check.py" \
            --config "$kernel_config"
          # $kernel_config itself is copied into $KOUT below (once $KOUT
          # exists), so the cache-hit leg can re-assert the SAME check
          # against a config Cache B restored, without re-installing the
          # kernel package.

          if ! sudo chroot "$SCRATCH" mkinitramfs -o /boot/initrd.img "$kver" \
              > "$DIAG/mkinitramfs.log" 2>&1; then
            echo "mkinitramfs failed; tail:" >&2
            tail -n 80 "$DIAG/mkinitramfs.log" >&2
            exit 1
          fi

          # Diagnostics: boot listings, initrd size + member listing.
          sudo ls -la "$SCRATCH/boot" | tee "$DIAG/boot-listing.txt" || true
          sudo ls -la "$SCRATCH/boot/firmware" 2>/dev/null \
            | tee "$DIAG/boot-firmware-listing.txt" || true
          initrd_bytes=$(sudo stat -c %s "$SCRATCH/boot/initrd.img")
          echo "initrd.img size: $initrd_bytes bytes" | tee "$DIAG/initrd-size.txt"
          sudo lsinitramfs "$SCRATCH/boot/initrd.img" > "$DIAG/lsinitramfs.txt" 2>&1 || true
          echo "lsinitramfs members: $(wc -l < "$DIAG/lsinitramfs.txt")"

          # Unmount the binds before find/stat over $SCRATCH so procfs does not
          # trip later steps.
          for fs in dev/pts dev sys proc; do
            sudo umount "$SCRATCH/$fs" || true
          done

          # Locate the kernel image, Pi 5 DTB, and overlays for the assembler.
          # Names/locations are exactly what this run installs (no guessing);
          # the boot listings above are the evidence.
          # `-print -quit`, not `| head -n1`: under pipefail a find killed by
          # SIGPIPE once head exits would fail the step.
          kernel_img=$(sudo find "$SCRATCH/boot" -maxdepth 2 -name 'vmlinuz-*' -print -quit)
          if [ -z "$kernel_img" ]; then
            echo "no vmlinuz-* under $SCRATCH/boot" >&2
            cat "$DIAG/boot-listing.txt" >&2 || true
            exit 1
          fi
          dtb=$(sudo find "$SCRATCH" -name 'bcm2712-rpi-5-b.dtb' -print -quit)
          if [ -z "$dtb" ]; then
            echo "bcm2712-rpi-5-b.dtb not found under $SCRATCH" >&2
            exit 1
          fi
          overlays_dir=""
          any_dtbo=$(sudo find "$SCRATCH" -name '*.dtbo' -path '*overlays*' -print -quit)
          if [ -n "$any_dtbo" ]; then
            overlays_dir=$(dirname "$any_dtbo")
          fi
          # The packaged rpi-eeprom bootloader image build_eeprom_update.py
          # rebuilds into pieeprom.upd/.sig (0014 rev 5, design §2.8). "default"
          # is the release rpi-eeprom recommends for boards already in the
          # field; sorted so the newest dated image wins if more than one ships.
          # A missing directory is the empty result the check below reports
          # (with a listing), not a pipefail exit here.
          eeprom_image=$( { sudo find "$SCRATCH/usr/lib/firmware/raspberrypi/bootloader-2712/default" \
            -maxdepth 1 -name 'pieeprom-*.bin' 2>/dev/null || true; } | sort | tail -n1)
          if [ -z "$eeprom_image" ]; then
            echo "no pieeprom-*.bin under bootloader-2712/default" >&2
            sudo find "$SCRATCH/usr/lib/firmware/raspberrypi" -maxdepth 3 >&2 || true
            exit 1
          fi
          # rpi-eeprom-config (python3) and rpi-eeprom-digest (shell) are
          # arch-independent, so they run directly under the runner's own
          # interpreter/shell -- no chroot needed -- but they must be THIS
          # SAME pinned rpi-eeprom package's copy, never installed on the
          # runner itself (which has neither; that is why the later content
          # check below greps pieeprom.upd's raw bytes instead of parsing it).
          rpi_eeprom_config=$(sudo find "$SCRATCH/usr/bin" -maxdepth 1 -name 'rpi-eeprom-config' -print -quit)
          rpi_eeprom_digest=$(sudo find "$SCRATCH/usr/bin" -maxdepth 1 -name 'rpi-eeprom-digest' -print -quit)
          if [ -z "$rpi_eeprom_config" ] || [ -z "$rpi_eeprom_digest" ]; then
            echo "rpi-eeprom-config/rpi-eeprom-digest not found under $SCRATCH/usr/bin" >&2
            sudo find "$SCRATCH/usr/bin" -maxdepth 1 -name 'rpi-eeprom-*' >&2 || true
            exit 1
          fi
          echo "kernel_img=$kernel_img"       >> "$GITHUB_OUTPUT"
          echo "initrd=$SCRATCH/boot/initrd.img" >> "$GITHUB_OUTPUT"
          echo "dtb=$dtb"                       >> "$GITHUB_OUTPUT"
          echo "overlays_dir=$overlays_dir"     >> "$GITHUB_OUTPUT"
          # find over a root-owned tree can leave outputs root-owned; make the
          # staged artifacts readable to the unprivileged assembler step.
          sudo chmod -R a+rX "$SCRATCH/boot"

          # Copy the located artifacts into a FIXED-LAYOUT output dir ($KOUT)
          # with deterministic names. This dir -- NOT the huge root-owned
          # scratch rootfs -- is what Cache B stores, and it is what the
          # (ungated) assembly step consumes, so assembly works identically
          # whether this step built the artifacts or Cache B restored them.
          # The assembler renames --kernel/--dtb to the frozen bundle names,
          # so the source names here are arbitrary.
          sudo rm -rf "$KOUT"
          sudo install -d -m 0755 "$KOUT" "$KOUT/overlays"
          sudo cp "$kernel_img" "$KOUT/kernel"
          sudo cp "$SCRATCH/boot/initrd.img" "$KOUT/initrd.img"
          sudo cp "$dtb" "$KOUT/dtb"
          sudo cp "$eeprom_image" "$KOUT/pieeprom.bin"
          sudo cp "$rpi_eeprom_config" "$KOUT/rpi-eeprom-config"
          sudo cp "$rpi_eeprom_digest" "$KOUT/rpi-eeprom-digest"
          sudo chmod 0755 "$KOUT/rpi-eeprom-config" "$KOUT/rpi-eeprom-digest"
          sudo cp "$kernel_config" "$KOUT/kernel-config"
          printf '%s\n' "$python_libdir" | sudo tee "$KOUT/python-libdir"
          if [ -n "$overlays_dir" ]; then
            sudo cp "$overlays_dir"/*.dtbo "$KOUT/overlays/" 2>/dev/null || true
          fi
          # World-readable (and dirs traversable) so the unprivileged cache-save
          # and assembly steps can read the root-owned copies.
          sudo chmod -R a+rX "$KOUT"

      # The cache-miss leg above already ran this check against the config it
      # just installed; on a cache HIT that step (and its apt-get install) is
      # skipped entirely, so re-assert the SAME check against the config copy
      # Cache B restored -- a stale hit must not silently carry a kernel whose
      # watchdog/sysrq/DHCP support regressed (0014 rev 5, design §5).
      - name: Verify the cached kernel config still builds in stage 1's kernel support
        if: steps.cache-kernel.outputs.cache-hit == 'true'
        env:
          KOUT: ${{ runner.temp }}/netboot-kernel-out
        run: |
          set -eu
          .venv/bin/python scripts/kernel_config_check.py --config "$KOUT/kernel-config"

      # Consumes the FIXED-LAYOUT $KOUT (freshly built OR Cache B-restored) and
      # the squashfs (freshly built OR Cache A-restored), so it is NOT gated by
      # either cache-hit -- the initrd content-verify (verify_netboot_initrd.py,
      # run inside the assembler via lsinitramfs installed above) therefore runs
      # even on a cache hit, catching a corrupt/wrong restored artifact.
      - name: Assemble the netboot base bundle and content-verify the initrd
        env:
          KOUT: ${{ runner.temp }}/netboot-kernel-out
          WORKROOT: ${{ runner.temp }}/photo-wall-base-work
          BUNDLE: ${{ runner.temp }}/photo-wall-base-bundle
        run: |
          set -eu
          set -x
          squashfs="$WORKROOT/image-photo-wall-base/photo-wall-base.squashfs"
          rm -rf "$BUNDLE"
          overlay_arg=""
          if ls "$KOUT"/overlays/*.dtbo >/dev/null 2>&1; then
            overlay_arg="--overlays-dir $KOUT/overlays"
          fi
          # The assembly script puts the boot data (stage 1's computed closure,
          # the base's CA bundle, this revision's commit time as the clock
          # floor) in front of the cached initrd, then runs
          # verify_netboot_initrd.py against the result via lsinitramfs
          # (installed on the host above) -- content-verify #2.
          # shellcheck disable=SC2086
          sh "$GITHUB_WORKSPACE/scripts/build_netboot_bundle.sh" \
            --kernel "$KOUT/kernel" \
            --initrd "$KOUT/initrd.img" \
            --repo "$GITHUB_WORKSPACE" \
            --python-libdir "$(cat "$KOUT/python-libdir")" \
            --snapshot-epoch "$DEBIAN_SNAPSHOT_EPOCH" \
            --dtb "$KOUT/dtb" \
            --eeprom-image "$KOUT/pieeprom.bin" \
            --rpi-eeprom-config "$KOUT/rpi-eeprom-config" \
            --rpi-eeprom-digest "$KOUT/rpi-eeprom-digest" \
            $overlay_arg \
            --squashfs "$squashfs" \
            --base-abi-file "$RUNNER_TEMP/photo-wall-base-extract/usr/lib/photo-wall-bootstrapper/base-abi.txt" \
            --output "$BUNDLE" \
            --verify "$GITHUB_WORKSPACE/scripts/verify_netboot_initrd.py" \
            --python python3

      - name: Verify installed node ABI and produce the explicit V2 cohort bundle
        run: |
          set -eu
          .venv/bin/python - "$RUNNER_TEMP" <<'PYCODE'
          import json, pathlib, subprocess, sys
          work = pathlib.Path(sys.argv[1])
          components = json.loads((work / "photo-wall-node-components/components.json").read_text())
          squashfs = work / "photo-wall-base-bundle/photo-wall-base.squashfs"
          installed = {}
          for name in ("usr/lib/photo-wall-node-base/abi.json", "usr/lib/photo-wall-display/abi.json"):
              installed.update(json.loads(subprocess.check_output(["unsquashfs", "-cat", str(squashfs), name])))
          if installed != components["abi"]:
              raise SystemExit("installed node ABI does not match exact component roots")
          PYCODE
          .venv/bin/python -m scripts.node_release_artifacts \
            --source-bundle "$RUNNER_TEMP/photo-wall-base-bundle" \
            --output "$RUNNER_TEMP/photo-wall-node-bundle"

      - name: Verify the assembled bundle (content, no hardware)
        env:
          BUNDLE: ${{ runner.temp }}/photo-wall-base-bundle
          SCRATCH: ${{ runner.temp }}/netboot-scratch
          KERNEL_CACHE_HIT: ${{ steps.cache-kernel.outputs.cache-hit }}
        run: |
          set -eu
          set -x
          fail=0
          violation() { echo "VIOLATION: $1" >&2; fail=1; }

          # Required artifacts present.
          for f in boot/config.txt boot/cmdline.txt boot/kernel_2712.img \
                   boot/initrd.img boot/bcm2712-rpi-5-b.dtb \
                   boot/pieeprom.upd boot/pieeprom.sig \
                   photo-wall-base.squashfs base-abi.json SHA256SUMS; do
            [ -f "$BUNDLE/$f" ] || violation "missing bundle artifact $f"
          done

          # squashfs under the release size ceiling, read from the constant
          # stage 1 enforces (contracts/release.py, stdlib only). The base
          # carries the Player's whole platform, so this is the number to
          # watch.
          max=$(python3 -c 'from contracts.release import MAX_ROOTFS_BYTES; print(MAX_ROOTFS_BYTES)')
          sq_bytes=$(stat -c %s "$BUNDLE/photo-wall-base.squashfs")
          echo "squashfs size: $sq_bytes bytes (MAX_ROOTFS_BYTES $max)"
          [ "$sq_bytes" -gt 0 ] && [ "$sq_bytes" -lt "$max" ] \
            || violation "squashfs size $sq_bytes not in (0, $max)"

          # SHA256SUMS covers EVERY file except itself, and every listed digest
          # re-verifies (corruption-only).
          expected=$(find "$BUNDLE" -type f ! -name SHA256SUMS | wc -l | tr -d ' ')
          listed=$(wc -l < "$BUNDLE/SHA256SUMS" | tr -d ' ')
          [ "$expected" = "$listed" ] \
            || violation "SHA256SUMS lists $listed files, bundle has $expected"
          ( cd "$BUNDLE" && sha256sum -c --quiet SHA256SUMS ) \
            || violation "SHA256SUMS re-verification failed"
          python3 - "$BUNDLE" <<'PY'
          import hashlib
          import pathlib
          import sys
          from contracts.release import parse_base_abi_sidecar
          bundle = pathlib.Path(sys.argv[1])
          abi, digest = parse_base_abi_sidecar((bundle / "base-abi.json").read_bytes())
          with (bundle / "photo-wall-base.squashfs").open("rb") as stream:
              actual = hashlib.file_digest(stream, "sha256").hexdigest()
          if digest != actual:
              raise SystemExit("base ABI sidecar does not bind assembled squashfs")
          PY

          # No signed / trust material anywhere in the bundle (this path is
          # unsigned by construction -- 0008 boot-chain). pieeprom.sig is the
          # bootloader's own rpi-eeprom-digest over pieeprom.upd (0014 rev 5,
          # design §2.8), not app/release trust material, so it is exempt.
          signed=$(find "$BUNDLE" \( -name '*.sig' -o -name 'release.pub.pem' \
            -o -name 'ca.pem' -o -name 'bootstrap.json' \
            -o -name 'boot-policy.json' \) ! -name 'pieeprom.sig' 2>/dev/null || true)
          if [ -n "$signed" ]; then
            violation "signed material present in bundle: $signed"
          fi

          # eeprom_update.py already refused (nonzero exit) to build an update
          # missing either setting; re-read the built pieeprom.upd's embedded
          # config partition (plain text) back here as a belt-and-braces check
          # -- the host runner has no rpi-eeprom-config, so this greps the raw
          # bytes rather than parsing the image.
          for setting in 'BOOT_ORDER=0xf21' 'BOOT_WATCHDOG_TIMEOUT=120'; do
            grep -aq -- "$setting" "$BUNDLE/boot/pieeprom.upd" \
              || violation "pieeprom.upd missing required setting $setting"
          done

          # The display is on in the device tree the Pi boots: config.txt loads
          # the Pi 5 KMS overlay, the overlay file is staged, and applied to the
          # staged DTB it turns vc4's and v3d's nodes okay. v0.9.1 loaded no
          # overlay, so vc4/v3d found no device and /dev/dri never appeared.
          # fdtoverlay/fdtget are the pinned scratch root's (device-tree-compiler
          # is an initrd-build package), never the runner's: Ubuntu 24.04's
          # 1.7.0 fails to apply vc4-kms-v3d-pi5 to this DTB (FDT_ERR_NOTFOUND)
          # where trixie's 1.7.2 applies the same bytes. That root exists only
          # when Cache B missed. On a hit, every input of the applied check --
          # config.txt (build_netboot_bundle.sh), the DTB and overlays ($KOUT),
          # the checker and the tools' pin -- is in Cache B's key, and the entry
          # was saved only by a run whose check passed, so only the config.txt
          # half runs again.
          if [ "$KERNEL_CACHE_HIT" != 'true' ]; then
            sudo python3 scripts/verify_boot_display.py "$BUNDLE/boot" --apply \
              --tools-root "$SCRATCH" \
              || violation "the bundle does not turn the display on (lines above)"
          else
            python3 scripts/verify_boot_display.py "$BUNDLE/boot" \
              || violation "the bundle does not turn the display on (lines above)"
          fi

          # cmdline.txt template contract (central-discovery model,
          # build_netboot_bundle.sh; contracts/release.py): the whole file is
          # exactly ONE kernel command line (no comment lines: the firmware
          # passes the file verbatim), carrying the static tokens + the central
          # ROOT placeholder, and NONE of the retired base_url/base_sha256
          # params. The operator substitutes @@PHOTOWALL_CENTRAL@@ and nothing
          # else. This catches a template regression in build_netboot_bundle.sh.
          cmd=$(cat "$BUNDLE/boot/cmdline.txt")
          cmd_lines=$(wc -l < "$BUNDLE/boot/cmdline.txt")
          [ "$cmd_lines" -eq 1 ] && ! printf '%s' "$cmd" | grep -q '^#' \
            || violation "cmdline.txt is not exactly one command line ($cmd_lines lines)"
          printf '%s' "$cmd" | grep -q 'photowall.central=@@PHOTOWALL_CENTRAL@@' \
            || violation "cmdline.txt missing photowall.central=@@PHOTOWALL_CENTRAL@@"
          for tok in 'console=tty1' 'ip=dhcp' 'boot=photowall-netboot' 'panic=10' \
                     'watchdog.stop_on_reboot=0' 'hung_task_panic=1' 'cgroup_enable=memory'; do
            printf '%s' "$cmd" | grep -q -- "$tok" \
              || violation "cmdline.txt missing static token $tok"
          done
          if grep -Eq 'base_url|base_sha256' "$BUNDLE/boot/cmdline.txt"; then
            violation "cmdline.txt still references retired base_url/base_sha256"
          fi

          if [ "$fail" -ne 0 ]; then
            echo "FAIL: assembled bundle does not satisfy the s2b contract" >&2
            find "$BUNDLE" -type f -printf '%10s %p\n' >&2 || true
            exit 1
          fi
          echo "PASS: bundle content contract satisfied"
          find "$BUNDLE" -type f -printf '%10s %p\n'

      # Stage 1's REAL mount path, out of the shipped initrd.img, on this
      # runner's kernel: unpack it, chroot in, and run mount_root (loop attach,
      # squashfs, tmpfs, overlay) with the initrd's own python3 and klibc
      # mount/umount against a tiny probe squashfs. v0.9.1's `-o loop`, which
      # klibc mount hands to the kernel, failed only on a Pi; this fails here. It then runs
      # stage 1's module hand-over and requires the initrd's own modprobe to resolve vc4 and
      # v3d against the new root (resolvable, not loaded: this runner boots its own kernel).
      # Not gated by a cache hit: it reads the assembled bundle. The runner is
      # arm64, so the initrd's binaries run natively.
      - name: Mount a probe squashfs through the built initrd's stage-1 path
        env:
          BUNDLE: ${{ runner.temp }}/photo-wall-base-bundle
        run: |
          set -eu
          sudo .venv/bin/python scripts/initrd_mount_probe.py "$BUNDLE/boot/initrd.img" \
            --work "$RUNNER_TEMP/initrd-mount-probe"

      # The base must START the Player, not only carry its Depends. v0.9.1's base had no udev,
      # so no render group, and player.service failed at spawn (216/GROUP) on every Pi while
      # every content check passed. Three probes boot the built squashfs under real systemd (a
      # --privileged container, systemd as PID 1, the units that would act on this runner's
      # devices and kernel masked), each in its own container, image and work directory (every
      # name carries a random suffix), so they run at once; the step waits for all three,
      # prints each one's output, and fails if any failed. Not gated by a cache hit, so a
      # Player-only change still has to start on the cached base. After the bundle, so they read
      # the initrd the release ships.
      #
      #   player-deb       requires udev and the render, video and input groups, installs the
      #                    Player .deb built above with dpkg alone, and starts the unit as
      #                    provisioning does: it passes only when the unit is active/running.
      #                    It then hands the built initrd's modules over as stage 1 does and
      #                    requires the base's own libkmod to find vc4 and v3d by their devices'
      #                    aliases and read every file they need (scripts/player_start_probe.py).
      #   player-payload   the data-only Player payload through the shipped base-owned launcher
      #                    and exact archive (the .deb probe installs an overriding unit, so this
      #                    one has its own container).
      #   os-agent         the netboot tracer checks the exact packaged check-in wire against
      #                    Central, but invokes two one-shot reports. This boots the final
      #                    squashfs to multi-user.target with the provisioner masked and requires
      #                    the OS-agent to start without an explicit start; a separate container
      #                    then keeps the same installed agent process alive while the
      #                    provisioner rejects a corrupt package. The HTTP peer is a local
      #                    recorder on an ephemeral port.
      - name: Start the Player, the Player payload and the OS-agent on the built base under systemd
        env:
          SQUASHFS: ${{ runner.temp }}/photo-wall-base-work/image-photo-wall-base/photo-wall-base.squashfs
          INITRD: ${{ runner.temp }}/photo-wall-base-bundle/boot/initrd.img
          PLAYER_DEB: ${{ steps.player-deb.outputs.deb_path }}
          PLAYER_PAYLOAD: ${{ steps.player-payload.outputs.payload_path }}
        run: |
          set -eu
          logs="$RUNNER_TEMP/base-probes"
          mkdir -p "$logs"
          declare -A probes
          # A probe in the background, its output to its own log: `probe NAME COMMAND...`.
          probe() {
            local name=$1
            shift
            "$@" > "$logs/$name.log" 2>&1 &
            probes[$name]=$!
          }
          probe player-deb sudo .venv/bin/python scripts/player_start_probe.py \
            --squashfs "$SQUASHFS" --deb "$PLAYER_DEB" --initrd "$INITRD" \
            --work "$RUNNER_TEMP/player-start-probe"
          probe player-payload sudo .venv/bin/python scripts/player_start_probe.py \
            --squashfs "$SQUASHFS" --payload "$PLAYER_PAYLOAD" \
            --work "$RUNNER_TEMP/player-payload-start-probe"
          probe os-agent sudo .venv/bin/python scripts/os_agent_service_probe.py \
            --squashfs "$SQUASHFS" --deb "$PLAYER_DEB" \
            --work "$RUNNER_TEMP/os-agent-service-probe"
          failed=()
          for name in player-deb player-payload os-agent; do
            status=0
            wait "${probes[$name]}" || status=$?
            echo "::group::$name probe (exit $status)"
            cat "$logs/$name.log"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then failed+=("$name"); fi
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::base systemd probes failed: ${failed[*]}"
            exit 1
          fi

      - name: Make OS-agent probe diagnostics readable to the runner
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/os-agent-service-probe" ]; then
            sudo chmod -R a+rX "$RUNNER_TEMP/os-agent-service-probe"
          fi

      # Diagnostics: kept on any failure, and on every run that is not a pull request.
      - name: Upload OS-agent service probe diagnostics
        if: failure() || github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-os-agent-service-${{ env.REVISION }}
          path: |
            ${{ runner.temp }}/os-agent-service-probe/evidence.json
            ${{ runner.temp }}/os-agent-service-probe/requests.json
            ${{ runner.temp }}/os-agent-service-probe/journal.log
            ${{ runner.temp }}/os-agent-service-probe/autostart/evidence.json
            ${{ runner.temp }}/os-agent-service-probe/autostart/requests.json
            ${{ runner.temp }}/os-agent-service-probe/autostart/journal.log
          if-no-files-found: warn
          retention-days: 7

      - name: Show what was produced
        if: always()
        env:
          WORKROOT: ${{ runner.temp }}/photo-wall-base-work
        run: |
          set -x
          find "$WORKROOT" -maxdepth 3 -printf '%y %10s %p\n' 2>/dev/null || true

      # The release artifacts: only the seal reads them, on a push to main, so a pull request
      # uploads none (each is still built and verified above).
      - name: Upload the base rootfs squashfs and manifest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-base-image-${{ env.REVISION }}
          path: |
            ${{ runner.temp }}/photo-wall-base-work/deploy-*/
            ${{ runner.temp }}/photo-wall-base-work/image-*/image.json
            ${{ runner.temp }}/photo-wall-base-work/image-*/genimage*.cfg
          if-no-files-found: error
          retention-days: 7

      # The whole netboot bundle as ONE artifact (0008 boot-chain: kernel +
      # initrd + Pi 5 DTBs + squashfs + SHA256SUMS). pipeline.yml publishes this
      # by name (photo-wall-base-bundle-<revision>).
      - name: Upload the netboot base bundle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-base-bundle-${{ env.REVISION }}
          path: ${{ runner.temp }}/photo-wall-base-bundle/
          if-no-files-found: error
          retention-days: 7

      - name: Upload the explicit V2 cohort bundle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-node-bundle-${{ env.REVISION }}
          path: ${{ runner.temp }}/photo-wall-node-bundle/
          if-no-files-found: error
          retention-days: 7

      # The two .debs built above, each as its own revision-named artifact so
      # pipeline.yml can publish them as standalone release assets alongside the
      # base bundle.
      - name: Upload the Player .deb
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-player-deb-${{ env.REVISION }}
          path: ${{ steps.player-deb.outputs.deb_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload the data-only Player payload
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-player-payload-${{ env.REVISION }}
          path: ${{ steps.player-payload.outputs.payload_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload the bootstrapper .deb
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-bootstrapper-deb-${{ env.REVISION }}
          path: ${{ steps.bootstrapper-deb.outputs.deb_path }}
          if-no-files-found: error
          retention-days: 7

      # Scratch-root build diagnostics (kernel version, boot listings,
      # lsinitramfs, initrd size, mmdebstrap/apt logs) -- uploaded on failure so
      # a red run is root-caused from evidence, not guessed (OWNER STANDING RULE).
      - name: Upload netboot scratch-root diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-netboot-diag-${{ env.REVISION }}
          path: ${{ runner.temp }}/netboot-diag/
          if-no-files-found: warn
          retention-days: 7
