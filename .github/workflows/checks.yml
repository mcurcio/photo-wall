name: MVP checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: photo-wall-ci

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-and-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: python -m pip install uv==0.7.8
      - run: uv sync --frozen
      - run: .venv/bin/python -m ruff check .
      - run: python scripts/check_docs.py
      - run: python scripts/configure.py
      - name: Set up the container build cache
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Build or restore the pinned Linux media test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: media-test
          platforms: linux/amd64
          load: true
          tags: photo-wall-media-test:ci
          cache-from: type=gha,scope=photo-wall-checks-amd64-v1
          cache-to: type=gha,scope=photo-wall-checks-amd64-v1,mode=max,ignore-error=true
      - name: Build or restore the central image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: central
          platforms: linux/amd64
          load: true
          tags: photo-wall-ci-central
          cache-from: type=gha,scope=photo-wall-checks-amd64-v1
      - name: Build or restore the media worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: media-worker
          platforms: linux/amd64
          load: true
          tags: photo-wall-ci-worker
          cache-from: type=gha,scope=photo-wall-checks-amd64-v1
      - run: docker compose up -d --no-build --wait
      - run: .venv/bin/python scripts/test_local.py -q --tb=short
      - name: Qualify conversion in the pinned Linux worker
        run: |
          docker run --rm --network none photo-wall-media-test:ci
      - run: curl --fail http://127.0.0.1:8000/healthz
      - name: Service diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Remove this job's services
        if: always()
        run: docker compose down --volumes
