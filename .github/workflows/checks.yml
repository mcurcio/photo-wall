name: MVP checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      prepare_base:
        description: Prepare a missing media OS dependency for its declared definition
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: photo-wall-ci

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-base:
    uses: ./.github/workflows/service-base.yml
    permissions:
      contents: read
      packages: write
    with:
      architecture: amd64
      prepare_base: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_base || false }}

  portable-and-postgres:
    needs: service-base
    if: always()
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require media OS preparation
        env:
          PREPARATION: ${{ needs.service-base.result }}
          MEDIA_BASE_IMAGE: ${{ needs.service-base.outputs.image }}
        run: |
          test "$PREPARATION" = success
          test -n "$MEDIA_BASE_IMAGE"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: python -m pip install uv==0.7.8
      - run: uv sync --frozen
      - run: .venv/bin/python -m ruff check .
      - run: .venv/bin/lint-imports
      - run: python scripts/check_docs.py
      - run: python scripts/configure.py
      - name: Authenticate to the durable image registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Set up the container build cache
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Build or restore the media worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: media-worker
          build-args: MEDIA_BASE_IMAGE=${{ needs.service-base.outputs.image }}
          platforms: linux/amd64
          load: true
          tags: photo-wall-ci-worker
          cache-from: type=gha,scope=photo-wall-checks-amd64-v1
          cache-to: type=gha,scope=photo-wall-checks-amd64-v1,mode=max,ignore-error=true
      - name: Build or restore the central image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: central
          platforms: linux/amd64
          load: true
          tags: photo-wall-ci-central
          cache-from: type=gha,scope=photo-wall-checks-amd64-v1
      - run: docker compose up -d --no-build --wait
      - run: .venv/bin/python scripts/test_local.py -q --tb=short
      - name: Walk through the operator interface in the pinned browser image
        run: |
          install -d "$RUNNER_TEMP/operator-browser"
          docker run --rm --init --network host --ipc=host --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --volume "$RUNNER_TEMP/operator-browser:/evidence" --workdir /work \
            --env PHOTO_WALL_BROWSER_TESTS=1 --env PYTHONDONTWRITEBYTECODE=1 \
            --env GITHUB_SHA --env GITHUB_EVENT_NAME --env GITHUB_ACTIONS \
            --env UV_PROJECT_ENVIRONMENT=/tmp/photo-wall-browser-venv \
            --env UV_PYTHON_DOWNLOADS=never \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/work \
            mcr.microsoft.com/playwright/python:v1.62.0-noble@sha256:aa81288e738725378becba5b3e06cb0f3a7f012a610e87e8d767a090ea3f740d \
            sh -ec 'python -m pip install uv==0.7.8
              uv sync --frozen --no-install-project --python /usr/bin/python3.12
              /tmp/photo-wall-browser-venv/bin/python scripts/test_local.py -q \
                -p no:cacheprovider tests/browser --browser chromium \
                --tracing retain-on-failure --output /evidence --tb=short'
      - name: Make browser evidence readable
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/operator-browser" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/operator-browser"
          fi
      - name: Retain operator browser evidence and failed traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operator-browser-${{ github.sha }}
          path: ${{ runner.temp }}/operator-browser
          if-no-files-found: ignore
          retention-days: 7
      - run: curl --fail http://127.0.0.1:8000/healthz
      - name: Service diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Remove this job's services
        if: always()
        run: docker compose down --volumes

  linux-media:
    needs: service-base
    if: always()
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require media OS preparation
        env:
          PREPARATION: ${{ needs.service-base.result }}
          MEDIA_BASE_IMAGE: ${{ needs.service-base.outputs.image }}
        run: |
          test "$PREPARATION" = success
          test -n "$MEDIA_BASE_IMAGE"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Authenticate to the durable image registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Set up the container build cache
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Build the pinned Linux media test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: media-test
          build-args: MEDIA_BASE_IMAGE=${{ needs.service-base.outputs.image }}
          platforms: linux/amd64
          load: true
          tags: photo-wall-media-test:ci
          cache-from: |
            type=gha,scope=photo-wall-checks-amd64-v1
            type=gha,scope=photo-wall-media-test-amd64-v1
          cache-to: type=gha,scope=photo-wall-media-test-amd64-v1,mode=max,ignore-error=true
      - name: Qualify conversion in the pinned Linux worker
        run: docker run --rm --network none photo-wall-media-test:ci
