name: Netboot boot-chain e2e tracer (p4 s3)

# Self-contained, process-level end-to-end tracer for the 0009 boot-time
# app-delivery contract (docs/decisions/0008-delivery-ledger.md,
# p4-boot-chain s3, Part A). Owner ruling (2026-09-12): process-level, NOT a
# QEMU kernel boot, and self-contained -- NO `release-artifacts` reusable
# workflow, NO pre-qualified OS-base, NO `--root`.
#
# It builds the DEVICE ROOT (Project 2 S1c): the base's device set -- the
# bootstrapper's and the Player's Debian packages from scripts/debian_packages.py
# -- by mmdebstrap at the declared snapshot, cached on the declaration and
# imported into docker. It builds the REAL bootstrapper and Player `.deb`s IN-JOB
# (pure dpkg-deb, Architecture: all; each ships its own private install dir --
# /usr/lib/photo-wall-bootstrapper, /usr/lib/photo-wall-player -- nothing
# first-party in the shared dist-packages), stands up a REAL central (uvicorn) +
# REAL Postgres serving the Player `.deb`, and installs BOTH packages with dpkg
# on this one device root. It runs the PACKAGED provisioner as its unit does,
# from a command line naming a gateway stub that 301s cross-host to Central. It
# locates, fetches + sha256-verifies and INSTALLS the Player `.deb` with dpkg
# alone (apt/apt-get are shims that fail the run: every Depends must already be
# in the root, as on the Pi), writes the handoff and starts the unit (a
# systemctl shim). It then imports every module of the Player's closure.json
# from its private /usr/lib/photo-wall-player (the pinned trixie Python 3.13
# with the real python3-gi etc.), runs scripts/device_root_checks.py on the
# post-install root, and proves a flip-a-byte refusal. This job GATES
# retirement of the old signed netboot/release-authority pipeline (s4/s5).
# The installed bootstrapper closure also sends schema-2 OS observations to
# Central/PostgreSQL before and after a packaged corrupt-package refusal. Those
# observations remain T0 claims, without physical boot or acceptance proof.
#
# Part B (ticketless enroll -> pending -> operator bind -> render smoke) is
# proven by the re-keyed scripts/demo_wall.py runner under the existing
# "Controller and Player software e2e" job; both green together gate s4.
#
# It also runs stage 1's uplink on the DEVICE's runtime (decision 0014 §11), in
# the same device root: CI is Python 3.12 with a venv, the Pi is the pinned
# trixie python3 (3.13) and OpenSSL (3.5) with the stdlib and the computed
# closure only.
#
# Called by pipeline.yml (its `netboot-e2e` job) when scripts/release_plan.py finds a .deb or
# one of the tracer's own paths changed -- the one manifest that decides what builds, what is
# tested and what releases. workflow_dispatch runs it by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Every run step fails where it fails: an explicit `bash` is
# `bash --noprofile --norc -eo pipefail {0}`, so a failing command on the left
# of a pipe (the device-root build below) fails its step instead of being
# masked by the right-hand side.
defaults:
  run:
    shell: bash

jobs:
  tracer:
    runs-on: ubuntu-24.04-arm
    # A cold device root (a declaration change) fetches the whole device set from the
    # snapshot archive; warm runs re-import the cached tar.
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: ./.github/actions/python-uv

      - name: Install the locked harness environment
        run: uv sync --frozen

      # The device root: mmdebstrap over the declaration's device set at its
      # pin (scripts/test_netboot_e2e.py device_root_image), kept as a tar and
      # cached on the declaration, then imported into docker. mmdebstrap is
      # needed only to build it (a cache miss); debian-archive-keyring is the
      # keyring each pinned line names (signed-by=, from the declaration).
      # mmdebstrap's whole stderr is kept in DEVICE_ROOT_LOG (uploaded below)
      # and echoed into this step's log on a failure.
      - name: Cache the device root
        id: device-root-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/device-root-cache
          key: device-root-arm64-${{ hashFiles('scripts/debian_packages.py') }}

      - name: Install mmdebstrap
        if: steps.device-root-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap debian-archive-keyring

      - name: Build or import the device root image
        id: device-root
        env:
          DEVICE_ROOT_LOG: ${{ runner.temp }}/device-root/mmdebstrap.log
        run: |
          set -eu
          image=$(.venv/bin/python -m scripts.test_netboot_e2e device-root \
            --arch arm64 --tag photo-wall-device-root:ci \
            --cache "$RUNNER_TEMP/device-root-cache" --log "$DEVICE_ROOT_LOG" | tail -n1)
          test -n "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # Stage 1's computed closure, imported and exercised under `python3 -I -S`
      # in the device root (the pinned interpreter) with only the closure on
      # sys.path: the 301 chain, a TLS-to-TLS hop, the downgrade refusal and the
      # 62/64 name mismatches, against stdlib servers inside the container.
      # Certificates are minted here on the runner (tests/tls_fixture.py); none
      # is kept in the tree.
      - name: uplink on the device runtime (Python 3.13, OpenSSL 3.5)
        env:
          DEVICE_ROOT: ${{ steps.device-root.outputs.image }}
        run: |
          set -eu
          work="$RUNNER_TEMP/uplink-device"
          .venv/bin/python scripts/module_closure.py --stage "$work/closure"
          .venv/bin/python -m scripts.uplink_device_harness mint "$work/certs"
          docker run --rm --platform linux/arm64 \
            -v "$work:/work:ro" \
            -v "$GITHUB_WORKSPACE/scripts/uplink_device_harness.py:/harness.py:ro" \
            "$DEVICE_ROOT" sh -ec '
              python3 --version
              python3 -I -S /harness.py run --closure /work/closure --certs /work/certs'

      - name: Authenticate to the durable image registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Set up the container build cache
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build or restore the central image
        id: central
        uses: ./.github/actions/service-image
        with:
          target: central
          architecture: arm64
          load: true
          tags: photo-wall-netboot-e2e-central:ci

      # Build the REAL bootstrapper and Player .debs in-job (pure dpkg-deb, no
      # chroot, no OS-base) -- the exact commands base-image.yml uses. Their
      # Depends come from the declaration the device root was built from.
      - name: Build the photo-wall-bootstrapper .deb
        id: bootstrapper-deb
        run: |
          set -eu
          install -d -m 0755 "$RUNNER_TEMP/photo-wall-bootstrapper-deb"
          build_out=$(.venv/bin/python -m scripts.build_bootstrapper_deb \
            --repository "$GITHUB_WORKSPACE" --revision "$GITHUB_SHA" \
            --output-dir "$RUNNER_TEMP/photo-wall-bootstrapper-deb")
          printf '%s\n' "$build_out"
          deb_path=$(printf '%s\n' "$build_out" | tail -n1)
          echo "deb_path=$deb_path" >> "$GITHUB_OUTPUT"

      - name: Build the photo-wall-player .deb
        id: player-deb
        run: |
          set -eu
          install -d -m 0755 "$RUNNER_TEMP/photo-wall-player-deb"
          build_out=$(.venv/bin/python -m scripts.build_player_deb \
            --repository "$GITHUB_WORKSPACE" --revision "$GITHUB_SHA" \
            --output-dir "$RUNNER_TEMP/photo-wall-player-deb")
          printf '%s\n' "$build_out"
          deb_path=$(printf '%s\n' "$build_out" | tail -n1)
          echo "deb_path=$deb_path" >> "$GITHUB_OUTPUT"

      - name: Run boot-time delivery and packaged OS check-in tracer
        env:
          CENTRAL_IMAGE: ${{ steps.central.outputs.imageid }}
          DEVICE_ROOT: ${{ steps.device-root.outputs.image }}
          BOOTSTRAPPER_DEB: ${{ steps.bootstrapper-deb.outputs.deb_path }}
          PLAYER_DEB: ${{ steps.player-deb.outputs.deb_path }}
        run: |
          .venv/bin/python -m scripts.test_netboot_e2e run \
            --state-dir "$RUNNER_TEMP/netboot-e2e" \
            --central-image "$CENTRAL_IMAGE" \
            --device-root "$DEVICE_ROOT" \
            --bootstrapper-deb "$BOOTSTRAPPER_DEB" \
            --deb "$PLAYER_DEB"

      # Always, so a failed device-root build (whose later steps are skipped)
      # still uploads mmdebstrap's whole log.
      - name: Upload tracer diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-netboot-e2e-${{ github.sha }}
          path: |
            ${{ runner.temp }}/netboot-e2e/evidence.json
            ${{ runner.temp }}/netboot-e2e/central.log
            ${{ runner.temp }}/netboot-e2e/compose-ps.txt
            ${{ runner.temp }}/netboot-e2e/provision.log
            ${{ runner.temp }}/netboot-e2e/os-agent-before.log
            ${{ runner.temp }}/netboot-e2e/packaged-refusal.log
            ${{ runner.temp }}/netboot-e2e/os-agent-after.log
            ${{ runner.temp }}/device-root/mmdebstrap.log
          if-no-files-found: warn
          retention-days: 7
