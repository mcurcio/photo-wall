name: Netboot boot-chain e2e tracer (p4 s3)

# Self-contained, process-level end-to-end tracer for the 0009 boot-time
# app-delivery contract (docs/decisions/0008-delivery-ledger.md,
# p4-boot-chain s3, Part A). Owner ruling (2026-09-12): process-level, NOT a
# QEMU kernel boot, and self-contained -- NO `release-artifacts` reusable
# workflow, NO pre-qualified OS-base, NO `--root`.
#
# It builds the REAL new-model Player `.deb` IN-JOB (scripts.build_player_deb,
# pure dpkg-deb, Architecture: all -- the apt-deps model, 0009
# p4-deb-full-depends), stands up a REAL central (uvicorn) + REAL Postgres,
# serves the `.deb`, and drives the REAL appliance.provision.Bootstrapper to
# fetch + sha256-verify + INSTALL it with a genuine `apt-get install -y <deb>`
# inside a `debian:trixie-slim` arm64 container with real apt sources -- so the
# `.deb`'s declared Depends (GTK/GStreamer/Mesa + python3-*) resolve from
# deb.debian.org. It then runs a Python-3.13 import smoke in that post-install
# container, hands off the origin, invokes start, and proves a flip-a-byte
# refusal. This job GATES retirement of the old signed netboot/release-authority
# pipeline (s4/s5).
#
# Part B (ticketless enroll -> pending -> operator bind -> render smoke) is
# proven by the re-keyed scripts/demo_wall.py runner under the existing
# "Controller and Player software e2e" job; both green together gate s4.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/test_netboot_e2e.py
      - appliance/provision.py
      - scripts/build_player_deb.py
      - central/app_packages.py
      - .github/workflows/netboot-e2e.yml

permissions:
  contents: read

concurrency:
  group: netboot-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracer:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'

      - name: Install the locked harness environment
        run: |
          python -m pip install uv==0.7.8
          uv sync --frozen

      - name: Authenticate to the durable image registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Set up the container build cache
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build or restore the central image
        id: central
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: central
          platforms: linux/arm64
          load: true
          tags: photo-wall-netboot-e2e-central:ci
          cache-from: |
            type=gha,scope=photo-wall-central-arm64-v1
            type=gha,scope=photo-wall-software-e2e-arm64-v1
          cache-to: type=gha,scope=photo-wall-software-e2e-arm64-v1,mode=max,ignore-error=true

      # Build the REAL new-model Player .deb in-job (pure dpkg-deb, no chroot,
      # no OS-base) -- the exact command base-image.yml uses.
      - name: Build the photo-wall-player .deb (apt-deps model)
        id: player-deb
        run: |
          set -eu
          install -d -m 0755 "$RUNNER_TEMP/photo-wall-player-deb"
          build_out=$(.venv/bin/python -m scripts.build_player_deb \
            --repository "$GITHUB_WORKSPACE" --revision "$GITHUB_SHA" \
            --output-dir "$RUNNER_TEMP/photo-wall-player-deb")
          printf '%s\n' "$build_out"
          deb_path=$(printf '%s\n' "$build_out" | tail -n1)
          echo "deb_path=$deb_path" >> "$GITHUB_OUTPUT"

      - name: Run the boot-time app-delivery tracer
        env:
          CENTRAL_IMAGE: ${{ steps.central.outputs.imageid }}
          PLAYER_DEB: ${{ steps.player-deb.outputs.deb_path }}
        run: |
          .venv/bin/python -m scripts.test_netboot_e2e run \
            --state-dir "$RUNNER_TEMP/netboot-e2e" \
            --central-image "$CENTRAL_IMAGE" \
            --deb "$PLAYER_DEB"

      - name: Upload tracer diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-netboot-e2e-${{ github.sha }}
          path: |
            ${{ runner.temp }}/netboot-e2e/evidence.json
            ${{ runner.temp }}/netboot-e2e/central.log
            ${{ runner.temp }}/netboot-e2e/compose-ps.txt
            ${{ runner.temp }}/netboot-e2e/public.json
          if-no-files-found: warn
          retention-days: 7
