name: V2 node components

# Builds the exact V2 node component set ONCE per pipeline run, for every job that needs it:
# base-image.yml bakes node-base.deb and node-display.deb into the squashfs and the seal ships
# the set (the photo-wall-node-components-<revision> artifact), and each node-pid1.yml leg boots
# it under real systemd from the PID1 fixture derived here (the -node-pid1-fixture- artifact:
# the stage targets, fixture.json and the fixture image as a `docker save` archive). Called by
# pipeline.yml (its `node-components` job) when the plan lists either consumer, and by
# base-image.yml and node-pid1.yml themselves only when dispatched by hand. Native arm64
# (ubuntu-24.04-arm): the components and the fixture image are arm64.
#
# The component builds run on a docker-container builder with a GHA BuildKit cache per role
# (the buildkit-cache action; scripts/node_build_inputs.py): the display build, and each sealed
# environment's dependency layer, are reused across commits; only what changed rebuilds. A hit
# reuses exactly the layer a cold build recorded, so the cache changes no byte: node-display.deb
# is reproducible (SOURCE_DATE_EPOCH) and a sealed environment's digest names its image ID,
# which BuildKit derives from the layers and the pin's SOURCE_DATE_EPOCH.
#
# Above that, the whole output is cached: the set is a function of its inputs alone and names
# no commit (scripts/node_component_inputs.py), so the key is the digest of the very input
# manifest the build records, computed by the same code before building. A hit restores the set
# (and, when asked, its PID1 fixture) instead of building; either way the set is then stamped
# with this revision, which refuses a set whose recorded inputs are not this revision's.
on:
  workflow_call:
    inputs:
      revision:
        description: Exact 40-character commit the components are built from
        required: true
        type: string
      pid1-fixture:
        description: Also derive the real-PID1 scenarios' fixture from the components
        required: false
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    # Cold about 9 min (components 6, fixture 3); with the BuildKit caches warm, a few minutes;
    # on a whole-output hit, the restore and the stamp.
    timeout-minutes: 40
    env:
      REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - uses: ./.github/actions/python-uv

      - name: Install the locked environment
        run: uv sync --frozen

      - name: Compute the component input digest
        id: inputs
        run: |
          set -eu
          digest=$(.venv/bin/python -m scripts.node_component_inputs key \
            --repository "$GITHUB_WORKSPACE" --revision "$REVISION")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Exact keys only, never a prefix fallback: a set built from other inputs is not this one.
      # The fixture is derived from the set it was built with, so it is cached WITH that set.
      - name: Restore the component set
        id: restore-components
        if: ${{ !inputs.pid1-fixture }}
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/node-components
          key: node-components-v1-${{ steps.inputs.outputs.digest }}

      - name: Restore the component set and its PID1 fixture
        id: restore-pid1
        if: inputs.pid1-fixture
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/node-components
            ${{ runner.temp }}/node-pid1-fixture.tar.zst
          key: node-pid1-v1-${{ steps.inputs.outputs.digest }}

      - name: Resolve the cache outcome
        id: cached
        env:
          HIT: ${{ steps.restore-components.outputs.cache-hit == 'true' || steps.restore-pid1.outputs.cache-hit == 'true' }}
        run: |
          set -eu
          echo "hit=$HIT" >> "$GITHUB_OUTPUT"
          # A failed restore can leave part of an output behind; the build refuses an existing one.
          if [ "$HIT" != true ]; then
            rm -rf "$RUNNER_TEMP/node-components" "$RUNNER_TEMP/node-pid1-fixture.tar.zst"
          fi

      # Not made current (use: false): the fixture image builds FROM a local image, on Docker's
      # daemon-backed default builder (scripts/container_build.py), which this must not replace.
      - name: Set up the container build cache
        if: steps.cached.outputs.hit != 'true'
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          use: false

      # The builders run `docker buildx build` themselves, which reads the GHA cache service's
      # URL and token from the ACTIONS_* environment that only actions see: this exports it.
      - name: Expose the GHA cache service to the builders
        if: steps.cached.outputs.hit != 'true'
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Resolve the node build cache scopes
        if: steps.cached.outputs.hit != 'true'
        id: cache
        uses: ./.github/actions/buildkit-cache
        with:
          name: node-{role}
          architecture: arm64

      - name: Build the immutable V2 node components
        if: steps.cached.outputs.hit != 'true'
        env:
          PHOTO_WALL_NODE_BUILDER: ${{ steps.buildx.outputs.name }}
          PHOTO_WALL_NODE_BUILD_CACHE_FROM: ${{ steps.cache.outputs.from }}
          PHOTO_WALL_NODE_BUILD_CACHE_TO: ${{ steps.cache.outputs.to }}
        run: |
          set -eu
          SOURCE_DATE_EPOCH=$(python3 scripts/debian_packages.py epoch)
          export SOURCE_DATE_EPOCH
          .venv/bin/python -m scripts.build_node_components \
            --repository "$GITHUB_WORKSPACE" --revision "$REVISION" \
            --output "$RUNNER_TEMP/node-components"

      # The targets are the app repacked: their environments read the app's cache (the same
      # dependency layer) and write none, so the app's scope keeps the app's own index.
      - name: Build the stage targets and the PID1 fixture image
        if: steps.cached.outputs.hit != 'true' && inputs.pid1-fixture
        env:
          PHOTO_WALL_NODE_BUILDER: ${{ steps.buildx.outputs.name }}
          PHOTO_WALL_NODE_BUILD_CACHE_FROM: ${{ steps.cache.outputs.from }}
        run: |
          set -eu
          fixture="$RUNNER_TEMP/node-pid1-fixture"
          .venv/bin/python -m scripts.build_node_pid1_fixture \
            --components "$RUNNER_TEMP/node-components" --output "$fixture"
          image=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["image"])' \
            "$fixture/fixture.json")
          docker save "$image" -o "$fixture/image.tar"
          # One archive, zstd on every core: the targets' environments and the image are about
          # 3 GB raw, a third of that compressed.
          tar -C "$RUNNER_TEMP" -cf - node-pid1-fixture \
            | zstd -T0 -3 -q -o "$RUNNER_TEMP/node-pid1-fixture.tar.zst"

      # Written only from main, before the stamp (the cached set names no commit): every pull
      # request reads main's entries (docs/module-appliance-ci.md, "Limits"), and its own, about
      # 1 GB a set and 2 with the fixture, would only crowd them out.
      - name: Save the component set
        if: steps.cached.outputs.hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/node-components
          key: node-components-v1-${{ steps.inputs.outputs.digest }}

      - name: Save the component set and its PID1 fixture
        if: steps.cached.outputs.hit != 'true' && inputs.pid1-fixture && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/node-components
            ${{ runner.temp }}/node-pid1-fixture.tar.zst
          key: node-pid1-v1-${{ steps.inputs.outputs.digest }}

      # The only record of the commit: written after the build or the restore, and refused when
      # the set's recorded inputs are not this revision's (the release seal checks it).
      - name: Stamp the component set with this revision
        run: |
          .venv/bin/python -m scripts.node_component_inputs stamp \
            --repository "$GITHUB_WORKSPACE" --revision "$REVISION" \
            --components "$RUNNER_TEMP/node-components"

      # The shipped squashfs images (E2c; the build already refused two builds with different
      # digests): each is its ref's digest and size, has the contract's format, and, mounted
      # read-only, passes the full verify_root (the per-file proof's one home).
      - name: Prove the shipped environment images (ref, format, mount, verify_root)
        env:
          PHOTO_WALL_IMAGE_MOUNT_TESTS: "1"
          PHOTO_WALL_NODE_COMPONENTS: ${{ runner.temp }}/node-components
        run: .venv/bin/python -m pytest -q tests/node/apps/test_environment_image.py

      # The seal ships these bytes on a release; a pull request's consumers need them for a day.
      # About 1 GB, mostly the environments: the fastest zip level.
      - name: Upload exact V2 node components
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-node-components-${{ inputs.revision }}
          path: ${{ runner.temp }}/node-components/
          if-no-files-found: error
          compression-level: 1
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}

      # Already compressed: stored, not zipped again.
      - name: Upload the PID1 fixture
        if: inputs.pid1-fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-node-pid1-fixture-${{ inputs.revision }}
          path: ${{ runner.temp }}/node-pid1-fixture.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
