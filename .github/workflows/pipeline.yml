name: Pipeline

# One workflow for every pull request and every push to main.
# Its `gate` job is the ONE required check.
#
#   plan            scripts/release_plan.py: the release rule, written once, and the only caller
#                   of commitizen. Its `jobs` output lists the conditional jobs this run needs;
#                   every `if:` below reads it, and the gate holds the run to it.
#   checks, e2e     checks.yml and software-e2e.yml, on every pull request and push.
#   base-image      base-image.yml, when the base bundle or a .deb changed -- and on every
#                   release, whose assets it builds (no second base build).
#   netboot-e2e     netboot-e2e.yml, when a .deb or the tracer's own paths changed.
#   tested          the barrier every release job needs: each test job the plan listed passed.
#   service-base, images, seal
#                   the release, in that order: a push to main that changed a shipped package.
#                   Each also requires that event in its own `if:` (the guard below).
#                   images pushes the service images BY DIGEST (and `:sha-<revision>`), which
#                   claims no version; seal is the ONE job that writes a version.
#   gate            the required check: every job the plan listed succeeded, and none failed
#                   or was cancelled.
#
# WHEN IT RELEASES (scripts/release_plan.py owns the rule): a push to main releases exactly
# when a shipped package's inputs (the script's package manifest) differ from the last `v*`
# tag, at commitizen's next version -- or the next PATCH when no commit bumps. Commit types
# pick the increment, never whether to release. A pull request's plan reports what merging it
# releases and refuses a commit that is not a Conventional Commit (merge and rebase land every
# commit on main).
#
# A PULL REQUEST NEVER RELEASES, twice over: its plan lists only test jobs (the script's
# PullRequestRun has no release job), and every job that tags, publishes or pushes an image
# also requires, in its own `if:`, a push to main:
#   (github.event_name == 'push' && github.ref == 'refs/heads/main')
# tests/test_release_plan.py holds every write-scoped job to that guard.
#
# A RELEASE IS VISIBLE ONLY WHEN IT IS COMPLETE. The seal (scripts/release_seal.py) is the only
# job with `contents: write` and the only one that reads the plan's tag: it claims the version
# (the plan's `since` must still be the highest published tag, so a stale re-run refuses),
# packages and verifies every declared asset (contracts/release.py) and image digest, attaches
# the assets to an invisible DRAFT and reads each back, and only then tags each image
# `:<version>` from its digest, re-reads the tags, and publishes the draft. It never deletes
# anything, reads GitHub back after an ambiguous write, converges when re-run, and passes
# without writing when re-run after it published. tests/test_release_seal.py holds it to each.
#
# A release that fails is not lost, and has ONE recovery, the normal flow: publishing creates
# the version's tag, so a run that fails first leaves no tag, and the next push to main
# releases whatever changed since the last published tag, from that push's commit. Until a
# version is published THE NEWEST COMMIT WINS it: that push's seal, at main's tip, re-tags the
# version's images from its own build even when a failed seal tagged them first, and a seal
# that is not main's tip never moves another run's tags. So a re-run of an older seal refuses
# once a newer run has sealed; before that, it publishes the version at its own commit (a
# complete release of that commit) and the next push releases the rest. There is no manual
# release path (no dispatch, no hand tag).
#
# The git tag is the SOLE version source of truth (pyproject `[tool.commitizen]`,
# `version_provider = "scm"`): nothing writes a bumped number back to main, which would loop
# `push: main`. There is deliberately NO `push: tags: v*` trigger: publishing the release
# creates the tag (server-side, at the exact built commit), and a run on that tag push would
# double-release it. A tag created with the ambient GITHUB_TOKEN triggers no workflow.
#
# UNSIGNED BY DESIGN: per the owner ruling (home LAN, no threat model, UX over security) NONE
# of these assets is signed -- there is no signing key anywhere in this workflow, and every
# sha256 published alongside them is a corruption check only, never an authenticity anchor.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # A newer push to a pull request supersedes its run. main never cancels a run mid-publish:
  # runs queue (a newer queued run replaces an older queued one, and its plan still covers the
  # older push, since it diffs against the last tag). A re-run of an older run queues the same
  # way, so it can replace a newer push's pending run: the older commit may then release, and
  # the newer push's changes ship with the next push.
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      should_release: ${{ steps.plan.outputs.should_release }}
      tag: ${{ steps.plan.outputs.tag }}
      since: ${{ steps.plan.outputs.since }}
      revision: ${{ steps.plan.outputs.revision }}
    steps:
      # Full history and tags: the plan diffs against the last v* tag and reads every commit
      # since it. A pull request checks out its merge ref.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/python-uv
      # Event values reach the script through env, never interpolated into the shell.
      - name: Plan this run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          case "$EVENT" in
            pull_request) python scripts/release_plan.py pr --base "$BASE_SHA" --head "$HEAD_SHA" ;;
            push) python scripts/release_plan.py push ;;
            *) echo "::error::no release plan for the $EVENT event"; exit 1 ;;
          esac

  # checks and e2e are the only jobs a pull request runs with a write scope: `packages: write`,
  # granted solely because their nested service-base.yml call publishes the content-addressed
  # media OS test dependency for a changed definition (same-repository runs only; see
  # docs/module-appliance-ci.md). They never hold `contents: write` and never tag or release.
  checks:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'checks')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/checks.yml

  e2e:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'e2e')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/software-e2e.yml

  # The base OS, the netboot bundle and both .debs, built for the plan's exact revision (a pull
  # request's merge commit or main's commit). Every artifact is
  # named by that revision, so the seal packages the bytes built here.
  base-image:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'base-image')
    permissions:
      contents: read
    uses: ./.github/workflows/base-image.yml
    with:
      revision: ${{ needs.plan.outputs.revision }}

  netboot-e2e:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'netboot-e2e')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/netboot-e2e.yml

  # The release jobs need this one job, not each test job: a job whose `needs` include a
  # skipped job is itself skipped (and `!failure()` passes a cancelled one), so the rule "every
  # test the plan listed succeeded" is judged here, by the same code as the gate.
  tested:
    needs: [plan, checks, e2e, base-image, netboot-e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Every test job the plan listed succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/release_plan.py gate

  # The Kubernetes-hosted control plane (the iac repo's external cluster) cannot
  # `build:` the compose `central`/`media-worker` targets the way local/CI does --
  # it pulls prebuilt images. So every release publishes those two targets to GHCR:
  # `images` pushes them by digest, and the seal tags each `:<version>` from that digest
  # just before it publishes the release. See docs/decisions/0011-central-service-images.md.

  # media-worker's target is `FROM ${MEDIA_BASE_IMAGE}` (Dockerfile), so it needs
  # the shared media OS base image. Reuse the same reusable workflow checks.yml
  # consumes; amd64 only (the control plane runs on x86 cluster nodes, not the
  # arm Pis -- multi-arch is deferred per 0011). `central` is `FROM runtime` and
  # needs no base image, so it does not depend on this.
  service-base:
    needs: [plan, tested]
    if: >-
      ${{ !cancelled() && needs.tested.result == 'success'
      && contains(fromJSON(needs.plan.outputs.jobs), 'service-base')
      && (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/service-base.yml
    with:
      architecture: amd64

  # The service images, pushed BY DIGEST: each under `:sha-<revision>` only, a tag that claims
  # no version, so nothing here can make a version visible. The job reads the plan's revision,
  # never its tag, and outputs each image as `<repository>@<digest>` -- the exact manifest the
  # seal promotes. Every attempt leaves one `:sha-<revision>` per image (see 0011 for its cost).
  images:
    needs: [plan, service-base]
    if: >-
      ${{ !cancelled() && needs.service-base.result == 'success'
      && contains(fromJSON(needs.plan.outputs.jobs), 'images')
      && (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      central: ghcr.io/${{ github.repository }}/central@${{ steps.central.outputs.digest }}
      media-worker: ghcr.io/${{ github.repository }}/media-worker@${{ steps.media-worker.outputs.digest }}
    steps:
      # Build the plan's exact revision.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.plan.outputs.revision }}
          persist-credentials: false
      - name: Authenticate to the durable image registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Set up the container build cache
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      # The service-image action reads the amd64 caches checks.yml wrote for this
      # revision, so a release does not rebuild from scratch. github.repository is
      # already lowercase (mcurcio/photo-wall), which ghcr requires.
      - name: Push the central service image by digest
        id: central
        uses: ./.github/actions/service-image
        with:
          target: central
          architecture: amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/central:sha-${{ needs.plan.outputs.revision }}
      - name: Push the media worker service image by digest
        id: media-worker
        uses: ./.github/actions/service-image
        with:
          target: media-worker
          architecture: amd64
          build-args: MEDIA_BASE_IMAGE=${{ needs.service-base.outputs.image }}
          push: true
          tags: ghcr.io/${{ github.repository }}/media-worker:sha-${{ needs.plan.outputs.revision }}

      - uses: ./.github/actions/python-uv
      - name: Install locked test tooling for the exact-image matrix
        run: uv sync --frozen
      - name: Exercise the installed Central digest and retain immutable reports
        env:
          CENTRAL: ghcr.io/${{ github.repository }}/central@${{ steps.central.outputs.digest }}
          REVISION: ${{ needs.plan.outputs.revision }}
        run: |
          .venv/bin/python scripts/node_rollout_image_check.py --image "$CENTRAL" \
            --revision "$REVISION" --output "$RUNNER_TEMP/node-image-qualification"
      - name: Sign qualification only with the separately provisioned CI authority
        env:
          CI_QUALIFICATION_KEY: ${{ secrets.PHOTO_WALL_CI_QUALIFICATION_KEY }}
        run: |
          if [ -z "$CI_QUALIFICATION_KEY" ]; then
            echo "::notice::D17 image reports are unsigned and unqualified: CI authority is not provisioned"
          else
            umask 077
            key_file="$RUNNER_TEMP/node-ci-qualification-key"
            trap 'rm -f "$key_file"' EXIT
            printf '%s' "$CI_QUALIFICATION_KEY" > "$key_file"
            .venv/bin/python scripts/node_rollout_ci_evidence.py sign \
              --input "$RUNNER_TEMP/node-image-qualification/qualification.json" \
              --reports "$RUNNER_TEMP/node-image-qualification/reports" --key "$key_file" \
              --output "$RUNNER_TEMP/node-image-qualification/qualification.signed.json"
          fi
      - name: Retain exact-image qualification independently of unsigned release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-image-qualification-${{ needs.plan.outputs.revision }}
          path: ${{ runner.temp }}/node-image-qualification
          if-no-files-found: error

  # THE ONE JOB THAT WRITES A VERSION: its image tags, its git tag and its GitHub Release. Every
  # step of it is scripts/release_seal.py (claim, package, verify, promote, stage, publish,
  # reconcile), so the order that keeps a release invisible until it is complete is code, tested
  # against a scripted GitHub and registry, not a sequence of shell steps. The central watcher
  # skips drafts, so the draft this job stages is invisible until the one publish call.
  seal:
    needs: [plan, tested, images]
    if: >-
      ${{ !cancelled() && needs.tested.result == 'success'
      && needs.images.result == 'success'
      && contains(fromJSON(needs.plan.outputs.jobs), 'seal')
      && (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      # The plan's exact revision: the seal reads its commit time (the base tarball's member
      # time) and its code, never the default branch's.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.plan.outputs.revision }}
          persist-credentials: false

      - name: Authenticate to the durable image registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Download the netboot base bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: photo-wall-base-bundle-${{ needs.plan.outputs.revision }}
          path: ${{ runner.temp }}/photo-wall-release/bundle

      - name: Download the Player .deb
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: photo-wall-player-deb-${{ needs.plan.outputs.revision }}
          path: ${{ runner.temp }}/photo-wall-release/player-deb

      - name: Download the data-only Player payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: photo-wall-player-payload-${{ needs.plan.outputs.revision }}
          path: ${{ runner.temp }}/photo-wall-release/player-payload

      - name: Download the bootstrapper .deb
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: photo-wall-bootstrapper-deb-${{ needs.plan.outputs.revision }}
          path: ${{ runner.temp }}/photo-wall-release/bootstrapper-deb

      - name: Download V2 node components
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: photo-wall-node-components-${{ needs.plan.outputs.revision }}
          path: ${{ runner.temp }}/photo-wall-release/node-components

      - name: Download explicit V2 cohort bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: photo-wall-node-bundle-${{ needs.plan.outputs.revision }}
          path: ${{ runner.temp }}/photo-wall-release/node-bundle

      # Plan and image values reach the script through env, never interpolated into the shell.
      - name: Seal the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          SINCE: ${{ needs.plan.outputs.since }}
          REVISION: ${{ needs.plan.outputs.revision }}
          CENTRAL: ${{ needs.images.outputs.central }}
          MEDIA_WORKER: ${{ needs.images.outputs.media-worker }}
        run: |
          release_root="$RUNNER_TEMP/photo-wall-release"
          python3 -m scripts.release_seal --tag "$TAG" --revision "$REVISION" --since "$SINCE" \
            --base-bundle "$release_root/bundle" \
            --node-components "$release_root/node-components" \
            --node-bundle "$release_root/node-bundle" \
            --player-deb "$release_root/player-deb" \
            --player-payload "$release_root/player-payload" \
            --bootstrapper-deb "$release_root/bootstrapper-deb" \
            --image "central=$CENTRAL" --image "media-worker=$MEDIA_WORKER" \
            --destination "$release_root/artifacts"

  # The ONE required check. It runs whatever happened, and fails when the plan failed, when a
  # job the plan listed did not succeed, or when any job failed or was cancelled.
  gate:
    name: gate
    needs: [plan, checks, e2e, base-image, netboot-e2e, tested, service-base, images, seal]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Every job the plan listed succeeded, and none failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/release_plan.py gate
