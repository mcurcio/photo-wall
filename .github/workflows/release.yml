name: Appliance release

# Publishes a tagged commit's appliance build as a GitHub Release, signed with
# the persistent project key, with operator-consumable artifacts for both the
# diskless netboot fleet and the flash path.
#
# This workflow does not itself construct the Pi OS or signed appliance --
# only appliance.yml does that (see docs/module-appliance-ci.md and the
# `tests/test_service_workflows.py` invariant that enforces it). It calls
# appliance.yml as a reusable workflow (its `workflow_call` trigger, guarded
# by its own `release-artifacts` job) to reassemble and sign the exact same
# already-qualified definition/application inputs with the production key,
# then downloads that job's raw build output and packages it here. It assumes
# the tagged commit already passed appliance.yml's push/PR boot qualification
# on its way to `main`; it does not repeat that VM boot gate.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      revision: ${{ steps.resolve.outputs.revision }}
    env:
      TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Validate the release tag format
        run: |
          if [[ ! "$TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)*$ ]]; then
            echo "::error::TAG '$TAG_INPUT' is not a v-prefixed release tag (expected e.g. v1.2.3)." >&2
            exit 1
          fi

      # Fail closed BEFORE any expensive build work. A GitHub secret that was
      # never configured at all renders exactly the same as an empty string
      # in this ${{ secrets.* }} expression -- the appliance build's own
      # persistent-signing-key guard only fires for a variable that is SET
      # but empty, so it cannot see that "never configured" case. This check
      # closes that gap instead of silently falling back to a disposable
      # per-build key for a published release.
      - name: Require the persistent release signing key secret
        env:
          PHOTO_WALL_RELEASE_SIGNING_KEY: ${{ secrets.PHOTO_WALL_RELEASE_SIGNING_KEY }}
        run: |
          value="${PHOTO_WALL_RELEASE_SIGNING_KEY//[[:space:]]/}"
          if [[ -z "$value" ]]; then
            echo "::error::PHOTO_WALL_RELEASE_SIGNING_KEY secret is missing or empty." \
                 "Refusing to publish a release that would silently fall back to a" \
                 "disposable per-build signing key." >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ env.TAG_INPUT }}
          persist-credentials: false

      # workflow_dispatch's ambient github.sha is whatever ref was selected in
      # the "Run workflow" UI, which need not match the typed `tag` input --
      # and appliance.yml's shared select-definition job (reused below) reads
      # that ambient context, not our input. Resolving and threading the exact
      # commit through as an explicit `revision` input keeps this correct
      # regardless of that selector; a mismatch there still fails closed (the
      # OS-base bundle's definition_id is independently re-verified against
      # this exact checked-out revision -- see scripts/os_base.py::verify).
      - name: Resolve the tag's exact commit
        id: resolve
        run: |
          echo "tag=$TAG_INPUT" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/appliance.yml
    with:
      revision: ${{ needs.resolve.outputs.revision }}
    secrets:
      release_signing_key: ${{ secrets.PHOTO_WALL_RELEASE_SIGNING_KEY }}

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      REVISION: ${{ needs.resolve.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/photo-wall-release

      - name: Package operator-consumable release artifacts
        run: |
          release_root="$RUNNER_TEMP/photo-wall-release"
          flash_image=$(python3 -c '
          import json, sys
          print(json.load(open(sys.argv[1]))["image"])
          ' "$release_root/flash/ci-flash-image.json")
          python3 -m scripts.package_release_artifacts \
            --output "$release_root/output" \
            --flash-image "$flash_image" \
            --release-pub "$release_root/deployment/public/release.pub.pem" \
            --destination "$release_root/artifacts" \
            --revision "$REVISION"

      # Notes are rendered by Python (not a shell heredoc) so the Markdown's
      # own backticks/`${...}` cannot be reinterpreted as shell substitution.
      - name: Generate release notes
        run: |
          release_root="$RUNNER_TEMP/photo-wall-release"
          python3 - "$release_root/notes.md" <<'PY'
          import os
          import sys

          revision = os.environ["REVISION"]
          repo_blob = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/{os.environ['TAG']}"
          notes = f"""\
          Signed appliance release for `{revision}`, built and signed with the
          persistent project release key (`release.pub.pem` attached below).

          ## Netboot fleet

          Unpack `photo-wall-netboot-{revision}.tar.gz`:

          - stage its `tftp/` tree beneath your TFTP root (see
            [PXE service setup]({repo_blob}/docs/module-pxe-service.md));
          - copy its `release/` contents into central's `PHOTO_WALL_RELEASE_ROOT`
            and register the release with central using `release.json`/`release.sig`.

          ## Flash fleet

          Decompress `photo-wall-flash-{revision}.img.xz` (verify against its
          `.sha256` first) and write it to an SD card or USB drive -- see
          [Provision Player appliances]({repo_blob}/README.md#provision-player-appliances).

          ## Trust anchor

          Configure central with the attached `release.pub.pem` -- it must match
          the key this release was signed with, or registration fails closed.
          Verify every attached file against `SHA256SUMS`.

          See the [setup and recovery runbook]({repo_blob}/docs/runbook.md) for the
          full operator procedure.
          """
          destination = sys.argv[1]
          with open(destination, "w") as handle:
              handle.write(notes)
          PY

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_root="$RUNNER_TEMP/photo-wall-release"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Photo Wall appliance $TAG" \
            --notes-file "$release_root/notes.md" \
            "$release_root"/artifacts/*
