name: Controller and Player software e2e

# Called by pipeline.yml (its `e2e` job) on every pull request and push to main; the pipeline
# owns the triggers and the concurrency. To prepare a missing media OS dependency by hand,
# dispatch service-base.yml.
#
# Three parallel jobs, each with its own disposable Immich: `immich-adapter` runs the fixture's
# adapter and network-boundary checks; `two-players-three-outputs` is one job per fault segment
# of the full wall scenario (scripts/demo_wall.py SCENARIOS), each starting a set-up fixture only
# (`--setup-only`) and running the same setup and baseline before its segment. Every job's
# shared setup is the software-e2e-setup action. The scenario's Players run from the app root
# (photo-wall-player, decision 0019) of the node component set the pipeline's node-components
# job built for the same revision.
on:
  workflow_call:
    inputs:
      revision:
        description: >-
          The exact commit node-components.yml built the node component set for; the wall
          scenario runs the Player from that set's app image
        required: true
        type: string

permissions:
  contents: read

jobs:
  service-base:
    uses: ./.github/workflows/service-base.yml
    permissions:
      contents: read
      packages: write
    with:
      architecture: arm64

  two-players-three-outputs:
    needs: service-base
    if: always()
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        part: [upstream-faults, central-player-faults]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Require media OS preparation
        env:
          PREPARATION: ${{ needs.service-base.result }}
          MEDIA_BASE_IMAGE: ${{ needs.service-base.outputs.image }}
        run: |
          test "$PREPARATION" = success
          test -n "$MEDIA_BASE_IMAGE"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up the e2e runner
        id: setup
        uses: ./.github/actions/software-e2e-setup
        with:
          media-base-image: ${{ needs.service-base.outputs.image }}
          central: 'true'

      # The Player runs from the app root node-components.yml built for this run (its
      # photo-wall-node-components-<revision> artifact): scripts/demo_wall.py unpacks the image in
      # the roots container, read from that job's build cache.
      - name: Download the V2 node components
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: photo-wall-node-components-${{ inputs.revision }}
          path: ${{ runner.temp }}/node-components

      - name: Expose the GHA cache service to the roots container build
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Resolve the roots container's cache scope
        id: cache
        uses: ./.github/actions/buildkit-cache
        with:
          name: node-{role}
          architecture: arm64
          write: 'false'

      - name: Start a disposable real Immich fixture
        env:
          WORKER_IMAGE: ${{ steps.setup.outputs.worker-image }}
          PHOTO_WALL_DOCKER_DEBUG: '1'
          PHOTO_WALL_DOCKER_DEBUG_LOG: ${{ runner.temp }}/photo-wall-software-e2e/docker-debug.log
        run: |
          .venv/bin/python -m scripts.immich_fixture run \
            --state-dir "$RUNNER_TEMP/immich-fixture" \
            --base-image "$WORKER_IMAGE" \
            --keep --setup-only

      - name: Exercise two Players and three Outputs through ${{ matrix.part }}
        env:
          PART: ${{ matrix.part }}
          CENTRAL_IMAGE: ${{ steps.setup.outputs.central-image }}
          WORKER_IMAGE: ${{ steps.setup.outputs.worker-image }}
          REVISION: ${{ inputs.revision }}
          PHOTO_WALL_NODE_BUILDER: ${{ steps.setup.outputs.builder }}
          PHOTO_WALL_NODE_BUILD_CACHE_FROM: ${{ steps.cache.outputs.from }}
          PHOTO_WALL_DOCKER_DEBUG: '1'
          PHOTO_WALL_DOCKER_DEBUG_LOG: ${{ runner.temp }}/photo-wall-software-e2e/docker-debug.log
        run: |
          .venv/bin/python -m scripts.demo_wall run \
            --state-dir "$RUNNER_TEMP/wall-demo" \
            --immich-state "$RUNNER_TEMP/immich-fixture" \
            --app-image "$RUNNER_TEMP/node-components/app.squashfs" \
            --revision "$REVISION" \
            --central-image "$CENTRAL_IMAGE" \
            --worker-image "$WORKER_IMAGE" \
            --scenario "$PART"

      - name: Upload sanitized software evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-software-e2e-${{ matrix.part }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/immich-fixture/evidence.json
            ${{ runner.temp }}/wall-demo/evidence.json
            ${{ runner.temp }}/wall-demo/last-central.json
            ${{ runner.temp }}/wall-demo/last-players.json
            ${{ runner.temp }}/wall-demo/runtime-provenance.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Docker failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-software-e2e-docker-debug-${{ matrix.part }}-${{ github.sha }}
          path: ${{ runner.temp }}/photo-wall-software-e2e/docker-debug.log
          if-no-files-found: warn
          retention-days: 7

      - name: Remove the disposable Immich fixture
        if: always()
        env:
          PHOTO_WALL_DOCKER_DEBUG: '1'
          PHOTO_WALL_DOCKER_DEBUG_LOG: ${{ runner.temp }}/photo-wall-software-e2e/docker-debug.log
        run: |
          if [ -f "$RUNNER_TEMP/immich-fixture/fixture.json" ]; then
            .venv/bin/python -m scripts.immich_fixture cleanup \
              --state-dir "$RUNNER_TEMP/immich-fixture"
          fi

  immich-adapter:
    needs: service-base
    if: always()
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Require media OS preparation
        env:
          PREPARATION: ${{ needs.service-base.result }}
          MEDIA_BASE_IMAGE: ${{ needs.service-base.outputs.image }}
        run: |
          test "$PREPARATION" = success
          test -n "$MEDIA_BASE_IMAGE"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up the e2e runner
        id: setup
        uses: ./.github/actions/software-e2e-setup
        with:
          media-base-image: ${{ needs.service-base.outputs.image }}

      # Not retained: the fixture removes its services when it finishes, passed or failed.
      - name: Check the upstream adapter against a disposable real Immich
        env:
          WORKER_IMAGE: ${{ steps.setup.outputs.worker-image }}
          PHOTO_WALL_DOCKER_DEBUG: '1'
          PHOTO_WALL_DOCKER_DEBUG_LOG: ${{ runner.temp }}/photo-wall-immich-adapter/docker-debug.log
        run: |
          .venv/bin/python -m scripts.immich_fixture run \
            --state-dir "$RUNNER_TEMP/immich-fixture" \
            --base-image "$WORKER_IMAGE"

      - name: Upload sanitized adapter evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-immich-adapter-${{ github.sha }}
          path: ${{ runner.temp }}/immich-fixture/evidence.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Docker failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-immich-adapter-docker-debug-${{ github.sha }}
          path: ${{ runner.temp }}/photo-wall-immich-adapter/docker-debug.log
          if-no-files-found: warn
          retention-days: 7
