name: Controller and Player software e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: software-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  two-players-three-outputs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      PHOTO_WALL_DOCKER_DEBUG: '1'
      PHOTO_WALL_DOCKER_DEBUG_LOG: ${{ runner.temp }}/photo-wall-software-e2e/docker-debug.log
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'

      - name: Install the locked harness environment
        run: |
          python -m pip install uv==0.7.8
          uv sync --frozen

      - name: Set up the container build cache
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build or restore the central image
        id: central
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: central
          platforms: linux/arm64
          load: true
          tags: photo-wall-software-e2e-central:ci
          cache-from: |
            type=gha,scope=photo-wall-central-arm64-v1
            type=gha,scope=photo-wall-software-e2e-arm64-v1
          cache-to: type=gha,scope=photo-wall-software-e2e-arm64-v1,mode=max,ignore-error=true

      - name: Build or restore the media worker image
        id: worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: media-worker
          platforms: linux/arm64
          load: true
          tags: photo-wall-software-e2e-worker:ci
          cache-from: |
            type=gha,scope=photo-wall-central-arm64-v1
            type=gha,scope=photo-wall-worker-arm64-v1
            type=gha,scope=photo-wall-software-e2e-arm64-v1
          cache-to: type=gha,scope=photo-wall-software-e2e-arm64-v1,mode=max,ignore-error=true

      - name: Build the isolated Player package
        run: |
          .venv/bin/python -m scripts.build_player \
            --revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/player-wheelhouse"

      - name: Start a disposable real Immich fixture
        env:
          WORKER_IMAGE: ${{ steps.worker.outputs.imageid }}
        run: |
          .venv/bin/python -m scripts.immich_fixture run \
            --state-dir "$RUNNER_TEMP/immich-fixture" \
            --base-image "$WORKER_IMAGE" \
            --keep

      - name: Exercise two Players and three Outputs
        env:
          CENTRAL_IMAGE: ${{ steps.central.outputs.imageid }}
          WORKER_IMAGE: ${{ steps.worker.outputs.imageid }}
        run: |
          .venv/bin/python -m scripts.demo_wall run \
            --state-dir "$RUNNER_TEMP/wall-demo" \
            --immich-state "$RUNNER_TEMP/immich-fixture" \
            --wheelhouse "$RUNNER_TEMP/player-wheelhouse" \
            --revision "$GITHUB_SHA" \
            --central-image "$CENTRAL_IMAGE" \
            --worker-image "$WORKER_IMAGE" \
            --scenario full

      - name: Upload sanitized software evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-software-e2e-${{ github.sha }}
          path: |
            ${{ runner.temp }}/immich-fixture/evidence.json
            ${{ runner.temp }}/wall-demo/evidence.json
            ${{ runner.temp }}/wall-demo/last-central.json
            ${{ runner.temp }}/wall-demo/last-players.json
            ${{ runner.temp }}/wall-demo/runtime-provenance.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Docker failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-wall-software-e2e-docker-debug-${{ github.sha }}
          path: ${{ runner.temp }}/photo-wall-software-e2e/docker-debug.log
          if-no-files-found: warn
          retention-days: 7

      - name: Remove the disposable Immich fixture
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/immich-fixture/fixture.json" ]; then
            .venv/bin/python -m scripts.immich_fixture cleanup \
              --state-dir "$RUNNER_TEMP/immich-fixture"
          fi
