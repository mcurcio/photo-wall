# The Node's bus (decision 0017): the server every Node component and Central's leaf link use.
# The base ships this file unmodified; every per-Node value is a $VAR from the unit's environment.
# Local clients land in account API with no credentials. The leaf binds account LEAF, which reaches
# API only through service imports, so Central (a client in the Node's hub account) reaches the Node's
# JetStream as $JS.node.API and nothing in API can route toward the hub (erratum E-W1-LEAF-2).
server_name: $PHOTO_WALL_BUS_NAME
host: 127.0.0.1
port: $PHOTO_WALL_BUS_PORT
# What the server queues for one local client before it closes it as a slow consumer
# (== contracts.node_link.NODE_MAX_PENDING). nodeapi caps every pull request at half of it, so a
# component whose loop is busy while a batch arrives is never cut off (erratum E-W1-TD-3).
max_pending: 2MB
# The largest message (headers + payload), == contracts.node_link.NODE_MAX_PAYLOAD, the hub's own
# max_payload too: the hub refuses a larger one at its client, so none reaches this leaf, where it
# would close the leaf (erratum E-W1-BUF-3). Every stream stores at most MAX_STORED_MESSAGE, so no
# reply about one stored message is larger either (E-W1-TD-2); a reply that grows with a stream's
# state (STREAM.INFO's deleted_details or subjects_filter) is not bounded (E-W1-TD-9).
max_payload: 256KB
# The longest control line (subject, reply and sizes) a local client may send, ==
# contracts.node_link.NODE_MAX_CONTROL_LINE, the hub's own too: the server's default 4 KiB, pinned so
# an upgrade cannot move it, never lowered, so it closes no client the base server kept (E-W1-TD-8).
# It bounds every stored subject (a KV key included), which a reply about one stored message
# repeats, so MAX_STORED_MESSAGE leaves room for it (E-W1-TD-6). The leaf is exempt.
max_control_line: 4KB
# A client's write that misses its deadline is retried, never a reason to close the client: a busy
# component slows the server's writes to it and keeps its connection (E-W1-TD-3). Local clients only:
# the leaf sets its own deadline below.
write_deadline: "2s"
write_timeout: retry
jetstream {
  domain: node                    # == contracts.node_link.NODE_DOMAIN; held by the config test
  # tmpfs with no size= (a sized tmpfs refuses writes when full): the store's pages are RAM charged
  # to the bus unit's cgroup, kept across a server restart, lost at reboot (STORE1 = A). The unit's
  # MemoryMax and GOMEMLIMIT are contracts.node_link.NODE_BUS_MEMORY_MAX and NODE_BUS_GOMEMLIMIT;
  # nodeapi's class table refuses a split whose files could not fit beside the heap (E-W1-STORE-1).
  store_dir: $PHOTO_WALL_BUS_STORE
  # The outer fence (API8), == contracts.node_link.NODE_STORE_BYTES. The server reserves each
  # stream's own cap against it when the stream is created (10047 past it), so the stored bytes never
  # pass it and it never refuses a write (erratum E-W1-BUF-2); one nodeapi class table splits it, so
  # no declare meets 10047, and a re-declare looks the stream up rather than re-adding it.
  max_file_store: 12MB
  max_memory_store: 0             # no memory streams (10028 at create)
}
accounts {
  # Three accounts (== contracts.node_link NODE_ACCOUNT, LEAF_ACCOUNT, MIRROR_ACCOUNT; the config test
  # binds every list below to contracts.node_link). The hub's interest lives only in LEAF, which has no
  # user and no stream; nothing in API routes to it except a tracked response to one of Central's
  # requests, which no client may name as a reply subject (ns:server/client.go:4401-4405). So a program
  # makes nothing cross toward a stalled hub, and its subscriptions announce nothing there (E-W1-LEAF-2).
  API {                           # every local client lands here
    # Every stream must carry its own byte cap (10113 otherwise), and the account has no store
    # limit: one is checked with the new message added, before a full stream drops its oldest, so
    # it would refuse (10002) the write discard-old takes. Each stream's limits retention with
    # discard old is the only limit that acts on a write (the buffer rule, erratum E-W1-BUF-2).
    # max_streams (== NODE_ACCOUNT_MAX_STREAMS) plus MIRROR's 1 is NODE_MAX_STREAMS: the server refuses
    # a stream past it at create (10027), never a write; with max_file_store it bounds the store's
    # files to 12 MiB + 17 file-store blocks for any client (erratum E-W1-FIT-1). max_consumers (==
    # NODE_MAX_CONSUMERS) per stream, refused at create (10026); the default is 1,000.
    jetstream { max_bytes_required: true, max_streams: 16, max_consumers: 4 }
    # A program answers a request it was delivered once (allow_responses) and may name no other tracked
    # response (`_R_.`), nor see one; it may not delete, purge or re-cap a stream, which writes files past
    # a stream's cap plus one block, in either form ($JS.node.API maps to $JS.API before the check)
    # (== LOCAL_PUBLISH_DENY, LOCAL_SUBSCRIBE_DENY). allow_responses drops the default allow-all
    # (ns:server/auth.go:300-310), hence allow ">".
    users: [{user: local, password: local, permissions: {
      publish: {allow: [">"], deny: ["_R_.>", "$JS.API.STREAM.MSG.DELETE.>", "$JS.API.STREAM.PURGE.>",
                                     "$JS.API.STREAM.UPDATE.>"]}
      subscribe: {allow: [">"], deny: ["_R_.>", "$JS.API.>"]}
      allow_responses: true }}]
    # Central's whole reach into the Node (== NODE_SERVICES, each answered once, and NODE_PULL_SERVICE).
    exports: [
      {service: "$JS.API.STREAM.INFO.*", accounts: [LEAF]}
      {service: "$JS.API.STREAM.MSG.GET.*", accounts: [LEAF]}
      {service: "$JS.API.DIRECT.GET.>", accounts: [LEAF]}
      {service: "$JS.API.CONSUMER.CREATE.>", accounts: [LEAF]}
      {service: "$JS.API.CONSUMER.DURABLE.CREATE.>", accounts: [LEAF]}
      {service: "$JS.API.CONSUMER.DELETE.>", accounts: [LEAF]}
      {service: "$JS.API.CONSUMER.INFO.>", accounts: [LEAF]}
      {service: "$KV.>", accounts: [LEAF]}
      {service: "$JS.ACK.>", accounts: [LEAF]}
      {service: "$SRV.>", accounts: [LEAF]}
      {service: "*.method.>", accounts: [LEAF]}
      {service: "$JS.API.CONSUMER.MSG.NEXT.>", response_type: stream, accounts: [LEAF]}
    ]
    # The wall copy, under MIRROR_API_PREFIX (== MIRROR_SERVICES).
    imports: [
      {service: {account: MIRROR, subject: "$JS.API.STREAM.INFO.WALL"}, to: "MIRROR.API.STREAM.INFO.WALL"}
      {service: {account: MIRROR, subject: "$JS.API.STREAM.CREATE.WALL"}, to: "MIRROR.API.STREAM.CREATE.WALL"}
      {service: {account: MIRROR, subject: "$JS.API.STREAM.MSG.GET.WALL"}, to: "MIRROR.API.STREAM.MSG.GET.WALL"}
    ]
  }
  MIRROR {                        # the WALL mirror alone; no user, so no client aims anything at the hub
    jetstream { max_bytes_required: true, max_streams: 1, max_consumers: 4 }
    exports: [
      {service: "$JS.API.STREAM.INFO.WALL", accounts: [API]}
      {service: "$JS.API.STREAM.CREATE.WALL", accounts: [API]}
      {service: "$JS.API.STREAM.MSG.GET.WALL", accounts: [API]}
    ]
    # The mirror's consumer API and flow control at the hub, and its deliveries (== WALL_LINK_SERVICES).
    imports: [
      {service: {account: LEAF, subject: "ACC.WALL.API.CONSUMER.CREATE.*"}}
      {service: {account: LEAF, subject: "ACC.WALL.API.CONSUMER.CREATE.WALL.>"}}
      {service: {account: LEAF, subject: "ACC.WALL.API.CONSUMER.DELETE.WALL.*"}}
      {service: {account: LEAF, subject: "$JS.FC.WALL.>"}}
      {service: {account: LEAF, subject: "$JS.FC.*.*.WALL.>"}}
      {stream: {account: LEAF, subject: "DELIVER.WALL.>"}}
    ]
  }
  LEAF {                          # the leaf binds it; no user, no stream
    exports: [
      {service: "ACC.WALL.API.CONSUMER.CREATE.*", accounts: [MIRROR]}
      {service: "ACC.WALL.API.CONSUMER.CREATE.WALL.>", accounts: [MIRROR]}
      {service: "ACC.WALL.API.CONSUMER.DELETE.WALL.*", accounts: [MIRROR]}
      {service: "$JS.FC.WALL.>", accounts: [MIRROR]}
      {service: "$JS.FC.*.*.WALL.>", accounts: [MIRROR]}
      {stream: "DELIVER.WALL.>", accounts: [MIRROR]}
    ]
    imports: [
      {service: {account: API, subject: "$JS.API.STREAM.INFO.*"}}
      {service: {account: API, subject: "$JS.API.STREAM.MSG.GET.*"}}
      {service: {account: API, subject: "$JS.API.DIRECT.GET.>"}}
      {service: {account: API, subject: "$JS.API.CONSUMER.CREATE.>"}}
      {service: {account: API, subject: "$JS.API.CONSUMER.DURABLE.CREATE.>"}}
      {service: {account: API, subject: "$JS.API.CONSUMER.DELETE.>"}}
      {service: {account: API, subject: "$JS.API.CONSUMER.INFO.>"}}
      {service: {account: API, subject: "$KV.>"}}
      {service: {account: API, subject: "$JS.ACK.>"}}
      {service: {account: API, subject: "$SRV.>"}}
      {service: {account: API, subject: "*.method.>"}}
      {service: {account: API, subject: "$JS.API.CONSUMER.MSG.NEXT.>"}}
    ]
  }
}
no_auth_user: local               # local clients connect with no credentials
leafnodes {
  # The leaf's own write deadline, the server's default (DEFAULT_FLUSH_DEADLINE, ns:server/const.go:132),
  # pinned: without it the leaf takes the 2 s client deadline above (ns:server/client.go:731-738), and
  # its retry policy still closes it on a flush that writes nothing in that time (client.go:2020). It
  # is the uplink's stall budget: how long Wi-Fi, the ingress or the WAN may stall before the leaf is
  # closed and redialled. It bounds no memory: what the leaf may queue toward the hub is bounded by the
  # accounts above, at most what Central's own requests and pulls asked for (E-W1-FV-2, E-W1-LEAF-2).
  write_deadline: "10s"
  remotes: [{
    urls: [$PHOTO_WALL_BUS_LEAF_URL]   # ws://node-<id>:node-<id>@<origin host>[:port]/<prefix>
    account: LEAF
  }]
}
