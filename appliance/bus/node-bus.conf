# The Node's bus (decision 0017): the server every Node component and Central's leaf link use.
# The base ships this file unmodified; every per-Node value is a $VAR from the unit's environment.
# Local clients land in account API with no credentials; the leaf binds the same account, so
# Central (a client in the Node's hub account) reaches the Node's JetStream as $JS.node.API.
server_name: $PHOTO_WALL_BUS_NAME
host: 127.0.0.1
port: $PHOTO_WALL_BUS_PORT
# What the server queues for one local client before it closes it as a slow consumer
# (== contracts.node_link.NODE_MAX_PENDING). nodeapi caps every pull request at half of it, so a
# component whose loop is busy while a batch arrives is never cut off (erratum E-W1-TD-3).
max_pending: 2MB
# The largest message (headers + payload), == contracts.node_link.NODE_MAX_PAYLOAD, the hub's own
# max_payload too: the hub refuses a larger one at its client, so none reaches this leaf, where it
# would close the leaf (erratum E-W1-BUF-3). Every stream stores at most MAX_STORED_MESSAGE, so no
# reply about one stored message is larger either (E-W1-TD-2); a reply that grows with a stream's
# state (STREAM.INFO's deleted_details or subjects_filter) is not bounded (E-W1-TD-9).
max_payload: 256KB
# The longest control line (subject, reply and sizes) a local client may send, ==
# contracts.node_link.NODE_MAX_CONTROL_LINE, the hub's own too: the server's default 4 KiB, pinned so
# an upgrade cannot move it, never lowered, so it closes no client the base server kept (E-W1-TD-8).
# It bounds every stored subject (a KV key included), which a reply about one stored message
# repeats, so MAX_STORED_MESSAGE leaves room for it (E-W1-TD-6). The leaf is exempt.
max_control_line: 4KB
# A client's write that misses its deadline is retried, never a reason to close the client: a busy
# component slows the server's writes to it and keeps its connection (E-W1-TD-3). Local clients only:
# the leaf sets its own deadline below.
write_deadline: "2s"
write_timeout: retry
jetstream {
  domain: node                    # == contracts.node_link.NODE_DOMAIN; held by the config test
  # tmpfs with no size= (a sized tmpfs refuses writes when full): the store's pages are RAM charged
  # to the bus unit's cgroup, kept across a server restart, lost at reboot (STORE1 = A). The unit's
  # MemoryMax and GOMEMLIMIT are contracts.node_link.NODE_BUS_MEMORY_MAX and NODE_BUS_GOMEMLIMIT;
  # nodeapi's class table refuses a split whose files could not fit beside the heap (E-W1-STORE-1).
  store_dir: $PHOTO_WALL_BUS_STORE
  # The outer fence (API8), == contracts.node_link.NODE_STORE_BYTES. The server reserves each
  # stream's own cap against it when the stream is created (10047 past it), so the stored bytes never
  # pass it and it never refuses a write (erratum E-W1-BUF-2); one nodeapi class table splits it, so
  # no declare meets 10047, and a re-declare looks the stream up rather than re-adding it.
  max_file_store: 12MB
  max_memory_store: 0             # no memory streams (10028 at create)
}
accounts {
  API {                           # every local client lands here; the leaf binds it
    # Every stream must carry its own byte cap (10113 otherwise), and the account has no store
    # limit: one is checked with the new message added, before a full stream drops its oldest, so
    # it would refuse (10002) the write discard-old takes. Each stream's limits retention with
    # discard old is the only limit that acts on a write (the buffer rule, erratum E-W1-BUF-2).
    # max_streams (== contracts.node_link.NODE_MAX_STREAMS) refuses an 18th stream at create (10027),
    # never a write: with max_file_store it bounds the store's files to 12 MiB + 17 file-store blocks
    # for any client, which fits the bus's memory fence (erratum E-W1-FIT-1).
    jetstream { max_bytes_required: true, max_streams: 17 }
    # A local program never publishes on a subject the leaf carries to the hub (the deny list ==
    # contracts.node_link.LEAF_EXPORTS), except one reply to a request it was delivered: so nothing a
    # program does can queue toward a stalled hub (erratum E-W1-LEAF-1). allow_responses drops the
    # default allow-all (ns:server/auth.go:300-310), hence allow ">".
    users: [{user: local, password: local, permissions: {
      publish: {allow: [">"], deny: ["_CENTRAL.>", "ACC.WALL.API.CONSUMER.CREATE.*",
                                     "ACC.WALL.API.CONSUMER.CREATE.WALL.>", "ACC.WALL.API.CONSUMER.DELETE.WALL.*",
                                     "$JS.FC.WALL.>", "$JS.FC.*.*.WALL.>"]}
      allow_responses: true }}]
  }
}
no_auth_user: local               # local clients connect with no credentials
leafnodes {
  # The leaf's own write deadline, the server's default (DEFAULT_FLUSH_DEADLINE, ns:server/const.go:132),
  # pinned: without it the leaf takes the 2 s client deadline above (ns:server/client.go:731-738), and
  # its retry policy still closes it on a flush that writes nothing in that time (client.go:2020). It
  # is the uplink's stall budget: how long Wi-Fi, the ingress or the WAN may stall before the leaf is
  # closed and redialled. It bounds no memory: what the leaf may queue toward the hub is bounded by the
  # hub's allow-lists, at most what Central's own requests and pulls asked for (E-W1-FV-2, E-W1-LEAF-1).
  write_deadline: "10s"
  remotes: [{
    urls: [$PHOTO_WALL_BUS_LEAF_URL]   # ws://node-<id>:node-<id>@<origin host>[:port]/<prefix>
    account: API
  }]
}
