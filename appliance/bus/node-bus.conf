# The Node's bus (decision 0017): the server every Node component and Central's leaf link use.
# The base ships this file unmodified; every per-Node value is a $VAR from the unit's environment.
# Local clients land in account API with no credentials; the leaf binds the same account, so
# Central (a client in the Node's hub account) reaches the Node's JetStream as $JS.node.API.
server_name: $PHOTO_WALL_BUS_NAME
host: 127.0.0.1
port: $PHOTO_WALL_BUS_PORT
max_pending: 2MB
# The largest message (headers + payload), == contracts.node_link.NODE_MAX_PAYLOAD, the hub's too, so
# nothing from the hub closes the leaf with a payload error (erratum E-W1-BUF-2). Account API's
# store holds its streams' caps plus one such message, so a full stream drops its oldest and the
# account never refuses first (the buffer rule, erratum E-W1-BUF-1; the config test holds it).
max_payload: 256KB
write_deadline: "2s"
jetstream {
  domain: node                    # == contracts.node_link.NODE_DOMAIN; held by the config test
  store_dir: $PHOTO_WALL_BUS_STORE
  max_file_store: 12MB            # the Node's store (API8); E3c binds it to the line table
  max_memory_store: 0             # no memory streams
}
accounts {
  API {                           # every local client lands here; the leaf binds it
    # The server refuses a stream with no byte cap (max_bytes_required) and past the store. The
    # streams' caps leave one largest message of the store unreserved (the buffer rule).
    jetstream { max_file: 12MB, max_mem: 0, max_bytes_required: true }
    users: [{user: local, password: local}]
  }
}
no_auth_user: local               # local clients connect with no credentials
leafnodes {
  remotes: [{
    urls: [$PHOTO_WALL_BUS_LEAF_URL]   # ws://node-<id>:node-<id>@<origin host>[:port]/<prefix>
    account: API
  }]
}
