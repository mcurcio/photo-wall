# 0009 Phase 4: minimal netboot base OS via rpi-image-gen.
#
# Pinned tool version: raspberrypi/rpi-image-gen v2.8.0
# (commit 262d4df5a9f9d4133370465399a7958a7c22cdc7). See
# .github/workflows/base-image.yml for the exact clone/checkout.
#
# Produces ONLY the "Base OS bundle" rootfs described in
# docs/decisions/0009-minimal-base-and-app-package.md: a Debian trixie arm64
# minbase, systemd, the device set and the photo-wall-bootstrapper `.deb`
# (scripts/build_bootstrapper_deb.py: the bootstrapper's computed module
# closure under /usr/lib/photo-wall-bootstrapper and its systemd unit). The
# device set is every Debian package the bootstrapper and the Player need,
# rendered from the one declaration, scripts/debian_packages.py: provisioning
# installs the Player `.deb` with dpkg alone, so the base must carry its
# Depends. No application code and no origin: 0009 rule #1 is "the base OS
# carries no application and no origin." Kernel/initramfs/PXE-TFTP staging are
# the separate appliance/initramfs + appliance/provisioning concern and are
# out of scope for this config -- this emits the rootfs squashfs artifact only
# (see image/photo-wall-squashfs.yaml).
#
# Every bit of Photo Wall's own code ships to this build as a `.deb` -- this
# rpi-image-gen tree owns none of it, only the install step (the owner
# directive behind this rework: portable code must migrate cleanly across
# build tool chains, never be baked in as a tool-coupled raw-file overlay).
# Nor does it name a Debian package: the declaration does (a test checks).
#
# Build (see .github/workflows/base-image.yml for the full recipe, including
# building the `.deb` and rendering the device set and the apt sources before
# invoking this):
#   rpi-image-gen build -S appliance/rpi_image_gen -c photo-wall-base.yaml \
#     -- IGconf_app_bootstrapper_deb=/path/to/photo-wall-bootstrapper_<version>_all.deb \
#        IGconf_app_device_packages=/path/to/device.list \
#        IGconf_app_debian_sources=/path/to/photo-wall-debian.list
#
# Reproducibility: the Debian arm64 base is pulled from the declaration's
# pinned snapshot.debian.org sources (`python3 scripts/debian_packages.py
# sources`, rendered to a file by the CI job), never a rolling mirror and
# never a timestamp taken from the environment: rpi-image-gen's own snapshot
# layer reads SOURCE_DATE_EPOCH, which its `env -i` layer pipeline clears.

device:
  # Satisfies image-base's X-Env-Layer-RequiresProvider: device (see
  # device/photo-wall-device-none.yaml for the full rationale) without
  # pulling in a real Pi board layer's kernel/boot-firmware/wifi-firmware --
  # this build emits a bare rootfs squashfs, not a bootable Pi disk image.
  layer: photo-wall-device-none

layer:
  # Debian (not Raspberry Pi OS) trixie arm64 minbase from the declaration's
  # pinned snapshot.debian.org sources (layer/photo-wall-debian.yaml). The
  # built image keeps those sources: nothing on the device resolves packages,
  # and the image's sources then name the pin it was built from (base-image.yml
  # checks it). rpi-image-gen's debian-trixie-arm64-minbase-snapshot layer is
  # not used: its snapshot follows the build's clock, not the pin.
  base: photo-wall-debian
  # systemd + systemd-sysv as PID 1 and `systemctl` -- required both to boot
  # this rootfs at all and to run photo-wall-provision.service
  # (Type=oneshot, WantedBy=multi-user.target, already enabled by a symlink
  # the bootstrapper `.deb` bakes as data -- no enable-units hook needed).
  init: systemd-min
  # Our own layer: apt-get installs the rendered device set and the prebuilt
  # photo-wall-bootstrapper `.deb`, after the declaration's "bootstrap" stage
  # (the CA bundle) is in place. See layer/photo-wall-device.yaml.
  app: photo-wall-device

image:
  # Custom image layer (image/photo-wall-squashfs.yaml): emits ONE
  # unpartitioned squashfs of the whole built rootfs via genimage -- no
  # vfat/ext4 partitions, no bootloader. See image/rootfs.cfg.in.
  layer: photo-wall-squashfs
  suffix: squashfs
  name: photo-wall-base
