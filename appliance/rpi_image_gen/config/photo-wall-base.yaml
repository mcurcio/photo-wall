# 0009 Phase 4: minimal netboot base OS via rpi-image-gen.
#
# Pinned tool version: raspberrypi/rpi-image-gen v2.8.0
# (commit 262d4df5a9f9d4133370465399a7958a7c22cdc7). See
# .github/workflows/base-image.yml for the exact clone/checkout.
#
# Produces ONLY the "Base OS bundle" rootfs described in
# docs/decisions/0009-minimal-base-and-app-package.md: a Debian trixie arm64
# minbase, systemd, the Node's software (photo-wall-node and the contexts it
# pins, from the local repo, layer/photo-wall-device.yaml) and the OS packages and
# settings its layers name. No application code and no origin: 0009 rule #1 is
# "the base OS carries no application and no origin." Kernel/initramfs/PXE-TFTP staging are
# the separate appliance/initramfs + appliance/provisioning concern and are
# out of scope for this config -- this emits the rootfs squashfs artifact only
# (see image/photo-wall-squashfs.yaml).
#
# Every bit of Photo Wall's own code ships to this build as a `.deb` -- this
# rpi-image-gen tree owns none of it, only the install step (the owner
# directive behind this rework: portable code must migrate cleanly across
# build tool chains, never be baked in as a tool-coupled raw-file overlay).
# The OS packages the base needs beyond those `.deb`s' Depends are named in
# its layers (decision 0019, R4).
#
# Build (see .github/workflows/base-image.yml for the full recipe, including
# rendering the apt sources before invoking this):
#   rpi-image-gen build -S appliance/rpi_image_gen -c photo-wall-base.yaml \
#     -- IGconf_app_local_repo=/path/to/local-repo \
#        IGconf_app_debian_sources=/path/to/photo-wall-debian.list
#
# Reproducibility: the Debian arm64 base is pulled from the pinned
# snapshot.debian.org sources (debian-packaging/snapshot.list, copied to a
# file without its comments by the CI job), never a rolling mirror and
# never a timestamp taken from the environment: rpi-image-gen's own snapshot
# layer reads SOURCE_DATE_EPOCH, which its `env -i` layer pipeline clears.

device:
  # Satisfies image-base's X-Env-Layer-RequiresProvider: device (see
  # device/photo-wall-device-none.yaml for the full rationale) without
  # pulling in a real Pi board layer's kernel/boot-firmware/wifi-firmware --
  # this build emits a bare rootfs squashfs, not a bootable Pi disk image.
  layer: photo-wall-device-none
  # The agent's login (docs/runbook.md, "Reaching a Node over SSH"), made by
  # rpi-image-gen's device-user-admin layer, which the openssh-server layer
  # below requires. No password: the account logs in by SSH key only, and
  # passwordless sudo lets it read every unit's journal and run systemctl.
  user1: photowall
  user1sudo: nopasswd
  user1groups: adm,systemd-journal

layer:
  # Debian (not Raspberry Pi OS) trixie arm64 minbase from the declaration's
  # pinned snapshot.debian.org sources (layer/photo-wall-debian.yaml). The
  # built image keeps those sources: nothing on the device resolves packages,
  # and the image's sources then name the pin it was built from (base-image.yml
  # checks it). rpi-image-gen's debian-trixie-arm64-minbase-snapshot layer is
  # not used: its snapshot follows the build's clock, not the pin.
  base: photo-wall-debian
  # systemd + systemd-sysv as PID 1 and `systemctl` -- required both to boot
  # this rootfs at all and to run the node's units (photo-wall-node.target,
  # enabled by a symlink photo-wall-node ships as data).
  init: systemd-min
  # Our own layer: apt-get installs photo-wall-node by name from
  # the local repo, after the CA bundle is in place. See
  # layer/photo-wall-device.yaml.
  app: photo-wall-device
  # Our own OS configuration, set in the OS itself (layer/photo-wall-os.yaml):
  # the binfmt units masked (the Pi kernel has no binfmt_misc), a C.UTF-8
  # default locale and libnss-myhostname. The Node's name is stage 1's
  # (photo-wall-<serial> at boot); the image bakes only a neutral one
  # (device/photo-wall-device-none.yaml).
  os: photo-wall-os
  # rpi-image-gen's own SSH server layer (layer/net-misc/openssh-server.yaml at
  # the pinned commit): Debian's openssh-server, enabled for boot, with the
  # host keys Debian's postinst made at build time removed and a fresh set made
  # at every boot (ssh-hostkeys-generate.service; the base's root is a RAM
  # overlay, so /etc/ssh is writable and nothing persists across boots).
  ssh: openssh-server

ssh:
  # The one authorized key, from this source tree; its private half never is.
  pubkey_user1: ${@SRCROOT}/photo_wall_agent.pub
  # Public-key authentication only: no password, no keyboard-interactive, no
  # root login (the layer's sshd_config.d/01pubkey-only.conf).
  pubkey_only: y

image:
  # Custom image layer (image/photo-wall-squashfs.yaml): emits ONE
  # unpartitioned squashfs of the whole built rootfs via genimage -- no
  # vfat/ext4 partitions, no bootloader. See image/rootfs.cfg.in.
  layer: photo-wall-squashfs
  suffix: squashfs
  name: photo-wall-base
