# 0009 Phase 4 SPIKE: minimal netboot base OS via rpi-image-gen.
#
# Pinned tool version: raspberrypi/rpi-image-gen v2.8.0
# (commit 262d4df5a9f9d4133370465399a7958a7c22cdc7). See
# .github/workflows/base-image.yml for the exact clone/checkout.
#
# Produces ONLY the "Base OS bundle" rootfs described in
# docs/decisions/0009-minimal-base-and-app-package.md: a Debian trixie arm64
# minbase, systemd, the bootstrapper's one third-party runtime dependency
# (python3-zeroconf / python3-ifaddr), ca-certificates, the bootstrapper's
# own minimal Python module closure, and its systemd unit -- nothing else.
# No Player app, no GTK/GStreamer/weston/Mesa: 0009 rule #1 is "the base OS
# carries no application and no origin." Kernel/initramfs/PXE-TFTP staging
# are the existing, separate appliance/initramfs + appliance/provisioning
# concern and are out of scope for this config -- this emits the rootfs
# squashfs artifact only (see image/photo-wall-squashfs.yaml).
#
# Build (see .github/workflows/base-image.yml for the full recipe, including
# staging the bootstrapper module closure into layer/photo-wall-bootstrapper
# .rootfs-overlay/ before invoking this):
#   rpi-image-gen build -S appliance/rpi_image_gen -c photo-wall-base.yaml
#
# Reproducibility: the Debian arm64 base is pulled from a pinned
# snapshot.debian.org mirror keyed off SOURCE_DATE_EPOCH (set by the CI job),
# not a rolling mirror -- see debian-trixie-arm64-minbase-snapshot,
# pulled in transitively by debian-trixie-arm64-minbase-rolling below.

layer:
  # Debian (not Raspberry Pi OS) trixie arm64 minbase, built from a pinned
  # snapshot.debian.org mirror (debian-trixie-arm64-minbase-snapshot, pulled
  # in as this layer's own X-Env-Layer-Requires) and then -- ONLY in the
  # built image's /etc/apt/sources.list.d/, never at build time -- switched
  # to the live deb.debian.org repo. This is the "apt sources configured to
  # the Debian distro repo" requirement: at boot, `apt-get install
  # ./photo-wall-player.deb` resolves the .deb's declared Depends (GTK/
  # GStreamer/weston/Mesa) against a real, reachable mirror. The base itself
  # installs none of those packages -- it only enables apt to pull them later.
  base: debian-trixie-arm64-minbase-rolling
  # systemd + systemd-sysv as PID 1 and `systemctl` -- required both to boot
  # this rootfs at all and for photo-wall-bootstrapper's enable-units hook
  # and photo-wall-provision.service (Type=oneshot, WantedBy=multi-user.target).
  init: systemd-min
  # Our own layer: appliance.provision + its one runtime dependency
  # (python3-zeroconf/-ifaddr) + ca-certificates (via this layer's own
  # X-Env-Layer-Requires) + the bootstrapper's module-closure rootfs overlay
  # + enabling photo-wall-provision.service. See layer/photo-wall-bootstrapper.yaml.
  app: photo-wall-bootstrapper

image:
  # Custom image layer (image/photo-wall-squashfs.yaml): emits ONE
  # unpartitioned squashfs of the whole built rootfs via genimage -- no
  # vfat/ext4 partitions, no bootloader. See image/rootfs.cfg.in.
  layer: photo-wall-squashfs
  suffix: squashfs
  name: photo-wall-base
