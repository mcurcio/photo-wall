# METABEGIN
# X-Env-Layer-Name: photo-wall-device-none
# X-Env-Layer-Category: device
# X-Env-Layer-Desc: Metadata-only "device" provider satisfying image-base's
#  hard requirement (layer/base/image-base.yaml:
#  X-Env-Layer-RequiresProvider: device -- pinned raspberrypi/rpi-image-gen
#  commit 262d4df5a9f9d4133370465399a7958a7c22cdc7, see
#  ../config/photo-wall-base.yaml's header for the pin) WITHOUT pulling in a
#  real Raspberry Pi board layer. Every board layer rpi-image-gen ships
#  (device/pi5, device/pi4, device/cm4, device/cm5, device/pi3,
#  device/zero2w) requires rpi-device-base
#  (layer/rpi/device/family-base.yaml), which installs udev,
#  firmware-brcm80211, bluez-firmware and generates network units for real
#  Pi hardware, and in turn requires rpi-boot-firmware/rpi-idp (boot
#  partition firmware, kernel provisioning) -- exactly the "kernel/
#  initramfs/PXE-TFTP staging" this spike's own header (../config/
#  photo-wall-base.yaml) says is out of scope: that stays the separate
#  appliance/initramfs + appliance/provisioning concern, and this build
#  emits a bare rootfs squashfs, not a bootable Pi image.
#
#  rpi-image-gen ships no hardware-agnostic/"none" device layer of its own.
#  Its own documented pattern for this exact situation is a small custom
#  device layer that declares only X-Env-Layer-Provides -- see
#  examples/custom_kernel/device/device.yaml ("custom-rpi5", Category:
#  example, Provides: device,rpi-device) and examples/slim/device/mypi5/
#  myboard.yaml ("example-mydevice", same Provides) in the pinned
#  rpi-image-gen tree: both stand in for a real device layer purely to
#  satisfy this same provider gate, then add whatever packages/hooks their
#  example actually needs. This layer follows that pattern but adds nothing:
#  it Provides only the bare `device` token (not `rpi-device`, which a
#  repo-wide grep for X-Env-Layer-RequiresProvider confirms nothing in this
#  build's dependency chain ever requires) and skips `X-Env-Layer-Requires:
#  device-base` entirely. device-base
#  (layer/base/device-base.yaml) only seeds IGconf_device_{vendor,class,
#  variant,storage_type,hostname,assetdir} defaults and additionally
#  requires device-user-admin (creates a login user, SSH keys/password
#  handling) -- confirmed by grepping the whole pinned rpi-image-gen tree
#  that no IGconf_device_* variable is read anywhere in image-base.yaml, our
#  own ../image/photo-wall-squashfs.yaml, ../image/rootfs.cfg.in, or
#  ../image/pre-image.sh, so device-base's vars and device-user-admin's
#  login-user machinery would be pure, unwanted weight on this headless
#  rootfs. No packages, no hooks: metadata-only, same pattern as this repo's
#  own ../image/photo-wall-squashfs.yaml.
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Provides: device
# METAEND
