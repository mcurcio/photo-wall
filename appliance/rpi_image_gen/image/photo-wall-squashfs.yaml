# METABEGIN
# X-Env-Layer-Name: photo-wall-squashfs
# X-Env-Layer-Category: image
# X-Env-Layer-Desc: Emits the built rootfs as ONE unpartitioned squashfs
#  image (genimage) -- the 0009 "Base OS bundle" rootfs artifact this spike
#  proves out. No partition table, no bootloader, no vfat/ext4 partitions --
#  contrast rpi-image-gen's own examples/nested_image/image/embedded_squashfs,
#  which embeds a squashfs INSIDE an ext4/vfat partitioned disk; that is not
#  what we want here. Kernel + initramfs + PXE/TFTP staging are the existing,
#  separate appliance/initramfs + appliance/provisioning concern and are out
#  of scope for this image layer. Declares assetdir so rootfs.cfg.in /
#  pre-image.sh here are picked up by the build (mirrors
#  examples/nested_image/image/embedded_squashfs/myimage.yaml).
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Requires: image-base
# X-Env-Layer-Provides: image
#
# X-Env-VarPrefix: image
#
# X-Env-Var-assetdir: ${DIRECTORY}
# X-Env-Var-assetdir-Desc: Image asset directory
# X-Env-Var-assetdir-Required: n
# X-Env-Var-assetdir-Valid: dir
# X-Env-Var-assetdir-Set: y
#
# METAEND
