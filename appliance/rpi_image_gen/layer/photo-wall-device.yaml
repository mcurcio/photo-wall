# METABEGIN
# X-Env-Layer-Name: photo-wall-device
# X-Env-Layer-Category: app
# X-Env-Layer-Desc: Installs the Node's software into the base: the node base
#  `.deb` (`IGconf_app_node_base_deb`) and the display, by name, from the
#  local repo (`IGconf_app_node_debs`, debian-packaging/build-repo.sh's
#  output) with the photo-wall packages it pins at their exact versions. Both
#  are built before rpi-image-gen runs (.github/workflows/node-components.yml);
#  this tree owns none of their code, only the install step. apt runs INSIDE
#  the chroot against this build's snapshot sources (the pin the base itself
#  is built from, layer/photo-wall-debian.yaml) and fetches over https, so
#  the CA bundle must already be there: the required ca-certificates layer
#  brings it with mmdebstrap's own package list (tests/test_debian_packages.py
#  binds this Requires list). Two OS dependencies of Debian packages the
#  display runs on are installed here, beside it, because no Photo Wall
#  package may name them (decision 0019, R4): python3-cffi-backend, which
#  trixie's python3-pywayland imports without declaring it, and
#  libgl1-mesa-dri, the GPU drivers Weston's GL renderer loads, which weston
#  only Recommends. No application code and no origin -- 0009 rule #1.
# X-Env-Layer-Version: 4.0.0
# X-Env-Layer-Requires: systemd-min,ca-certificates
#
# X-Env-VarPrefix: app
#
# X-Env-Var-node_base_deb:
# X-Env-Var-node_base_deb-Desc: Absolute host path to the node component
#  set's node-base.deb (scripts/build_node_base_deb.py).
# X-Env-Var-node_base_deb-Required: y
# X-Env-Var-node_base_deb-Valid: file
# X-Env-Var-node_base_deb-Set: y
#
# X-Env-Var-node_debs:
# X-Env-Var-node_debs-Desc: Absolute host path to the local repo
#  (debian-packaging/build-repo.sh's output, a flat apt repository with its
#  Packages index) the display is installed from by name, with the
#  photo-wall packages it pins at their exact versions.
# X-Env-Var-node_debs-Required: y
# X-Env-Var-node_debs-Valid: dir
# X-Env-Var-node_debs-Set: y
# METAEND
---
mmdebstrap:
  customize-hooks:
    - |-
      set -eu
      install -m 0644 "$IGconf_app_node_base_deb" "$1/tmp/photo-wall-node-base.deb"
      chroot "$1" apt-get install -y --no-install-recommends /tmp/photo-wall-node-base.deb
      rm -f "$1/tmp/photo-wall-node-base.deb"
      # The local repo, read as the display harness reads it (scripts/run_display_harness.py):
      # a trusted file: source preferred at 1002. Only its own list is fetched, the pin's
      # lists are kept, and every trace is removed after, so the base's sources stay the pin.
      cp -R "$IGconf_app_node_debs" "$1/var/tmp/photo-wall-debs"
      echo 'deb [trusted=yes] file:/var/tmp/photo-wall-debs ./' \
        > "$1/etc/apt/sources.list.d/photo-wall-local.list"
      printf 'Package: *\nPin: origin ""\nPin-Priority: 1002\n' \
        > "$1/etc/apt/preferences.d/photo-wall-local"
      chroot "$1" apt-get update \
        -o Dir::Etc::SourceList=sources.list.d/photo-wall-local.list \
        -o Dir::Etc::SourceParts=- -o APT::Get::List-Cleanup=0
      # python3-cffi-backend: an OS dependency of Debian's python3-pywayland (trixie
      # 0.4.18-4), which imports it without declaring it; the display's overlay client runs
      # on pywayland (erratum E-0019-P2A-3). libgl1-mesa-dri: the Mesa DRI drivers (vc4, v3d)
      # Weston's GL renderer loads, which weston only Recommends. Both go into the OS here,
      # never into a Photo Wall package (decision 0019, R4).
      chroot "$1" apt-get install -y --no-install-recommends python3-cffi-backend \
        libgl1-mesa-dri photo-wall-node-display
      rm -f "$1/etc/apt/sources.list.d/photo-wall-local.list" \
        "$1/etc/apt/preferences.d/photo-wall-local" \
        "$1"/var/lib/apt/lists/_var_tmp_photo-wall-debs_*
      rm -rf "$1/var/tmp/photo-wall-debs"
