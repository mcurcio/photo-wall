# Debian's ssh.service, adjusted for a V2 Node (docs/runbook.md, "Reaching a Node over SSH"); the
# base installs this as /lib/systemd/system/ssh.service.d/photo-wall.conf. Debian's package
# enables the unit for multi-user.target, so it starts with the base and needs no Photo Wall unit:
# it runs when the app, the display and Central are all down.
[Unit]
ConditionKernelCommandLine=photowall.node=v2
StartLimitIntervalSec=0

[Service]
# The Node is diskless (its root is a RAM overlay), so the host key is made once per boot under
# /run, kept across restarts, and replaced at the next boot. A half-written pair is remade.
RuntimeDirectory=photo-wall-ssh
RuntimeDirectoryPreserve=yes
ExecStartPre=
ExecStartPre=/bin/sh -c 'test -s /run/photo-wall-ssh/ssh_host_ed25519_key.pub || { rm -f /run/photo-wall-ssh/ssh_host_ed25519_key /run/photo-wall-ssh/ssh_host_ed25519_key.pub && exec /usr/bin/ssh-keygen -q -t ed25519 -N "" -C "" -f /run/photo-wall-ssh/ssh_host_ed25519_key; }'
ExecStartPre=/usr/sbin/sshd -t
Restart=always
RestartPreventExitStatus=
RestartSec=2
