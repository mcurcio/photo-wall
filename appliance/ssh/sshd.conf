# The agent's SSH access to a V2 Node (docs/runbook.md, "Reaching a Node over SSH"). The base
# installs this file as /etc/ssh/sshd_config.d/photo-wall.conf; Debian's sshd_config includes it
# before its own lines, and sshd keeps the first value it reads for a keyword, so these win.
# Root logs in with the one public key the release bakes in (appliance/ssh/photo_wall_agent.pub);
# no password and no keyboard-interactive login.
AllowUsers root
PermitRootLogin prohibit-password
AuthenticationMethods publickey
PubkeyAuthentication yes
AuthorizedKeysFile /usr/lib/photo-wall-ssh/authorized_keys
PasswordAuthentication no
KbdInteractiveAuthentication no
# The Node has no persistent store: ssh.service's drop-in makes this boot's host key here.
HostKey /run/photo-wall-ssh/ssh_host_ed25519_key
