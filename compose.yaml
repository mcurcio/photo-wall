services:
  database:
    image: postgres:16.9-bookworm@sha256:253815cf7579ffa05e1673d92e78d37273e61be0e4414e9a1449337d7925be94
    environment:
      POSTGRES_DB: photo_wall
      POSTGRES_USER: photo_wall
      POSTGRES_PASSWORD: ${PHOTO_WALL_DB_PASSWORD:?Run python3 scripts/configure.py first}
    ports:
      - "127.0.0.1:${PHOTO_WALL_DB_PORT:-54329}:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photo_wall -d photo_wall"]
      interval: 2s
      timeout: 3s
      retries: 30
  central:
    build: .
    environment:
      PHOTO_WALL_DATABASE_URL: postgresql://photo_wall:${PHOTO_WALL_DB_PASSWORD}@database:5432/photo_wall
      PHOTO_WALL_ADMIN_TOKEN: ${PHOTO_WALL_ADMIN_TOKEN:?Run python3 scripts/configure.py first}
    ports:
      - "127.0.0.1:${PHOTO_WALL_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  database:
