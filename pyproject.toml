[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "photo-wall"
version = "0.1.0"
description = "Self-hosted Photo Wall control plane and appliance player"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "pydantic==2.11.4",
  "psycopg[binary]==3.2.9", "httpx==0.28.1", "websockets==15.0.1",
  "cryptography==44.0.3",
]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.9"]

[tool.hatch.build.targets.wheel]
packages = ["central", "contracts", "media", "player"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
