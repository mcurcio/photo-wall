[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "photo-wall"
# DECORATIVE, not the release version. Commitizen uses `version_provider = "scm"`
# (see [tool.commitizen]), so releases are numbered from the latest git tag, not
# from this field -- bumping it here changes NOTHING about what gets released,
# and we intentionally never auto-bump/commit it (that would loop `push: main`).
version = "0.1.0"
description = "Self-hosted Photo Wall control plane and appliance player"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "pydantic==2.11.4",
  "psycopg[binary]==3.2.9", "psycopg-pool==3.3.1", "httpx==0.28.1", "websockets==15.0.1",
  "cryptography==44.0.3", "Pillow==12.3.0",
  "procrastinate==3.9.0", "zeroconf==0.151.3",
  "semver>=3,<4",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-xdist==3.8.0",
    "ruff==0.11.9",
    "hypothesis==6.167.1",
    "import-linter==2.15",
    "pytest-playwright==0.9.0",
    "playwright==1.62.0",
    "fonttools==4.66.0",
    "brotli==1.2.0",
    "nats-py==2.16.0",  # the E3a bus seam probes; E3b moves it to runtime
]

[tool.hatch.build.targets.wheel]
packages = ["central", "contracts", "media", "player", "uplink"]

[tool.commitizen]
# Conventional-Commits ruleset: classify feat/fix/perf/BREAKING to pick the bump.
name = "cz_conventional_commits"
# Release identity is the git tag, strict v-prefixed X.Y.Z[-pre] -- the central
# watcher's parse_semver accepts and orders exactly this shape.
tag_format = "v$version"
# The latest `v*` tag IS the current version; the next version is bumped from it
# by the commits since that tag. This matches pipeline.yml's model -- the tag is
# the sole source of truth and we never write a bumped number back to pyproject
# (a version-bump commit would re-trigger `push: main` and loop). With no tags
# (first release ever) the base is 0.0.0, so a `feat` bootstraps to v0.1.0 and a
# `fix` to v0.0.1 -- deterministic without seeding a tag. `pep621` is deliberately
# NOT used: it would peg the base to the frozen [project] version = 0.1.0 and,
# finding no matching v0.1.0 tag, recompute from the whole history every push --
# never signalling "no release" and never advancing past 0.2.0.
version_provider = "scm"
# Pre-1.0 home-LAN appliance with no external API-stability contract: a breaking
# change bumps the MINOR within 0.x (0.2.0 -> 0.3.0) rather than jumping to 1.0.0,
# until we deliberately cut 1.0.
major_version_zero = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib + namespace packages name each test module by its path under tests/ (tests/node/apps/
# test_x.py is `node.apps.test_x`), so equal basenames in two directories never collide and a new
# test directory needs no entry here. Import a helper by that name; browser/ keeps bare imports.
pythonpath = ["tests", "tests/browser"]
consider_namespace_packages = true
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Under importlib mode a test module is named by its path under tests/, so `tests.x` loads a
# second copy of a collected module. Scripts outside tests/ may still import the package.
"tests".msg = "import a test helper by its name under tests/ (`uplink_fakes`, `node.x`), not via `tests`"

[tool.ruff.lint.per-file-ignores]
"!tests/**" = ["TID251"]

[tool.importlinter]
root_packages = ["central", "contracts", "media", "player", "appliance", "uplink"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Transport contracts remain domain neutral"
type = "forbidden"
source_modules = ["contracts"]
forbidden_modules = ["central", "media", "player", "appliance", "psycopg", "procrastinate"]

[[tool.importlinter.contracts]]
# An early warning only: a denylist cannot catch an unlisted package. The guarantee that uplink
# runs on the stdlib alone (it ships in the initramfs) is the computed-closure test.
name = "Uplink reaches Central with the stdlib and stdlib-only contracts"
type = "forbidden"
source_modules = ["uplink"]
forbidden_modules = ["pydantic", "httpx", "central", "media", "player", "appliance"]

[[tool.importlinter.contracts]]
name = "Players have no central or persistence dependency"
type = "forbidden"
source_modules = ["player"]
forbidden_modules = [
  "central", "media", "appliance", "psycopg", "psycopg_pool", "procrastinate", "sqlite3",
]

[[tool.importlinter.contracts]]
name = "Central content-serving layers"
type = "layers"
layers = ["central.app : central.content_wiring : central.content_routes : central.library_routes",
          "central.infra",
          "central.content_catalog | central.assets | central.health",
          "central.origins", "central.kernel"]

[[tool.importlinter.contracts]]
name = "Kernel, origins and domains have no persistence, queue or HTTP-framework dependency"
type = "forbidden"
source_modules = ["central.kernel", "central.origins", "central.content_catalog",
                  "central.assets", "central.health"]
forbidden_modules = ["procrastinate", "psycopg", "psycopg_pool", "fastapi", "starlette"]

[[tool.importlinter.contracts]]
# R22: only the media worker holds a library's address and key. Central's thumbnail handler gets
# its library half injected (`build_job_runtime(thumbnails=...)`), never by import.
name = "Central imports no library client"
type = "forbidden"
source_modules = ["central"]
forbidden_modules = ["media.immich", "media.library_thumbnails", "media.worker"]

[[tool.importlinter.contracts]]
name = "Kernel is vocabulary only"
type = "forbidden"
source_modules = ["central.kernel"]
forbidden_modules = ["httpx", "media", "central.db", "central.cache_layout", "central.artifact_io"]

[[tool.importlinter.contracts]]
# One directory per Node context (node redesign r3 §3.4). A layer imports only the layers below.
# `exhaustive`: a new appliance module that names no layer fails.
name = "Node contexts point down"
type = "layers"
containers = ["appliance"]
# Siblings are `|` (independent), never `:`: a real dependency is its own layer.
layers = ["node", "boot | netboot_init", "bootstrap | boot_offer | central_post | node_boot_handoff",
          "apps", "health", "display_host | host", "central_session", "kernel | feed | feed_socket"]
exhaustive = true
ignore_imports = [
  # Retiring (r3 §10): each line leaves with the module it names.
  "appliance.apps.broker_runner -> appliance.node.app_link",
  "appliance.apps.broker_runner -> appliance.node.recovery_linux",
  "appliance.apps.online_broker -> appliance.node.recovery",
  "appliance.apps.stop_linux -> appliance.node.recovery",
  "appliance.apps.lifecycle_storage -> appliance.node.manager",
  "appliance.host.host_runner -> appliance.node.recovery",
  "appliance.host.host_runner -> appliance.node.recovery_linux",
  "appliance.boot.node_bootstrap -> appliance.node.preparer",
]
exhaustive_ignores = ["app_evidence", "app_executor", "app_launcher", "app_payload",
                      "app_process_proof", "app_proof_service", "linux_app_proof",
                      "online_activation", "os_agent", "provision", "process_identity"]

[[tool.importlinter.contracts]]
name = "Boot is an island"
type = "forbidden"
source_modules = ["appliance.boot", "appliance.netboot_init", "appliance.bootstrap",
                  "appliance.boot_offer", "appliance.central_post", "appliance.node_boot_handoff"]
forbidden_modules = ["appliance.apps", "appliance.health", "appliance.display_host",
                     "appliance.host", "appliance.central_session"]
ignore_imports = [
  # Boot's only edges out: the retiring prepare verb's apps.environment (r3 §10); E6 removes them.
  "appliance.boot.node_bootstrap -> appliance.apps.environment",
  "appliance.node.preparer -> appliance.apps.environment",
]

[[tool.importlinter.contracts]]
name = "App lifecycle reaches no sibling context"
type = "forbidden"
source_modules = ["appliance.apps"]
forbidden_modules = ["appliance.health", "appliance.display_host", "appliance.host"]

[[tool.importlinter.contracts]]
name = "Health reaches only Display among contexts"
type = "forbidden"
source_modules = ["appliance.health"]
forbidden_modules = ["appliance.host"]

[[tool.importlinter.contracts]]
# The host-core launcher ships alone. Like the apps fence, this has no ignore lines, so a path
# through a retiring module the layers contract exempts (host_runner -> node.recovery) still fails.
name = "Host core reaches no sibling context"
type = "forbidden"
source_modules = ["appliance.host"]
forbidden_modules = ["appliance.display_host", "appliance.health", "appliance.apps", "appliance.boot",
                     "appliance.netboot_init", "appliance.bootstrap", "appliance.boot_offer",
                     "appliance.central_post", "appliance.node_boot_handoff"]

[[tool.importlinter.contracts]]
# The judge alone maps faults to household lines; Display draws the instruction it is given.
name = "Display never reads the fault catalogue"
type = "forbidden"
source_modules = ["appliance.display_host"]
forbidden_modules = ["contracts.node_faults"]

[[tool.importlinter.contracts]]
# Retiring (r3 §10): the programme deletes each worker and its line with it.
name = "The Central session is retiring: only the listed workers import it"
type = "protected"
protected_modules = ["appliance.central_session"]
allowed_importers = ["appliance.central_session"]
ignore_imports = [
  "appliance.host.host_runner -> appliance.central_session.*",
  "appliance.node.manager_desired -> appliance.central_session.*",
  "appliance.display_host.service -> appliance.central_session.*",
  "appliance.apps.broker_runner -> appliance.central_session.*",
  "appliance.node.app_link -> appliance.central_session.*",
  "appliance.apps.online_broker -> appliance.central_session.*",
]

[[tool.importlinter.contracts]]
name = "The base never imports the guest"
type = "forbidden"
source_modules = ["appliance"]
forbidden_modules = ["player"]
ignore_imports = ["appliance.os_agent -> player.mdns_discovery",
                  "appliance.provision -> player.mdns_discovery"]

[[tool.importlinter.contracts]]
name = "Node contexts never reach V1"
type = "forbidden"
source_modules = ["appliance.kernel", "appliance.feed", "appliance.feed_socket",
                  "appliance.central_session", "appliance.host", "appliance.display_host",
                  "appliance.health", "appliance.apps", "appliance.boot", "appliance.process_identity",
                  "appliance.netboot_init", "appliance.bootstrap", "appliance.boot_offer",
                  "appliance.central_post", "appliance.node_boot_handoff"]
forbidden_modules = ["appliance.app_evidence", "appliance.app_executor", "appliance.app_launcher",
                     "appliance.app_payload", "appliance.app_process_proof",
                     "appliance.app_proof_service", "appliance.linux_app_proof",
                     "appliance.online_activation", "appliance.os_agent", "appliance.provision"]
ignore_imports = ["appliance.process_identity -> appliance.app_launcher"]

[[tool.importlinter.contracts]]
# The Node API library (nodeapi, created by E3) is the one NATS client (node redesign r3 §3.3.4).
name = "Only the Node API library talks to NATS"
type = "forbidden"
source_modules = ["central", "contracts", "media", "player", "appliance", "uplink"]
forbidden_modules = ["nats"]

[[tool.importlinter.contracts]]
# Retiring (r3 §16.1 B2b/B10a): the feed gains no importer; each line leaves with its importer.
name = "The feed is retiring: it gains no importer"
type = "protected"
protected_modules = ["appliance.feed", "appliance.feed_socket"]
allowed_importers = ["appliance.feed", "appliance.feed_socket"]
ignore_imports = [
  "appliance.display_host.runner -> appliance.feed",
  "appliance.display_host.runner -> appliance.feed_socket",
  "appliance.health.judge -> appliance.feed",
  "appliance.health.runner -> appliance.feed",
  "appliance.health.runner -> appliance.feed_socket",
  "appliance.node.app_link -> appliance.feed",
  "appliance.apps.broker_runner -> appliance.feed",
  "appliance.apps.broker_runner -> appliance.feed_socket",
  "appliance.apps.probe_channel -> appliance.feed",
]
