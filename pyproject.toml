[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "photo-wall"
# DECORATIVE, not the release version. Commitizen uses `version_provider = "scm"`
# (see [tool.commitizen]), so releases are numbered from the latest git tag, not
# from this field -- bumping it here changes NOTHING about what gets released,
# and we intentionally never auto-bump/commit it (that would loop `push: main`).
version = "0.1.0"
description = "Self-hosted Photo Wall control plane and appliance player"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "pydantic==2.11.4",
  "psycopg[binary]==3.2.9", "psycopg-pool==3.3.1", "httpx==0.28.1", "websockets==15.0.1",
  "cryptography==44.0.3", "Pillow==12.3.0",
  "pillow-heif==1.8.0",  # HEIC and HEIF originals (libheif), follow-ups A5
  "procrastinate==3.9.0",
  "semver>=3,<4",
  "nats-py==2.16.0",  # the Node API library's client: the worker's hub side (E3d S5)
  # Roadmap 5a: the key content analyser's interest grid (OpenCV static saliency, spectral
  # residual; the saliency module ships only in the contrib build). Media worker only.
  "opencv-contrib-python-headless==5.0.0.93",
  # Power and the week (roadmap 2a + 2b): house time's sun times and the zone database zoneinfo
  # reads (the slim image has none). Central only; the Pi never imports them.
  "astral==3.2",
  "tzdata==2026.3",
  # Room light (decision 0028): the media worker's Home Assistant link, an MQTT client of the
  # house's broker (retained light and illuminance messages). Central's worker only; the Pi never
  # imports it.
  "aiomqtt==2.5.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-xdist==3.8.0",
    "ruff==0.11.9",
    "hypothesis==6.167.1",
    "import-linter==2.15",
    "pytest-playwright==0.9.0",
    "playwright==1.62.0",
    "fonttools==4.66.0",
    "brotli==1.2.0",
    # Calibration targets (decision 0026): the Player's QR encoder, as the Pi has it (Debian trixie's
    # python3-segno 1.6.6, photo-wall-player's Depends), for the Player's tests; and the agent's
    # reader's ProRAW decoder (scripts/calibration_target/, an agent tool, never shipped).
    "segno==1.6.6",
    "rawpy==0.27.1",
    # Calibration targets v2 (decision 0027; owner, 2026-10-14: "Make sure that you are using
    # standard libraries and not building the algorithm"): the reader's statistics and fits, and
    # the sRGB transfer function and colour profiles' maths (the reader and its tests only).
    "scipy==1.18.1",
    "colour-science==0.4.7",
]

[tool.hatch.build.targets.wheel]
packages = ["central", "contracts", "media", "player", "uplink"]

[tool.commitizen]
# Conventional-Commits ruleset: classify feat/fix/perf/BREAKING to pick the bump.
name = "cz_conventional_commits"
# Release identity is the git tag, strict v-prefixed X.Y.Z[-pre] -- the central
# watcher's parse_semver accepts and orders exactly this shape.
tag_format = "v$version"
# The latest `v*` tag IS the current version; the next version is bumped from it
# by the commits since that tag. This matches pipeline.yml's model -- the tag is
# the sole source of truth and we never write a bumped number back to pyproject
# (a version-bump commit would re-trigger `push: main` and loop). With no tags
# (first release ever) the base is 0.0.0, so a `feat` bootstraps to v0.1.0 and a
# `fix` to v0.0.1 -- deterministic without seeding a tag. `pep621` is deliberately
# NOT used: it would peg the base to the frozen [project] version = 0.1.0 and,
# finding no matching v0.1.0 tag, recompute from the whole history every push --
# never signalling "no release" and never advancing past 0.2.0.
version_provider = "scm"
# Pre-1.0 home-LAN appliance with no external API-stability contract: a breaking
# change bumps the MINOR within 0.x (0.2.0 -> 0.3.0) rather than jumping to 1.0.0,
# until we deliberately cut 1.0.
major_version_zero = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib + namespace packages name each test module by its path under tests/ (tests/node/apps/
# test_x.py is `node.apps.test_x`), so equal basenames in two directories never collide and a new
# test directory needs no entry here. Import a helper by that name; browser/ keeps bare imports.
pythonpath = ["tests", "tests/browser"]
consider_namespace_packages = true
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# psycopg_pool's getconn check swallows a cancel; procrastinate turns the check on for every async
# pool. `async_connector` builds the pool without it (see `central/infra/job_queue.py`).
"procrastinate.PsycopgConnector".msg = "use central.infra.job_queue.async_connector"
"procrastinate.psycopg_connector.PsycopgConnector".msg = "use central.infra.job_queue.async_connector"
# Under importlib mode a test module is named by its path under tests/, so `tests.x` loads a
# second copy of a collected module. Scripts outside tests/ may still import the package.
"tests".msg = "import a test helper by its name under tests/ (`uplink_fakes`, `node.x`), not via `tests`"

[tool.ruff.lint.per-file-ignores]
# Both bans apply everywhere; each exemption names the one file that owns the banned use.
"central/infra/job_queue.py" = ["TID251"]
"scripts/uplink_device_harness.py" = ["TID251"]

[tool.importlinter]
root_packages = ["central", "contracts", "media", "player", "appliance", "uplink", "nodeapi"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Transport contracts remain domain neutral"
type = "forbidden"
source_modules = ["contracts"]
forbidden_modules = ["central", "media", "player", "appliance", "psycopg", "procrastinate"]

[[tool.importlinter.contracts]]
# An early warning only: a denylist cannot catch an unlisted package. The guarantee that uplink
# runs on the stdlib alone (it ships in the initramfs) is the computed-closure test.
name = "Uplink reaches Central with the stdlib and stdlib-only contracts"
type = "forbidden"
source_modules = ["uplink"]
forbidden_modules = ["pydantic", "httpx", "central", "media", "player", "appliance"]

[[tool.importlinter.contracts]]
name = "Players have no central or persistence dependency"
type = "forbidden"
source_modules = ["player"]
forbidden_modules = [
  "central", "media", "appliance", "psycopg", "psycopg_pool", "procrastinate", "sqlite3",
]

[[tool.importlinter.contracts]]
name = "Central content-serving layers"
type = "layers"
layers = ["central.app : central.content_wiring : central.content_routes : central.library_routes",
          "central.infra",
          "central.content_catalog | central.assets | central.health",
          "central.origins", "central.kernel"]

[[tool.importlinter.contracts]]
name = "Kernel, origins and domains have no persistence, queue or HTTP-framework dependency"
type = "forbidden"
source_modules = ["central.kernel", "central.origins", "central.content_catalog",
                  "central.assets", "central.health", "central.displays", "central.photo_library",
                  "central.wall_plan", "central.house_time", "central.power", "central.why",
                  "central.room_light", "central.frame_lighting"]
forbidden_modules = ["procrastinate", "psycopg", "psycopg_pool", "fastapi", "starlette"]

[[tool.importlinter.contracts]]
# Roadmap 1b: the Display rules are pure; the bus reaches them through Central's infra edge.
name = "Displays are pure domain"
type = "forbidden"
source_modules = ["central.displays"]
forbidden_modules = ["nodeapi", "central.infra", "central.db", "central.registry", "central.app"]

[[tool.importlinter.contracts]]
# Configuration snapshots (migration 096): a Frame's Position history, its views and the snapshot's
# read contract are pure; PostgreSQL is reached only through central/infra, HTTP only through the
# route modules.
name = "Position history and the configuration snapshot are pure"
type = "forbidden"
source_modules = ["central.fleet.position_history", "central.fleet.position_views", "central.tuning_history"]
forbidden_modules = ["psycopg", "psycopg_pool", "procrastinate", "fastapi", "starlette", "nodeapi",
                     "central.infra", "central.db", "central.registry", "central.app"]

[[tool.importlinter.contracts]]
# Roadmap 4 (run ledger .claude/runs/photo-4.md): the photo library's vocabulary and rules are pure;
# the media worker imports them, never the other way, and Central reaches the store through infra.
name = "The photo library domain is pure"
type = "forbidden"
source_modules = ["central.photo_library"]
forbidden_modules = ["media", "httpx", "nodeapi", "central.infra", "central.db", "central.registry",
                     "central.app", "central.media_repository"]

[[tool.importlinter.contracts]]
# Roadmap 5a (run ledger .claude/runs/photo-5a.md): the wall plan's rules are pure; the Planner and
# Runtime import them, never the other way, and the stores live in central.infra.
name = "The wall plan is pure"
type = "forbidden"
source_modules = ["central.wall_plan"]
forbidden_modules = ["media", "httpx", "nodeapi", "cv2", "numpy", "central.infra", "central.db",
                     "central.registry", "central.app", "central.planner", "central.runtime",
                     "central.coordination", "central.media_repository"]

[[tool.importlinter.contracts]]
# Power and the week (roadmap 2a + 2b): house time is the bottom of the three pure contexts; the
# calculator is the one home of every time of day, imported by power, Runtime, displays and Why.
name = "House time is pure and imports no other context"
type = "forbidden"
source_modules = ["central.house_time"]
forbidden_modules = ["media", "httpx", "nodeapi", "central.infra", "central.db", "central.registry",
                     "central.app", "central.power", "central.why", "central.runtime", "central.displays",
                     "central.coordination", "central.planner"]

[[tool.importlinter.contracts]]
# Display power policy decides; the Output document (central.displays) carries its timetable, and
# Why explains it: neither is imported here. Power never reads a Scene (R5).
name = "Display power policy is pure and points down"
type = "forbidden"
source_modules = ["central.power"]
forbidden_modules = ["media", "httpx", "nodeapi", "central.infra", "central.db", "central.registry",
                     "central.app", "central.why", "central.runtime", "central.displays",
                     "central.coordination", "central.planner"]

[[tool.importlinter.contracts]]
# Why explains and never decides: it reads Runtime's view, the timetable and the Pi's report.
name = "Why is pure"
type = "forbidden"
source_modules = ["central.why"]
forbidden_modules = ["media", "httpx", "nodeapi", "central.infra", "central.db", "central.registry",
                     "central.app", "central.coordination", "central.planner"]

[[tool.importlinter.contracts]]
# Which room lights and Sensors exist, who reports each and the room-lights document are pure, and
# know no reporting source: the broker, the bus and PostgreSQL are reached through central/infra.
name = "Room lights are pure"
type = "forbidden"
source_modules = ["central.room_light"]
forbidden_modules = ["media", "httpx", "nodeapi", "aiomqtt", "paho", "central.infra", "central.db",
                     "central.registry", "central.app", "central.coordination", "central.planner",
                     "central.displays", "central.fleet", "central.frame_lighting"]

[[tool.importlinter.contracts]]
# A Frame's lighting rules are pure; the house is read through its port, under the room-lights lock.
# They read room lights' vocabulary; room lights never import them ("Room lights are pure").
name = "Frame lighting is pure"
type = "forbidden"
source_modules = ["central.frame_lighting"]
forbidden_modules = ["media", "httpx", "nodeapi", "aiomqtt", "paho", "central.infra", "central.db",
                     "central.registry", "central.app", "central.coordination", "central.planner",
                     "central.displays", "central.fleet"]

[[tool.importlinter.contracts]]
# Everything Home Assistant and MQTT is one adapter package: only its link imports the MQTT client.
name = "Only the Home Assistant adapter talks MQTT"
type = "protected"
protected_modules = ["aiomqtt"]
allowed_importers = ["central.infra.home_assistant.link"]

[[tool.importlinter.contracts]]
name = "Nothing else imports an MQTT client"
type = "forbidden"
source_modules = ["central", "media", "contracts", "appliance", "player", "uplink", "nodeapi"]
forbidden_modules = ["paho"]

[[tool.importlinter.contracts]]
# The adapter is reached only from the worker's wiring, the API's composition root, the Home
# Assistant settings page's routes, and the console contract's export of its source name.
name = "Only the worker's wiring reaches the Home Assistant adapter"
type = "protected"
protected_modules = ["central.infra.home_assistant"]
allowed_importers = ["media.worker", "central.app", "central.home_assistant_routes", "central.console_contract"]

[[tool.importlinter.contracts]]
# Fleet and the registry write a Frame's lighting through central/frame_lighting's port, never the
# house's tables.
name = "Fleet and the registry reach the house's lighting only through its port"
type = "forbidden"
source_modules = ["central.fleet", "central.registry"]
forbidden_modules = ["central.infra.room_light_store", "central.infra.lut_rows", "central.infra.lut_store"]

[[tool.importlinter.contracts]]
# Power and the week: sun times and the IANA zone database are Central's house-time calculator's;
# the Pi and the wire never work out a time of day. The media worker is a Central process: it runs
# the Planner and Runtime, which read house time, so it is not listed.
name = "Sun times and the zone database are Central's"
type = "forbidden"
source_modules = ["contracts", "appliance", "player", "uplink", "nodeapi"]
forbidden_modules = ["astral"]

[[tool.importlinter.contracts]]
# R22: only the media worker holds a library's address and key. Central's thumbnail handler gets
# its library half injected (`build_job_runtime(thumbnails=...)`), never by import.
name = "Central imports no library client"
type = "forbidden"
source_modules = ["central"]
forbidden_modules = ["media.immich", "media.library_thumbnails", "media.worker"]

[[tool.importlinter.contracts]]
name = "Kernel is vocabulary only"
type = "forbidden"
source_modules = ["central.kernel"]
forbidden_modules = ["httpx", "media", "central.db", "central.cache_layout", "central.artifact_io"]

[[tool.importlinter.contracts]]
# One directory per Node context (node redesign r3 §3.4). A layer imports only the layers below.
# `exhaustive`: a new appliance module that names no layer fails.
name = "Node contexts point down"
type = "layers"
containers = ["appliance"]
# Siblings are `|` (independent), never `:`: a real dependency is its own layer.
layers = ["node", "boot | netboot_init", "bootstrap | central_post | node_boot_handoff",
          "apps", "health", "display_host | host", "central_session", "kernel | feed | feed_socket"]
exhaustive = true
ignore_imports = [
  # Retiring (r3 §10): each line leaves with the module it names.
  "appliance.apps.broker_runner -> appliance.node.app_link",
  "appliance.apps.broker_runner -> appliance.node.recovery_linux",
  "appliance.apps.online_broker -> appliance.node.recovery",
  "appliance.apps.stop_linux -> appliance.node.recovery",
  "appliance.apps.lifecycle_storage -> appliance.node.manager",
  "appliance.host.host_runner -> appliance.node.recovery",
  "appliance.host.host_runner -> appliance.node.recovery_linux",
  "appliance.boot.node_bootstrap -> appliance.node.preparer",
]
exhaustive_ignores = ["process_identity"]

[[tool.importlinter.contracts]]
# E3b design §7.1: siblings (`|`) never import each other; `epoch` is the bottom.
name = "The Node API library points down"
type = "layers"
containers = ["nodeapi"]
layers = ["node | hub", "documents", "buffers | pull | envelope", "epoch"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Boot is an island"
type = "forbidden"
source_modules = ["appliance.boot", "appliance.netboot_init", "appliance.bootstrap",
                  "appliance.central_post", "appliance.node_boot_handoff"]
forbidden_modules = ["appliance.apps", "appliance.health", "appliance.display_host",
                     "appliance.host", "appliance.central_session"]
ignore_imports = [
  # Boot's only edges out: the retiring prepare verb's apps.environment (r3 §10); E6 removes them.
  "appliance.boot.node_bootstrap -> appliance.apps.environment",
]

[[tool.importlinter.contracts]]
name = "App lifecycle reaches no sibling context"
type = "forbidden"
source_modules = ["appliance.apps"]
forbidden_modules = ["appliance.health", "appliance.display_host", "appliance.host"]

[[tool.importlinter.contracts]]
name = "Health reaches only Display among contexts"
type = "forbidden"
source_modules = ["appliance.health"]
forbidden_modules = ["appliance.host"]

[[tool.importlinter.contracts]]
# The host-core launcher ships alone. Like the apps fence, this has no ignore lines, so a path
# through a retiring module the layers contract exempts (host_runner -> node.recovery) still fails.
name = "Host core reaches no sibling context"
type = "forbidden"
source_modules = ["appliance.host"]
forbidden_modules = ["appliance.display_host", "appliance.health", "appliance.apps", "appliance.boot",
                     "appliance.netboot_init", "appliance.bootstrap", "appliance.central_post",
                     "appliance.node_boot_handoff"]

[[tool.importlinter.contracts]]
# Roadmap 1c (run ledger .claude/runs/display-1c.md): the Player is the only picture pipeline; the
# base never implements a second transform, so no base module reaches the Frame fit's geometry.
name = "Display Host never computes a Frame's geometry"
type = "forbidden"
source_modules = ["appliance"]
forbidden_modules = ["contracts.frame_fit"]

[[tool.importlinter.contracts]]
# The judge alone maps faults to household lines; Display draws the instruction it is given.
name = "Display never reads the fault catalogue"
type = "forbidden"
source_modules = ["appliance.display_host"]
forbidden_modules = ["contracts.node_faults"]

[[tool.importlinter.contracts]]
# Retiring (r3 §10): the programme deletes each worker and its line with it.
name = "The Central session is retiring: only the listed workers import it"
type = "protected"
protected_modules = ["appliance.central_session"]
allowed_importers = ["appliance.central_session"]
ignore_imports = [
  "appliance.host.host_runner -> appliance.central_session.*",
  "appliance.node.manager_desired -> appliance.central_session.*",
  "appliance.display_host.service -> appliance.central_session.*",
  "appliance.apps.broker_runner -> appliance.central_session.*",
  "appliance.node.app_link -> appliance.central_session.*",
  "appliance.apps.online_broker -> appliance.central_session.*",
]

[[tool.importlinter.contracts]]
name = "The base never imports the guest"
type = "forbidden"
source_modules = ["appliance"]
forbidden_modules = ["player"]

[[tool.importlinter.contracts]]
# The Node API library (nodeapi, created by E3) is the one NATS client (node redesign r3 §3.3.4).
# Indirect imports are allowed (errata E-E3C-S4-1, E-E3D-CUT-1): Central's and HostCore's programs reach
# NATS only through nodeapi, which is the point; a direct `import nats` outside nodeapi still fails.
name = "Only the Node API library talks to NATS"
type = "forbidden"
source_modules = ["central", "contracts", "media", "player", "appliance", "uplink"]
forbidden_modules = ["nats"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# Central is a client of each Node's bus through the hub (E3b design §7.2): it never runs a Node session.
name = "Central uses only the hub role of the Node API library"
type = "forbidden"
source_modules = ["central"]
forbidden_modules = ["nodeapi.node"]

[[tool.importlinter.contracts]]
# nodeapi imports contracts, the NATS client and the stdlib alone (r3 §16.2): the base and the Player
# each bundle it, so it reaches no context of either.
name = "The Node API library imports only contracts"
type = "forbidden"
source_modules = ["nodeapi"]
forbidden_modules = ["central", "media", "player", "appliance", "uplink", "psycopg", "procrastinate",
                     "fastapi", "httpx"]

[[tool.importlinter.contracts]]
# Retiring (r3 §16.1 B2b/B10a): the feed gains no importer; each line leaves with its importer.
name = "The feed is retiring: it gains no importer"
type = "protected"
protected_modules = ["appliance.feed", "appliance.feed_socket"]
allowed_importers = ["appliance.feed", "appliance.feed_socket"]
ignore_imports = [
  "appliance.display_host.runner -> appliance.feed",
  "appliance.display_host.runner -> appliance.feed_socket",
  "appliance.health.judge -> appliance.feed",
  "appliance.health.runner -> appliance.feed",
  "appliance.health.runner -> appliance.feed_socket",
  "appliance.node.app_link -> appliance.feed",
  "appliance.apps.broker_runner -> appliance.feed",
  "appliance.apps.broker_runner -> appliance.feed_socket",
  "appliance.apps.probe_channel -> appliance.feed",
]
